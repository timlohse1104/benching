<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analog Clock</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a1a2e;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    color: #e0e0e0;
  }
  #clock-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 24px;
  }
  #clock-svg {
    filter: drop-shadow(0 0 20px rgba(100, 140, 255, 0.15));
  }
  #digital-time {
    font-size: 28px;
    letter-spacing: 4px;
    color: #c8d6e5;
    text-shadow: 0 0 10px rgba(100, 140, 255, 0.3);
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<div id="clock-container">
  <svg id="clock-svg" width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <radialGradient id="faceGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#2a2a4a"/>
        <stop offset="100%" stop-color="#1a1a2e"/>
      </radialGradient>
      <radialGradient id="centerGrad" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#ff6b6b"/>
        <stop offset="100%" stop-color="#c0392b"/>
      </radialGradient>
    </defs>
    <!-- Clock face -->
    <circle cx="200" cy="200" r="190" fill="url(#faceGrad)" stroke="#3a3a5c" stroke-width="3"/>
    <circle cx="200" cy="200" r="185" fill="none" stroke="#2a2a4a" stroke-width="1"/>
    <!-- Tick marks group -->
    <g id="ticks"></g>
    <!-- Hour numbers -->
    <g id="hour-numbers" font-family="'Courier New', Courier, monospace" font-size="22" fill="#8a8ab0" text-anchor="middle" dominant-baseline="central"></g>
    <!-- Hands group -->
    <g id="hands">
      <line id="hour-hand" x1="200" y1="200" x2="200" y2="100" stroke="#e0e0e0" stroke-width="6" stroke-linecap="round"/>
      <line id="minute-hand" x1="200" y1="200" x2="200" y2="60" stroke="#c8d6e5" stroke-width="4" stroke-linecap="round"/>
      <line id="second-hand" x1="200" y1="220" x2="200" y2="55" stroke="#ff6b6b" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- Center dot -->
    <circle cx="200" cy="200" r="8" fill="url(#centerGrad)" stroke="#1a1a2e" stroke-width="2"/>
  </svg>
  <div id="digital-time">00:00:00</div>
</div>

<script>
(function() {
  const ticksGroup = document.getElementById('ticks');
  const numbersGroup = document.getElementById('hour-numbers');
  const hourHand = document.getElementById('hour-hand');
  const minuteHand = document.getElementById('minute-hand');
  const secondHand = document.getElementById('second-hand');
  const digitalTime = document.getElementById('digital-time');

  const cx = 200, cy = 200;

  // Generate tick marks
  for (let i = 0; i < 60; i++) {
    const angle = (i * 6) * Math.PI / 180;
    const isHour = i % 5 === 0;
    const outerR = 180;
    const innerR = isHour ? 162 : 170;
    const x1 = cx + outerR * Math.sin(angle);
    const y1 = cy - outerR * Math.cos(angle);
    const x2 = cx + innerR * Math.sin(angle);
    const y2 = cy - innerR * Math.cos(angle);

    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', isHour ? '#8a8ab0' : '#4a4a6a');
    line.setAttribute('stroke-width', isHour ? 3 : 1);
    line.setAttribute('stroke-linecap', 'round');
    ticksGroup.appendChild(line);
  }

  // Generate hour numbers
  for (let i = 1; i <= 12; i++) {
    const angle = (i * 30 - 90) * Math.PI / 180;
    const r = 145;
    const x = cx + r * Math.cos(angle);
    const y = cy + r * Math.sin(angle);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', x);
    text.setAttribute('y', y);
    text.textContent = i;
    numbersGroup.appendChild(text);
  }

  function pad(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  function updateClock() {
    const now = new Date();
    const hours = now.getHours();
    const minutes = now.getMinutes();
    const seconds = now.getSeconds();

    // Calculate angles
    const secondAngle = seconds * 6;
    const minuteAngle = (minutes + seconds / 60) * 6;
    const hourAngle = ((hours % 12) + minutes / 60) * 30;

    // Apply rotations using transform around center point
    secondHand.setAttribute('transform', 'rotate(' + secondAngle + ', ' + cx + ', ' + cy + ')');
    minuteHand.setAttribute('transform', 'rotate(' + minuteAngle + ', ' + cx + ', ' + cy + ')');
    hourHand.setAttribute('transform', 'rotate(' + hourAngle + ', ' + cx + ', ' + cy + ')');

    // Update digital display
    digitalTime.textContent = pad(hours) + ':' + pad(minutes) + ':' + pad(seconds);
  }

  updateClock();
  setInterval(updateClock, 1000);
})();
</script>
</body>
</html>
