<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Tree — L-System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a12;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#e0d8c8}
canvas{display:block}
#panel{position:fixed;top:20px;right:20px;width:280px;background:rgba(15,15,25,0.88);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08);border-radius:16px;padding:22px 20px;z-index:10;box-shadow:0 8px 32px rgba(0,0,0,0.5)}
#panel h2{font-size:15px;font-weight:600;margin-bottom:16px;color:#f0e6d3;letter-spacing:0.5px;display:flex;align-items:center;gap:8px}
#panel h2::before{content:'🌳';font-size:18px}
.ctrl{margin-bottom:14px}
.ctrl label{display:flex;justify-content:space-between;font-size:12px;color:#a89f91;margin-bottom:5px}
.ctrl label span{color:#d4a574;font-weight:600;min-width:40px;text-align:right}
input[type=range]{-webkit-appearance:none;width:100%;height:6px;border-radius:3px;background:rgba(255,255,255,0.08);outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:#d4a574;border:2px solid rgba(255,255,255,0.2);cursor:pointer;transition:transform .15s}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#d4a574;border:2px solid rgba(255,255,255,0.2);cursor:pointer}
.btn-row{display:flex;gap:8px;margin-top:18px}
button{flex:1;padding:10px 0;border:none;border-radius:10px;font-size:13px;font-weight:600;cursor:pointer;transition:all .2s;letter-spacing:0.3px}
#regenBtn{background:linear-gradient(135deg,#d4a574,#c17f4e);color:#1a1a2e}
#regenBtn:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(212,165,116,0.3)}
#pauseBtn{background:rgba(255,255,255,0.08);color:#a89f91;border:1px solid rgba(255,255,255,0.1)}
#pauseBtn:hover{background:rgba(255,255,255,0.12)}
select{width:100%;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#e0d8c8;font-size:12px;cursor:pointer;outline:none}
select option{background:#1a1a2e;color:#e0d8c8}
#status{margin-top:12px;font-size:11px;color:#6a6258;text-align:center;min-height:16px}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="panel">
  <h2>Fractal Tree</h2>
  <div class="ctrl">
    <label>Recursion Depth <span id="depthVal">9</span></label>
    <input type="range" id="depth" min="1" max="12" value="9" step="1">
  </div>
  <div class="ctrl">
    <label>Branch Angle <span id="angleVal">25°</span></label>
    <input type="range" id="angle" min="5" max="60" value="25" step="1">
  </div>
  <div class="ctrl">
    <label>Length Ratio <span id="ratioVal">0.72</span></label>
    <input type="range" id="ratio" min="50" max="85" value="72" step="1">
  </div>
  <div class="ctrl">
    <label>Randomness <span id="jitterVal">0.00</span></label>
    <input type="range" id="jitter" min="0" max="30" value="0" step="1">
  </div>
  <div class="ctrl">
    <label>Wind Strength <span id="windVal">0.30</span></label>
    <input type="range" id="wind" min="0" max="100" value="30" step="1">
  </div>
  <div class="ctrl">
    <label>Growth Speed <span id="speedVal">1.0</span></label>
    <input type="range" id="speed" min="1" max="50" value="10" step="1">
  </div>
  <div class="ctrl">
    <label>Theme</label>
    <select id="theme">
      <option value="autumn">🍂 Autumn</option>
      <option value="spring">🌸 Spring Blossom</option>
      <option value="winter">❄️ Winter</option>
      <option value="fantasy">✨ Fantasy</option>
      <option value="neon">🌈 Neon</option>
    </select>
  </div>
  <div class="btn-row">
    <button id="regenBtn">⟳ Regenerate</button>
    <button id="pauseBtn">⏸ Pause</button>
  </div>
  <div id="status">Ready</div>
</div>
<script>
(function(){
"use strict";
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);

let W,H;
function resize(){
  W=canvas.width=window.innerWidth;
  H=canvas.height=window.innerHeight;
}
resize();
window.addEventListener('resize',()=>{resize();if(segments.length)generate();});

// --- Seeded RNG ---
let seed=Math.random()*65536|0;
function mulberry32(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}

// --- L-System ---
function generateLString(axiom,rules,depth){
  let s=axiom;
  for(let i=0;i<depth;i++){
    let next='';
    for(let j=0;j<s.length;j++){
      next+=rules[s[j]]||s[j];
    }
    s=next;
  }
  return s;
}

// --- Segment storage ---
let segments=[];
let tips=[];
let paused=false;
let animProgress=0;
let totalSegs=0;
let lastTime=0;

const themes={
  autumn:{
    bg:['#1a1208','#2d1f0e','#0d0a04'],
    branch:[[0,'#3d1f0a'],[0.3,'#5c3317'],[0.6,'#8B4513'],[0.85,'#CD853F'],[1,'#DEB887']],
    leaf:[[0,'#c0392b'],[0.3,'#e67e22'],[0.6,'#f39c12'],[0.8,'#d4a574'],[1,'#e8c547']],
    ground:'#1a1208'
  },
  spring:{
    bg:['#0a1a1a','#0d2b1a','#0a1208'],
    branch:[[0,'#2d1f0a'],[0.3,'#4a3728'],[0.6,'#6B4226'],[0.85,'#8FBC8F'],[1,'#90EE90']],
    leaf:[[0,'#FFB7C5'],[0.3,'#FF69B4'],[0.6,'#FFC0CB'],[0.8,'#FFF0F5'],[1,'#FFD1DC']],
    ground:'#0d1a0d'
  },
  winter:{
    bg:['#0a0e1a','#141a2d','#0a0a12'],
    branch:[[0,'#2a2a3a'],[0.3,'#3a3a4a'],[0.6,'#5a5a6a'],[0.85,'#8a8a9a'],[1,'#c0c0d0']],
    leaf:[[0,'#e8e8f0'],[0.3,'#f0f0f8'],[0.6,'#d0d0e0'],[0.8,'#ffffff'],[1,'#e0e0f0']],
    ground:'#0a0a12'
  },
  fantasy:{
    bg:['#0a0515','#150a25','#0a0a1a'],
    branch:[[0,'#1a0a2e'],[0.3,'#2d1b4e'],[0.6,'#4a2d6e'],[0.85,'#7b4fa0'],[1,'#b388ff']],
    leaf:[[0,'#ff80ab'],[0.3,'#ea80fc'],[0.6,'#b388ff'],[0.8,'#82b1ff'],[1,'#80deea']],
    ground:'#0a0515'
  },
  neon:{
    bg:['#050508','#0a0a12','#050508'],
    branch:[[0,'#00ff88'],[0.3,'#00ccff'],[0.6,'#ff00aa'],[0.85,'#ffaa00'],[1,'#00ffcc']],
    leaf:[[0,'#00ff88'],[0.3,'#00ccff'],[0.6,'#ff00aa'],[0.8,'#ffaa00'],[1,'#ff00ff']],
    ground:'#050508'
  }
};

function lerpColor(stops,t){
  t=Math.max(0,Math.min(1,t));
  for(let i=0;i<stops.length-1;i++){
    if(t<=stops[i+1][0]){
      let f=(t-stops[i][0])/(stops[i+1][0]-stops[i][0]);
      let c1=hexToRgb(stops[i][1]),c2=hexToRgb(stops[i+1][1]);
      let r=Math.round(c1.r+(c2.r-c1.r)*f);
      let g=Math.round(c1.g+(c2.g-c1.g)*f);
      let b=Math.round(c1.b+(c2.b-c1.b)*f);
      return`rgb(${r},${g},${b})`;
    }
  }
  return stops[stops.length-1][1];
}

function hexToRgb(h){
  let r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16);
  return{r,g,b};
}

function getTheme(){return themes[$('theme').value]}

// --- Generate tree segments ---
function generate(){
  const depth=parseInt($('depth').value);
  const angle=parseFloat($('angle').value)*Math.PI/180;
  const ratio=parseFloat($('ratio').value)/100;
  const jitter=parseFloat($('jitter').value)/100;
  seed=Math.random()*65536|0;

  // L-system rules
  const axiom='F';
  const rules={F:'F[+F]F[-F]F'};
  const lStr=generateLString(axiom,rules,depth);

  // Turtle interpretation
  segments=[];
  tips=[];
  const stack=[];
  let x=W/2, y=H*0.88;
  let dir=-Math.PI/2; // pointing up
  let len=H*0.22;
  let currentDepth=0;

  // We'll build segments as we interpret
  let segIdx=0;

  for(let i=0;i<lStr.length;i++){
    const c=lStr[i];
    if(c==='F'){
      // Draw a segment
      const endX=x+Math.cos(dir)*len;
      const endY=y+Math.sin(dir)*len;
      segments.push({
        x1:x,y1:y,
        x2:endX,y2:endY,
        depth:currentDepth,
        angle:dir,
        length:len,
        idx:segIdx++
      });
      x=endX;
      y=endY;
    }else if(c==='+'){
      dir+=angle+(mulberry32()-0.5)*jitter;
    }else if(c==='-'){
      dir-=angle+(mulberry32()-0.5)*jitter;
    }else if(c==='['){
      stack.push({x,y,dir,len,depth:currentDepth});
      currentDepth++;
      len*=ratio;
    }else if(c===']'){
      const s=stack.pop();
      x=s.x;y=s.y;dir=s.dir;len=s.len;currentDepth=s.depth;
    }
  }

  // Find tips (last segment at each branch end)
  // A tip is a segment whose index is the last in its branch
  // We track which segments are tips by checking if the next segment is not a child
  // Simpler: tips are segments at max depth
  const maxDepth=depth;
  tips=segments.filter(s=>s.depth>=maxDepth-1);

  totalSegs=segments.length;
  animProgress=0;
  $('status').textContent=`${totalSegs.toLocaleString()} segments`;
}

// --- Drawing ---
function drawBackground(){
  const t=getTheme();
  const grad=ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0,t.bg[0]);
  grad.addColorStop(0.5,t.bg[1]);
  grad.addColorStop(1,t.bg[2]);
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);

  // Ground
  ctx.fillStyle=t.ground;
  ctx.beginPath();
  ctx.moveTo(0,H);
  ctx.lineTo(0,H*0.92);
  ctx.quadraticCurveTo(W*0.5,H*0.88,W,H*0.92);
  ctx.lineTo(W,H);
  ctx.fill();

  // Stars (subtle)
  if(getTheme()==='autumn'||getTheme()==='winter'||getTheme()==='fantasy'){
    ctx.fillStyle='rgba(255,255,255,0.3)';
    for(let i=0;i<60;i++){
      const sx=(i*137.5+50)%W;
      const sy=(i*97.3+20)%(H*0.4);
      const sr=0.5+(i%3)*0.5;
      ctx.beginPath();
      ctx.arc(sx,sy,sr,0,Math.PI*2);
      ctx.fill();
    }
  }
}

function drawWindOffset(seg,time,windStrength){
  const wind=windStrength*0.015;
  const sway=Math.sin(time*0.8+seg.depth*0.5)*wind*(seg.depth+1);
  return sway;
}

function drawTree(time){
  const theme=getTheme();
  const windStrength=parseFloat($('wind').value);
  const speed=parseFloat($('speed').value)/10;
  const maxDepth=parseInt($('depth').value);

  // Animate progress
  if(!paused){
    animProgress+=speed*0.02;
    if(animProgress>1)animProgress=1;
  }

  const visibleCount=Math.floor(animProgress*totalSegs);

  // Draw segments
  for(let i=0;i<visibleCount&&i<segments.length;i++){
    const seg=segments[i];
    const t=seg.depth/maxDepth;

    // Wind effect
    const windOff=drawWindOffset(seg,time,windStrength);
    const adjAngle=seg.angle+windOff;

    const ex=seg.x1+Math.cos(adjAngle)*seg.length;
    const ey=seg.y1+Math.sin(adjAngle)*seg.length;

    const color=lerpColor(theme.branch,t);
    const lineWidth=Math.max(0.5,(1-t)*4+0.5);

    ctx.beginPath();
    ctx.moveTo(seg.x1,seg.y1);
    ctx.lineTo(ex,ey);
    ctx.strokeStyle=color;
    ctx.lineWidth=lineWidth;
    ctx.lineCap='round';
    ctx.stroke();
  }

  // Draw leaves/blossoms at tips
  const leafCount=Math.floor(animProgress*tips.length);
  for(let i=0;i<leafCount&&i<tips.length;i++){
    const tip=tips[i];
    const windOff=drawWindOffset(tip,time,windStrength);
    const adjAngle=tip.angle+windOff;
    const tx=tip.x1+Math.cos(adjAngle)*tip.length;
    const ty=tip.y1+Math.sin(adjAngle)*tip.length;

    const t=tip.depth/maxDepth;
    const color=lerpColor(theme.leaf,t);
    const size=2+mulberry32()*2; // Use stored randomness

    ctx.beginPath();
    ctx.arc(tx,ty,size,0,Math.PI*2);
    ctx.fillStyle=color;
    ctx.globalAlpha=0.7+Math.sin(time*2+i)*0.15;
    ctx.fill();
    ctx.globalAlpha=1;
  }

  // Glow effect for neon theme
  if(theme===themes.neon){
    ctx.globalCompositeOperation='lighter';
    for(let i=0;i<visibleCount&&i<segments.length;i++){
      const seg=segments[i];
      const t=seg.depth/maxDepth;
      const windOff=drawWindOffset(seg,time,windStrength);
      const adjAngle=seg.angle+windOff;
      const ex=seg.x1+Math.cos(adjAngle)*seg.length;
      const ey=seg.y1+Math.sin(adjAngle)*seg.length;

      ctx.beginPath();
      ctx.moveTo(seg.x1,seg.y1);
      ctx.lineTo(ex,ey);
      ctx.strokeStyle=lerpColor(theme.branch,t);
      ctx.lineWidth=Math.max(0.5,(1-t)*4+0.5)+2;
      ctx.globalAlpha=0.15;
      ctx.stroke();
    }
    ctx.globalAlpha=1;
    ctx.globalCompositeOperation='source-over';
  }
}

// --- Animation loop ---
function animate(timestamp){
  if(!lastTime)lastTime=timestamp;
  const time=(timestamp-lastTime)/1000;

  drawBackground();
  drawTree(time);

  // Progress indicator
  if(!paused&&animProgress<1){
    const pct=Math.round(animProgress*100);
    $('status').textContent=`Growing... ${pct}% (${totalSegs.toLocaleString()} segments)`;
  }else if(paused){
    $('status').textContent='Paused';
  }else{
    $('status').textContent=`Complete — ${totalSegs.toLocaleString()} segments`;
  }

  requestAnimationFrame(animate);
}

// --- Controls ---
$('depth').addEventListener('input',e=>{$('depthVal').textContent=e.target.value;});
$('angle').addEventListener('input',e=>{$('angleVal').textContent=e.target.value+'°';});
$('ratio').addEventListener('input',e=>{$('ratioVal').textContent=(e.target.value/100).toFixed(2);});
$('jitter').addEventListener('input',e=>{$('jitterVal').textContent=(e.target.value/100).toFixed(2);});
$('wind').addEventListener('input',e=>{$('windVal').textContent=(e.target.value/100).toFixed(2);});
$('speed').addEventListener('input',e=>{$('speedVal').textContent=(e.target.value/10).toFixed(1);});

let regenTimeout;
$('depth').addEventListener('change',()=>{clearTimeout(regenTimeout);regenTimeout=setTimeout(generate,300)});
$('angle').addEventListener('change',()=>{clearTimeout(regenTimeout);regenTimeout=setTimeout(generate,300)});
$('ratio').addEventListener('change',()=>{clearTimeout(regenTimeout);regenTimeout=setTimeout(generate,300)});
$('jitter').addEventListener('change',()=>{clearTimeout(regenTimeout);regenTimeout=setTimeout(generate,300)});
$('theme').addEventListener('change',()=>{});

$('regenBtn').addEventListener('click',()=>{generate()});
$('pauseBtn').addEventListener('click',()=>{
  paused=!paused;
  $('pauseBtn').textContent=paused?'▶ Play':'⏸ Pause';
});

// --- Init ---
generate();
requestAnimationFrame(animate);

})();
</script>
</body>
</html>
