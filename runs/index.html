  // The run data is embedded at build time by reporter.py
  window.RESULTS = {"aggregate": true, "timestamp": "2026-08-21T16-02-45Z", "dry_run": false, "prompts": [{"id": "01-svg-clock", "body": "Build a self-contained HTML page showing a working analog clock rendered in SVG.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources.\n- One SVG analog clock, centered on the page, at least 320x320.\n- Hour, minute, and second hands. The second hand updates every 1 second.\n- Tick marks for every hour (longer) and every minute (shorter).\n- Display the current time digitally below the clock (HH:MM:SS, 24h).\n- Use a clean light-on-dark theme.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}, {"id": "02-fractal-tree", "body": "Build a self-contained HTML page that draws an animated fractal tree using an L-system on a Canvas.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources.\n- Render a recursive fractal tree on a <canvas>, generated from an L-system (axiom + rewrite rules) and drawn with turtle-style interpretation.\n- Animate the growth: branches extend and the tree unfolds over time via requestAnimationFrame, rather than appearing instantly.\n- A control panel with live sliders/inputs for at least: recursion depth, branch angle, length ratio between generations, and a randomness/jitter amount.\n- Color the branches by depth (e.g. trunk to twigs gradient) and optionally add leaves or blossoms at the tips.\n- A \"Regenerate\" button that redraws with the current settings and a fresh random seed.\n- Keep it performant and stable at higher depths (avoid freezing the page).\n- Use a pleasant background and color palette.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n\nCome up with an original, beautiful design and be creative."}, {"id": "03-tower-defense", "body": "Build a self-contained HTML page containing an iterative 2d tower defense game that has aspects of a rogue-like and replayability.\n\nRequirements:\n- style should be neon and low-poly.\n- one well designed level with a buildable grid\n- endless waves of enemies that are getting stronger wave by wave\n- at least 5 different enemies variants\n- at least 3 different upgradable turrets to build\n- turrets are endlessly upgradeable\n- a boss in each wave\n- skill tree that is upgradable between runs\n- a special feature (you decide what it is)\n\nCome up with an original idea and be creative."}, {"id": "04-particle-simulation", "body": "Build a self-contained HTML page with an interactive particle simulation rendered on a Canvas.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources.\n- A full-window <canvas> that continuously animates via requestAnimationFrame.\n- At least 300 particles that move with simple physics (velocity + gravity or drift) and wrap or bounce at the edges.\n- Mouse interaction: particles are attracted to or repelled from the cursor while the mouse moves over the canvas.\n- A small on-screen control panel to adjust at least two parameters live (e.g. particle count, gravity, attraction strength).\n- A live FPS counter shown in a corner.\n- Use a clean dark theme with subtly colored particles.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}, {"id": "05-game-of-life", "body": "Build a self-contained HTML page implementing Conway's Game of Life on a Canvas.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources.\n- A grid of at least 60x40 cells rendered on a <canvas>, with clearly visible cell borders.\n- Standard Conway rules (B3/S23), stepped on a fixed tick via requestAnimationFrame or setInterval.\n- Controls: Start/Pause, Step (advance one generation), Clear, and Randomize.\n- A speed slider that changes the simulation tick rate live.\n- Click or drag on the grid to toggle cells while paused.\n- At least two preset patterns selectable from a dropdown (e.g. Glider, Pulsar) that load onto the grid.\n- Show a live generation counter and the current population count.\n- Use a clean dark theme with clearly contrasting alive cells.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}, {"id": "06-physics-sandbox", "body": "Build a self-contained HTML page with a 2D physics sandbox of bouncing balls on a Canvas.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources.\n- A full-window <canvas> animated via requestAnimationFrame.\n- Balls of varying radius that fall under gravity, bounce off the walls and floor with energy loss (restitution), and collide with each other (circle-circle collision response).\n- Click on the canvas to spawn a new ball; click-drag to fling it with an initial velocity based on the drag vector.\n- A control panel to adjust at least three parameters live: gravity, restitution (bounciness), and friction.\n- Buttons to reset the scene and to toggle collisions between balls on/off.\n- Balls have distinct colors; show a live count of active balls.\n- Keep the simulation stable with dozens of balls (no runaway energy or tunneling through walls).\n- Use a clean dark theme.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}, {"id": "07-deskbox-clone", "body": "Build a self-contained HTML page that recreates the marketing homepage of \"desk.box\" (deskbox-office.de) as faithfully as possible from the description below.\n\nContext: desk.box is a German office software for agriculture (\"Die smarte B\u00fcrosoftware f\u00fcr die Landwirtschaft\"). Reproduce the German copy verbatim where quoted. Match the layout, section order, and visual hierarchy of a modern SaaS landing page.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources (no external images, fonts, or scripts). Replace every image, logo, screenshot, and video with an inline SVG placeholder or a CSS-styled box that carries a matching label.\n- Sticky top header with: a \"desk.box\" wordmark logo (left), a navigation bar with items \"Funktionen\", \"Preise\", \"Service\" (each with a dropdown caret), a \"Login\" link, and a prominent \"Jetzt testen\" call-to-action button.\n- Hero section: headline \"desk.box \u2013 Die smarte B\u00fcrosoftware f\u00fcr die Landwirtschaft\", three trust badges (\"GoBD zertifiziert\", \"Server in Deutschland\", \"E-Rechnung\"), a paragraph of body copy, and two buttons \"Kostenlos beraten lassen\" and \"Jetzt kostenlos testen\". Include a placeholder image of a person on one side and a product-screenshot placeholder with a \"Video abspielen\" play button overlay.\n- A row of at least eight feature bullets, each with a small inline-SVG icon, e.g. \"Direkte Schnittstelle zu deinem Steuerb\u00fcro\", \"E-Rechnung inklusive\", \"Vollst\u00e4ndiges Banking\", \"Intelligente Volltextsuche durch alle Dokumente\", \"Alle deine Betriebe auf einen Blick\", \"Einfacher Workflow\", \"Alle Dokumente in deiner Hosentasche\", \"Sichere und gesetzeskonforme Archivierung\".\n- A \"Das bietet dir desk.box\" section with five feature cards: Schreibtisch, Banking, Aktenschrank, Faktura, Adressbuch \u2014 each with an icon placeholder, a short German description, and a \"Mehr erfahren\" link.\n- A customer-testimonials section with at least four named quotes (e.g. \"Nico Ahlmann, Hof Ahlmann Gro\u00df Tessin\").\n- A blog/news teaser grid with at least three cards (image placeholder, headline, teaser text, \"Weiterlesen\" link).\n- A \"60 Tage kostenlos testen\" call-to-action band with a \"Jetzt registrieren\" button.\n- A footer with: the desk.box logo, two certification badge placeholders, contact details (phone \"+49(0)431 / 530 154 18\", email \"support(at)deskbox-office.de\", \"Supportzeiten: Mo bis Fr: 08:00 - 16:00 Uhr\"), social links (LinkedIn, Instagram, YouTube, Facebook, WhatsApp), footer navigation, and the copyright line \"\u00a9 2026 stadt.werk konzeption.text.gestaltung GmbH\".\n- The nav dropdowns must open on hover or click via inline JS. The layout must be responsive and collapse the nav into a hamburger menu on narrow viewports.\n- Use only system fonts. Choose a clean, professional color palette consistent with a business SaaS product.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}, {"id": "08-paint-app", "body": "Build a self-contained HTML page implementing a drawing/paint application on a Canvas.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources.\n- A main <canvas> drawing surface, at least 800x600, on a clearly bordered stage.\n- Freehand brush drawing with smooth lines that follow the mouse (and touch, if feasible).\n- A toolbar with: brush tool, eraser tool, an adjustable brush size (slider), a color picker, and a small preset color palette.\n- Undo and Redo buttons that step through the drawing history correctly.\n- A Clear button that empties the canvas (with the current background).\n- A \"Save as PNG\" button that exports the current canvas as a downloadable .png via a data URL.\n- Show the current brush size and selected color somewhere in the UI.\n- Use a clean, uncluttered light theme for the tool chrome.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}, {"id": "09-violin-3d", "body": "Build a self-contained HTML page featuring a playable violin rendered as an interactive 3D model.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources (no CDN, no external libraries, textures, or audio files). Use raw We
