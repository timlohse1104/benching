<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vanilla Markdown Editor</title>
    <style>
        :root {
            --bg-color: #f5f7fa;
            --editor-bg: #ffffff;
            --text-color: #2c3e50;
            --border-color: #dcdfe6;
            --accent-color: #409eff;
            --header-bg: #34495e;
            --code-bg: #f0f0f0;
        }

        * { box-sizing: border-box; }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            color: var(--text-color);
            background-color: var(--bg-color);
            overflow: hidden;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            background-color: var(--header-bg);
            color: white;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 10;
        }

        .brand {
            font-weight: bold;
            font-size: 1.2rem;
        }

        .toolbar {
            display: flex;
            gap: 15px;
            align-items: center;
        }

        .stats {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #66b1ff;
        }

        .main-content {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        .pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
        }

        #editor {
            width: 100%;
            height: 100%;
            padding: 20px;
            border: none;
            border-right: 1px solid var(--border-color);
            resize: none;
            outline: none;
            font-family: 'Courier New', Courier, monospace;
            font-size: 16px;
            line-height: 1.5;
            background-color: var(--editor-bg);
        }

        #preview {
            width: 100%;
            height: 100%;
            padding: 20px 40px;
            overflow-y: auto;
            background-color: white;
            line-height: 1.6;
        }

        /* Markdown Preview Styling */
        #preview h1, #preview h2, #preview h3, #preview h4, #preview h5, #preview h6 {
            margin-top: 24px;
            margin-bottom: 16px;
            font-weight: 600;
            line-height: 1.25;
        }
        #preview h1 { font-size: 2em; border-bottom: 1px solid #eaecef; padding-bottom: .3em; }
        #preview h2 { font-size: 1.5em; border-bottom: 1px solid #eaecef; padding-bottom: .3em; }
        #preview p { margin-bottom: 16px; }
        #preview code {
            padding: .2em .4em;
            background-color: var(--code-bg);
            border-radius: 3px;
            font-family: monospace;
            font-size: 85%;
        }
        #preview pre {
            padding: 16px;
            overflow: auto;
            background-color: var(--code-bg);
            border-radius: 6px;
            line-height: 1.45;
            margin-bottom: 16px;
        }
        #preview pre code {
            padding: 0;
            background-color: transparent;
            font-size: 100%;
        }
        #preview blockquote {
            padding: 0 1em;
            color: #6a737d;
            border-left: .25em solid #dfe2e5;
            margin: 0 0 16px 0;
        }
        #preview ul, #preview ol {
            padding-left: 2em;
            margin-bottom: 16px;
        }
        #preview hr {
            height: .25em;
            padding: 0;
            margin: 24px 0;
            background-color: #e1e4e8;
            border: 0;
        }
        #preview img {
            max-width: 100%;
            height: auto;
            display: block;
            margin: 1em 0;
        }
        #preview a {
            color: #0366d6;
            text-decoration: none;
        }
        #preview a:hover {
            text-decoration: underline;
        }

        @media (max-width: 768px) {
            .main-content {
                flex-direction: column;
            }
            #editor {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                height: 50%;
            }
            #preview {
                height: 50%;
            }
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <div class="brand">MDLive Editor</div>
            <div class="toolbar">
                <div class="stats" id="stats">Words: 0 | Chars: 0</div>
                <button id="copyBtn">Copy HTML</button>
            </div>
        </header>
        <div class="main-content">
            <div class="pane">
                <textarea id="editor" spellcheck="false"></textarea>
            </div>
            <div class="pane">
                <div id="preview"></div>
            </div>
        </div>
    </div>

    <script>
        const editor = document.getElementById('editor');
        const preview = document.getElementById('preview');
        const stats = document.getElementById('stats');
        const copyBtn = document.getElementById('copyBtn');

        const sampleMarkdown = `# Welcome to Vanilla MD Editor!

This is a custom-built Markdown editor implemented entirely in vanilla JavaScript.

## Supported Features

You can use **bold text**, *italic text*, or ~~strikethrough~~ (not required but fun). 

### Lists
**Unordered List:**
* Item one
* Item two
  * Nested item (simple support)
* Item three

**Ordered List:**
1. First step
2. Second step
3. Third step

### Code & Formatting
You can write \`inline code\` easily. For larger blocks, use fenced code blocks:

\`\`\`javascript
function helloWorld() {
  console.log("Hello from the preview!");
  return true;
}
\`\`\`

### Other Elements
> "This is a blockquote. It's great for highlighting quotes or important notes."

You can add [links to websites](https://google.com) or display images:

![Placeholder Image](https://via.placeholder.com/150)

---

#### Summary Table of Basics
- **Header**: # to ######
- **Emphasis**: *italic*, **bold**
- **Lists**: * or 1.
- **Misc**: > blockquotes, \`code\`, --- rules

Enjoy writing!`;

        function escapeHTML(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function parseMarkdown(markdown) {
            let html = escapeHTML(markdown);

            // 1. Fenced Code Blocks
            html = html.replace(/^```(?:[a-z]*)\n([\s\S]*?)\n```/gm, '<pre><code>$1</code></pre>');

            // 2. Headings
            html = html.replace(/^###### (.*$)/gm, '<h6>$1</h6>');
            html = html.replace(/^##### (.*$)/gm, '<h5>$1</h5>');
            html = html.replace(/^#### (.*$)/gm, '<h4>$1</h4>');
            html = html.replace(/^### (.*$)/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gm, '<h1>$1</h1>');

            // 3. Horizontal Rules
            html = html.replace(/^---$/gm, '<hr>');

            // 4. Blockquotes
            html = html.replace(/^> (.*$)/gm, '<blockquote>$1</blockquote>');
            // Merge consecutive blockquotes
            html = html.replace(/<\/blockquote>\n<blockquote>/g, '<br>');

            // 5. Lists (Unordered)
            html = html.replace(/^\s*[\*\-]\s+(.*)$/gm, '<ul><li>$1</li></ul>');
            html = html.replace(/<\/ul>\n<ul>/g, '');

            // 6. Lists (Ordered)
            html = html.replace(/^\s*\d+\.\s+(.*)$/gm, '<ol><li>$1</li></ol>');
            html = html.replace(/<\/ol>\n<ol>/g, '');

            // 7. Inline Elements
            // Images: ![alt](url)
            html = html.replace(/!\[(.*?)\]\((.*?)\)/g, '<img src="$2" alt="$1">');
            // Links: [text](url)
            html = html.replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>');
            // Bold: **text**
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Italic: *text*
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            // Inline Code: `text`
            html = html.replace(/`(.*?)`/g, '<code>$1</code>');

            // 8. Paragraphs
            // Split by double newline, wrap segments that aren't already wrapped in block tags
            const lines = html.split(/\n\n+/);
            const processedLines = lines.map(line => {
                if (/^<(h1|h2|h3|h4|h5|h6|pre|blockquote|ul|ol|hr)/.test(line.trim())) {
                    return line;
                }
                return `<p>${line.replace(/\n/g, '<br>')}</p>`;
            });

            return processedLines.join('\n');
        }

        function update() {
            const text = editor.value;
            preview.innerHTML = parseMarkdown(text);

            // Stats
            const charCount = text.length;
            const wordCount = text.trim() === '' ? 0 : text.trim().split(/\s+/).length;
            stats.innerText = `Words: ${wordCount} | Chars: ${charCount}`;
        }

        async function copyToClipboard() {
            try {
                await navigator.clipboard.writeText(preview.innerHTML);
                const originalText = copyBtn.innerText;
                copyBtn.innerText = 'Copied!';
                setTimeout(() => copyBtn.innerText = originalText, 2000);
            } catch (err) {
                alert('Failed to copy HTML');
            }
        }

        editor.addEventListener('input', update);
        copyBtn.addEventListener('click', copyToClipboard);

        // Initialization
        editor.value = sampleMarkdown;
        update();
    </script>
</body>
</html>
