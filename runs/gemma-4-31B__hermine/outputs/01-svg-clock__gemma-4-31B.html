<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        body {
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #clock-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        svg {
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
        }
        #digital-time {
            font-family: 'Courier New', Courier, monospace;
            font-size: 2rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 10px rgba(0, 255, 204, 0.5);
        }
    </style>
</head>
<body>

    <div id="clock-container">
        <svg width="400" height="400" viewBox="0 0 400 400">
            <!-- Outer Circle -->
            <circle cx="200" cy="200" r="190" stroke="#333" stroke-width="8" fill="#1a1a1a" />
            <circle cx="200" cy="200" r="185" stroke="#444" stroke-width="2" fill="none" />

            <!-- Ticks -->
            <g id="ticks"></g>

            <!-- Hour Hand -->
            <line id="hour-hand" x1="200" y1="200" x2="200" y2="130" stroke="#ffffff" stroke-width="8" stroke-linecap="round" />
            
            <!-- Minute Hand -->
            <line id="min-hand" x1="200" y1="200" x2="200" y2="80" stroke="#cccccc" stroke-width="5" stroke-linecap="round" />
            
            <!-- Second Hand -->
            <line id="sec-hand" x1="200" y1="200" x2="200" y2="70" stroke="#ff4d4d" stroke-width="2" stroke-linecap="round" />
            
            <!-- Center Cap -->
            <circle cx="200" cy="200" r="6" fill="#ff4d4d" />
            <circle cx="200" cy="200" r="3" fill="#121212" />
        </svg>
        <div id="digital-time">00:00:00</div>
    </div>

    <script>
        const ticksContainer = document.getElementById('ticks');
        const hourHand = document.getElementById('hour-hand');
        const minHand = document.getElementById('min-hand');
        const secHand = document.getElementById('sec-hand');
        const digitalDisplay = document.getElementById('digital-time');

        // Generate ticks
        for (let i = 0; i < 60; i++) {
            const angle = i * 6;
            const isHour = i % 5 === 0;
            const length = isHour ? 15 : 7;
            const width = isHour ? 4 : 2;
            
            const x1 = 200 + 185 * Math.sin(angle * Math.PI / 180);
            const y1 = 200 - 185 * Math.cos(angle * Math.PI / 180);
            const x2 = 200 + (185 - length) * Math.sin(angle * Math.PI / 180);
            const y2 = 200 - (185 - length) * Math.cos(angle * Math.PI / 180);
            
            const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
            line.setAttribute("x1", x1);
            line.setAttribute("y1", y1);
            line.setAttribute("x2", x2);
            line.setAttribute("y2", y2);
            line.setAttribute("stroke", isHour ? "#ffffff" : "#666");
            line.setAttribute("stroke-width", width);
            line.setAttribute("stroke-linecap", "round");
            ticksContainer.appendChild(line);
        }

        function updateClock() {
            const now = new Date();
            const seconds = now.getSeconds();
            const minutes = now.getMinutes();
            const hours = now.getHours();

            // Analog calculations
            const secDeg = seconds * 6;
            const minDeg = minutes * 6 + seconds * 0.1;
            const hourDeg = (hours % 12) * 30 + minutes * 0.5;

            secHand.setAttribute('transform', `rotate(${secDeg}, 200, 200)`);
            minHand.setAttribute('transform', `rotate(${minDeg}, 200, 200)`);
            hourHand.setAttribute('transform', `rotate(${hourDeg}, 200, 200)`);

            // Digital display
            const hStr = String(hours).padStart(2, '0');
            const mStr = String(minutes).padStart(2, '0');
            const sStr = String(seconds).padStart(2, '0');
            digitalDisplay.textContent = `${hStr}:${mStr}:${sStr}`;
        }

        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
