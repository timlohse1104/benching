<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProDraw Canvas</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --panel-color: #ffffff;
            --accent-color: #007bff;
            --border-color: #ddd;
            --text-color: #333;
            --shadow: 0 4px 12px rgba(0,0,0,0.1);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 1100px;
            height: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        #toolbar {
            background: var(--panel-color);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
            z-index: 10;
        }

        .tool-group {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 0 10px;
            border-right: 1px solid var(--border-color);
        }

        .tool-group:last-child {
            border-right: none;
        }

        .label {
            font-size: 13px;
            font-weight: 600;
            color: #666;
            margin-right: 5px;
        }

        button {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            background: #fff;
            cursor: pointer;
            border-radius: 6px;
            font-size: 14px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        button:hover {
            background: #f8f9fa;
            border-color: #bbb;
        }

        button.active {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        input[type="color"] {
            border: none;
            width: 30px;
            height: 30px;
            cursor: pointer;
            background: none;
        }

        .palette {
            display: flex;
            gap: 5px;
        }

        .swatch {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 1px solid rgba(0,0,0,0.1);
            transition: transform 0.1s;
        }

        .swatch:hover {
            transform: scale(1.2);
        }

        #canvas-stage {
            position: relative;
            background: white;
            border: 12px solid #fff;
            box-shadow: var(--shadow);
            border-radius: 8px;
            margin: 0 auto;
            cursor: crosshair;
            touch-action: none;
            overflow: hidden;
            display: flex;
            justify-content: center;
        }

        canvas {
            display: block;
            background-color: white;
        }

        #status-bar {
            margin-top: 15px;
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
            color: #666;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-preview {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            border: 1px solid #ccc;
        }

        #save-btn {
            background: #28a745;
            color: white;
            border-color: #28a745;
        }
        #save-btn:hover {
            background: #218838;
            border-color: #218838;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="toolbar">
            <div class="tool-group">
                <span class="label">Tools</span>
                <button id="brush-tool" class="active">🖌️ Brush</button>
                <button id="eraser-tool">🧽 Eraser</button>
            </div>

            <div class="tool-group">
                <span class="label">Size</span>
                <input type="range" id="size-slider" min="1" max="50" value="5">
                <span id="size-display">5px</span>
            </div>

            <div class="tool-group">
                <span class="label">Color</span>
                <input type="color" id="color-picker" value="#000000">
                <div class="palette" id="palette">
                    <!-- Swatches injected by JS -->
                </div>
            </div>

            <div class="tool-group">
                <span class="label">Actions</span>
                <button id="undo-btn">↩️ Undo</button>
                <button id="redo-btn">↪️ Redo</button>
                <button id="clear-btn">🗑️ Clear</button>
                <button id="save-btn">💾 Save PNG</button>
            </div>
        </div>

        <div id="canvas-stage">
            <canvas id="paint-canvas" width="800" height="600"></canvas>
        </div>

        <div id="status-bar">
            <div class="status-item">
                <span>Current Color:</span>
                <div id="active-color-preview" class="color-preview"></div>
                <span id="color-hex">#000000</span>
            </div>
            <div class="status-item">
                <span>Brush Size:</span>
                <span id="active-size-text">5px</span>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('paint-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const sizeSlider = document.getElementById('size-slider');
        const sizeDisplay = document.getElementById('size-display');
        const activeSizeText = document.getElementById('active-size-text');
        const colorPicker = document.getElementById('color-picker');
        const colorHex = document.getElementById('color-hex');
        const colorPreview = document.getElementById('active-color-preview');
        const brushBtn = document.getElementById('brush-tool');
        const eraserBtn = document.getElementById('eraser-tool');
        const undoBtn = document.getElementById('undo-btn');
        const redoBtn = document.getElementById('redo-btn');
        const clearBtn = document.getElementById('clear-btn');
        const saveBtn = document.getElementById('save-btn');
        const paletteContainer = document.getElementById('palette');

        // App State
        let isDrawing = false;
        let currentTool = 'brush';
        let currentColor = '#000000';
        let currentSize = 5;
        let history = [];
        let redoStack = [];
        const MAX_HISTORY = 50;

        const presetColors = [
            '#000000', '#ff0000', '#00ff00', '#0000ff', 
            '#ffff00', '#ffa500', '#800080', '#a52a2a', 
            '#ffffff', '#808080'
        ];

        // Initialize
        function init() {
            // Fill white background initially
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Setup palette
            presetColors.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'swatch';
                swatch.style.backgroundColor = color;
                swatch.onclick = () => setColor(color);
                paletteContainer.appendChild(swatch);
            });

            updateStatus();
            saveState();
        }

        function updateStatus() {
            sizeDisplay.textContent = `${currentSize}px`;
            activeSizeText.textContent = `${currentSize}px`;
            colorHex.textContent = currentColor;
            colorPreview.style.backgroundColor = currentColor;
        }

        function setColor(color) {
            currentColor = color;
            colorPicker.value = color;
            updateStatus();
            if (currentTool === 'eraser') {
                currentTool = 'brush';
                brushBtn.classList.add('active');
                eraserBtn.classList.remove('active');
            }
        }

        function saveState() {
            history.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
            if (history.length > MAX_HISTORY) history.shift();
            redoStack = []; // Clear redo on new action
        }

        function undo() {
            if (history.length > 1) {
                redoStack.push(history.pop());
                const state = history[history.length - 1];
                ctx.putImageData(state, 0, 0);
            }
        }

        function redo() {
            if (redoStack.length > 0) {
                const state = redoStack.pop();
                history.push(state);
                ctx.putImageData(state, 0, 0);
            }
        }

        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: clientX - rect.left,
                y: clientY - rect.top
            };
        }

        function startDrawing(e) {
            isDrawing = true;
            const { x, y } = getCoords(e);
            
            // Save state before starting the stroke
            saveState();

            ctx.beginPath();
            ctx.moveTo(x, y);
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = currentSize;
            ctx.strokeStyle = currentTool === 'eraser' ? '#ffffff' : currentColor;
            
            // Small dot for single click
            ctx.lineTo(x, y);
            ctx.stroke();
        }

        function draw(e) {
            if (!isDrawing) return;
            const { x, y } = getCoords(e);
            
            ctx.lineTo(x, y);
            ctx.stroke();
            e.preventDefault(); // Prevent scrolling on touch
        }

        function stopDrawing() {
            if (isDrawing) {
                isDrawing = false;
                ctx.closePath();
            }
        }

        // Event Listeners
        canvas.addEventListener('mousedown', startDrawing);
        window.addEventListener('mousemove', draw);
        window.addEventListener('mouseup', stopDrawing);

        canvas.addEventListener('touchstart', (e) => {
            startDrawing(e);
            e.preventDefault();
        }, { passive: false });
        window.addEventListener('touchmove', draw, { passive: false });
        window.addEventListener('touchend', stopDrawing);

        sizeSlider.oninput = (e) => {
            currentSize = e.target.value;
            updateStatus();
        };

        colorPicker.oninput = (e) => {
            setColor(e.target.value);
        };

        brushBtn.onclick = () => {
            currentTool = 'brush';
            brushBtn.classList.add('active');
            eraserBtn.classList.remove('active');
        };

        eraserBtn.onclick = () => {
            currentTool = 'eraser';
            eraserBtn.classList.add('active');
            brushBtn.classList.remove('active');
        };

        undoBtn.onclick = undo;
        redoBtn.onclick = redo;

        clearBtn.onclick = () => {
            if(confirm('Clear entire canvas?')) {
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                saveState();
            }
        };

        saveBtn.onclick = () => {
            const link = document.createElement('a');
            link.download = 'my-drawing.png';
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        init();
    </script>
</body>
</html>
