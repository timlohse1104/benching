<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-color: #1e1e1e;
            --accent-color: #00ffcc;
            --text-color: #e0e0e0;
            --border-color: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            background-color: var(--panel-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            align-items: center;
            justify-content: center;
        }

        .stats {
            display: flex;
            gap: 20px;
            justify-content: center;
            font-family: monospace;
            font-size: 1.1rem;
        }

        .stat-item span {
            color: var(--accent-color);
            font-weight: bold;
        }

        canvas {
            border: 2px solid var(--border-color);
            cursor: crosshair;
            image-rendering: pixelated;
            background-color: #000;
        }

        button {
            background-color: #333;
            color: white;
            border: 1px solid #444;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
            min-width: 80px;
        }

        button:hover {
            background-color: #444;
            border-color: var(--accent-color);
        }

        button.primary {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            font-weight: bold;
        }

        button.primary:hover {
            background-color: #00d8aa;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        input[type="range"] {
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        select {
            background-color: #333;
            color: white;
            border: 1px solid #444;
            padding: 7px;
            border-radius: 4px;
            cursor: pointer;
        }

        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="stats">
            <div class="stat-item">Generation: <span id="genCount">0</span></div>
            <div class="stat-item">Population: <span id="popCount">0</span></div>
        </div>

        <canvas id="gameCanvas"></canvas>

        <div class="controls">
            <button id="btnPlayPause" class="primary">Start</button>
            <button id="btnStep">Step</button>
            <button id="btnRandom">Randomize</button>
            <button id="btnClear">Clear</button>
            
            <div class="slider-container">
                <span class="label">Speed</span>
                <input type="range" id="speedSlider" min="1" max="60" value="30">
            </div>

            <div class="slider-container">
                <span class="label">Preset</span>
                <select id="presetSelect">
                    <option value="">None</option>
                    <option value="glider">Glider</option>
                    <option value="pulsar">Pulsar</option>
                    <option value="gosper">Gosper Glider Gun</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const genDisplay = document.getElementById('genCount');
        const popDisplay = document.getElementById('popCount');
        const btnPlayPause = document.getElementById('btnPlayPause');
        const btnStep = document.getElementById('btnStep');
        const btnRandom = document.getElementById('btnRandom');
        const btnClear = document.getElementById('btnClear');
        const speedSlider = document.getElementById('speedSlider');
        const presetSelect = document.getElementById('presetSelect');

        const COLS = 80;
        const ROWS = 50;
        const CELL_SIZE = 10;

        canvas.width = COLS * CELL_SIZE;
        canvas.height = ROWS * CELL_SIZE;

        let grid = createGrid();
        let isRunning = false;
        let generation = 0;
        let lastTick = 0;
        let isDrawing = false;
        let drawState = 1;

        function createGrid() {
            return Array.from({ length: ROWS }, () => new Array(COLS).fill(0));
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let population = 0;

            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    ctx.strokeStyle = '#222';
                    ctx.strokeRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);

                    if (grid[r][c] === 1) {
                        ctx.fillStyle = '#00ffcc';
                        ctx.fillRect(c * CELL_SIZE + 1, r * CELL_SIZE + 1, CELL_SIZE - 2, CELL_SIZE - 2);
                        population++;
                    }
                }
            }
            popDisplay.innerText = population;
            genDisplay.innerText = generation;
        }

        function update() {
            const nextGrid = createGrid();
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const neighbors = countNeighbors(r, c);
                    if (grid[r][c] === 1) {
                        nextGrid[r][c] = (neighbors === 2 || neighbors === 3) ? 1 : 0;
                    } else {
                        nextGrid[r][c] = (neighbors === 3) ? 1 : 0;
                    }
                }
            }
            grid = nextGrid;
            generation++;
        }

        function countNeighbors(r, c) {
            let count = 0;
            for (let i = -1; i <= 1; i++) {
                for (let j = -1; j <= 1; j++) {
                    if (i === 0 && j === 0) continue;
                    const row = (r + i + ROWS) % ROWS;
                    const col = (c + j + COLS) % COLS;
                    count += grid[row][col];
                }
            }
            return count;
        }

        function gameLoop(timestamp) {
            if (isRunning) {
                const interval = 1000 / parseInt(speedSlider.value);
                if (timestamp - lastTick > interval) {
                    update();
                    draw();
                    lastTick = timestamp;
                }
            } else {
                draw();
            }
            requestAnimationFrame(gameLoop);
        }

        // Interactions
        function handleInput(e) {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const c = Math.floor(x / CELL_SIZE);
            const r = Math.floor(y / CELL_SIZE);

            if (r >= 0 && r < ROWS && c >= 0 && c < COLS) {
                if (e.type === 'mousedown') {
                    drawState = grid[r][c] === 1 ? 0 : 1;
                }
                grid[r][c] = drawState;
                draw();
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            isDrawing = true;
            handleInput(e);
        });

        window.addEventListener('mousemove', (e) => {
            if (isDrawing) handleInput(e);
        });

        window.addEventListener('mouseup', () => {
            isDrawing = false;
        });

        btnPlayPause.addEventListener('click', () => {
            isRunning = !isRunning;
            btnPlayPause.innerText = isRunning ? 'Pause' : 'Start';
            btnPlayPause.classList.toggle('primary');
        });

        btnStep.addEventListener('click', () => {
            if (!isRunning) {
                update();
                draw();
            }
        });

        btnRandom.addEventListener('click', () => {
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    grid[r][c] = Math.random() > 0.85 ? 1 : 0;
                }
            }
            generation = 0;
            draw();
        });

        btnClear.addEventListener('click', () => {
            grid = createGrid();
            generation = 0;
            isRunning = false;
            btnPlayPause.innerText = 'Start';
            btnPlayPause.classList.add('primary');
            draw();
        });

        presetSelect.addEventListener('change', (e) => {
            const type = e.target.value;
            grid = createGrid();
            generation = 0;

            if (type === 'glider') {
                const pts = [[0,1], [1,2], [2,0], [2,1], [2,2]];
                pts.forEach(([r, c]) => grid[r + 2][c + 2] = 1);
            } else if (type === 'pulsar') {
                const p = [
                    [2,4], [2,5], [2,6], [7,4], [7,5], [7,6],
                    [4,2], [5,2], [6,2], [4,7], [5,7], [6,7],
                    [3,10], [3,11], [3,12], [8,10], [8,11], [8,12],
                    [10,3], [11,3], [12,3], [10,8], [11,8], [12,8]
                ];
                p.forEach(([r, c]) => grid[r + 2][c + 2] = 1);
            } else if (type === 'gosper') {
                const pts = [
                    [5,1], [5,2], [6,1], [6,2],
                    [5,11], [6,11], [7,11], [4,12], [8,12], [3,13], [9,13], [3,14], [9,14], [6,14], [4,14], [8,14],
                    [5,15], [6,15], [7,15], [5,16], [6,16], [7,16],
                    [8,16], [8,17], [6,17], [6,18]
                ];
                pts.forEach(([r, c]) => grid[r + 2][c + 2] = 1);
            }
            draw();
        });

        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
