<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conway's Game of Life</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-color: #1e1e1e;
            --accent-color: #00ff88;
            --text-color: #e0e0e0;
            --border-color: #333;
            --button-hover: #333;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
            background: var(--panel-color);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .stats {
            display: flex;
            gap: 30px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 1.1rem;
            font-weight: bold;
            color: var(--accent-color);
        }

        canvas {
            border: 2px solid var(--border-color);
            background-color: #000;
            cursor: crosshair;
            image-rendering: pixelated;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            align-items: center;
        }

        button, select {
            background: #2a2a2a;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        button:hover {
            background: #3a3a3a;
            border-color: var(--accent-color);
        }

        button:active {
            transform: translateY(1px);
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
        }

        input[type=range] {
            cursor: pointer;
            accent-color: var(--accent-color);
        }

        .label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin-bottom: 4px;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="stats">
        <span>Gen: <span id="gen-count">0</span></span>
        <span>Pop: <span id="pop-count">0</span></span>
    </div>

    <canvas id="gridCanvas"></canvas>

    <div class="controls">
        <button id="btn-start">Start</button>
        <button id="btn-step">Step</button>
        <button id="btn-clear">Clear</button>
        <button id="btn-random">Randomize</button>
        
        <div class="slider-container">
            <label>Speed</label>
            <input type="range" id="speed-slider" min="1" max="60" value="30">
        </div>

        <select id="pattern-select">
            <option value="none">Select Pattern</option>
            <option value="glider">Glider</option>
            <option value="pulsar">Pulsar</option>
        </select>
    </div>
</div>

<script>
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');
    const btnStart = document.getElementById('btn-start');
    const btnStep = document.getElementById('btn-step');
    const btnClear = document.getElementById('btn-clear');
    const btnRandom = document.getElementById('btn-random');
    const speedSlider = document.getElementById('speed-slider');
    const patternSelect = document.getElementById('pattern-select');
    const genDisplay = document.getElementById('gen-count');
    const popDisplay = document.getElementById('pop-count');

    const ROWS = 40;
    const COLS = 60;
    const CELL_SIZE = 12;

    canvas.width = COLS * CELL_SIZE;
    canvas.height = ROWS * CELL_SIZE;

    let grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
    let isRunning = false;
    let generation = 0;
    let lastTick = 0;
    let isMouseDown = false;

    // Patterns
    const patterns = {
        glider: [
            {x: 1, y: 0}, {x: 2, y: 1}, {x: 0, y: 2}, {x: 1, y: 2}, {x: 2, y: 2}
        ],
        pulsar: [
            [2,4],[2,5],[2,6],[3,2],[3,8],[4,1],[4,7],[4,9],[4,10],[5,1],[5,7],[5,9],[5,10],[6,2],[6,8],[7,3],[7,4],[7,5],[7,9],[7,10],[7,11],[8,3],[8,4],[8,5],[9,3],[9,4],[9,5],[10,2],[10,8],[10,9],[10,10]]
        ]
    };

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                // Draw Cell
                if (grid[r][c] === 1) {
                    ctx.fillStyle = '#00ff88';
                    ctx.fillRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
                }
                
                // Draw Borders
                ctx.strokeStyle = '#222';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(c * CELL_SIZE, r * CELL_SIZE, CELL_SIZE, CELL_SIZE);
            }
        }
    }

    function update() {
        let nextGrid = grid.map(row => [...row]);
        let population = 0;

        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                let neighbors = 0;
                
                // Check 8 neighbors with wrapping (toroidal)
                for (let i = -1; i <= 1; i++) {
                    for (let j = -1; j <= 1; j++) {
                        if (i === 0 && j === 0) continue;
                        const nr = (r + i + ROWS) % ROWS;
                        const nc = (c + j + COLS) % COLS;
                        neighbors += grid[nr][nc];
                    }
                }

                // Apply Rules
                if (grid[r][c] === 1) {
                    if (neighbors < 2 || neighbors > 3) {
                        nextGrid[r][c] = 0;
                    }
                } else {
                    if (neighbors === 3) {
                        nextGrid[r][c] = 1;
                    }
                }
                
                if (nextGrid[r][c] === 1) population++;
            }
        }

        grid = nextGrid;
        generation++;
        genDisplay.textContent = generation;
        popDisplay.textContent = population;
    }

    function loop(timestamp) {
        if (isRunning) {
            const delay = 1000 / speedSlider.value;
            if (timestamp - lastTick > delay) {
                update();
                draw();
                lastTick = timestamp;
            }
            requestAnimationFrame(loop);
        } else {
            draw();
        }
    }

    // Controls
    btnStart.addEventListener('click', () => {
        isRunning = !isRunning;
        btnStart.textContent = isRunning ? 'Pause' : 'Start';
        if (isRunning) requestAnimationFrame(loop);
    });

    btnStep.addEventListener('click', () => {
        if (!isRunning) {
            update();
            draw();
        }
    });

    btnClear.addEventListener('click', () => {
        grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        generation = 0;
        genDisplay.textContent = 0;
        popDisplay.textContent = 0;
        if (!isRunning) draw();
    });

    btnRandom.addEventListener('click', () => {
        for (let r = 0; r < ROWS; r++) {
            for (let c = 0; c < COLS; c++) {
                grid[r][c] = Math.random() > 0.85 ? 1 : 0;
            }
        }
        generation = 0;
        genDisplay.textContent = 0;
        draw();
    });

    patternSelect.addEventListener('change', (e) => {
        const type = e.target.value;
        if (type === 'none') return;

        // Clear existing
        grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
        
        const centerX = Math.floor(COLS / 2);
        const centerY = Math.floor(ROWS / 2);

        if (type === 'glider') {
            patterns.glider.forEach(p => {
                grid[p.y + 5][p.x + 5] = 1;
            });
        } else if (type === 'pulsar') {
            patterns.pulsar[0].forEach(p => {
                grid[p[1] + 5][p[0] + 25] = 1; // Simplified pulsar offset
            });
            // Actually let's just use the array coordinates directly for simplicity
            // Redoing pulsar logic for accuracy
            grid = Array(ROWS).fill().map(() => Array(COLS).fill(0));
            const p = patterns.pulsar[0];
            // A better pulsar implementation:
            const pulsarCoords = [
                [2,4],[2,5],[2,6],[3,2],[3,8],[4,1],[4,7],[4,9],[4,10],[5,1],[5,7],[5,9],[5,10],[6,2],[6,8],[7,3],[7,4],[7,5],[7,9],[7,10],[7,11],[8,3],[8,4],[8,5],[9,3],[9,4],[9,5],[10,2],[10,8],[10,9],[10,10]
            ];
            pulsarCoords.forEach(([dy, dx]) => {
                if(grid[dy+5]) grid[dy+5][dx+25] = 1;
            });
        }
        draw();
    });

    // Mouse Interaction
    function getMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: Math.floor((e.clientX - rect.left) / CELL_SIZE),
            y: Math.floor((e.clientY - rect.top) / CELL_SIZE)
        };
    }

    function handleMouseDown(e) {
        isMouseDown = true;
        const pos = getMousePos(e);
        // Toggle on click
        if (pos.x >= 0 && pos.x < COLS && pos.y >= 0 && pos.y < ROWS) {
            grid[pos.y][pos.x] = grid[pos.y][pos.x] === 1 ? 0 : 1;
        }
        draw();
    }

    function handleMouseMove(e) {
        if (isMouseDown && !isRunning) {
            const pos = getMousePos(e);
            if (pos.x >= 0 && pos.x < COLS && pos.y >= 0 && pos.y < ROWS) {
                grid[pos.y][pos.x] = 1; // Paint mode
                draw();
            }
        }
    }

    function handleMouseUp() {
        isMouseDown = false;
    }

    canvas.addEventListener('mousedown', handleMouseDown);
    window.addEventListener('mousemove', handleMouseMove);
    window.addEventListener('mouseup', handleMouseUp);

    // Initial draw
    draw();

</script>
</body>
</html>
