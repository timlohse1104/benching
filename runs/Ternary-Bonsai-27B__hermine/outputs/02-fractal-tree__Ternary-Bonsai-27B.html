<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fractal Tree — L-System</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
background:#0a0e17;
font-family:'Segoe UI',system-ui,sans-serif;
overflow:hidden;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
}
canvas{
display:block;
border-radius:12px;
box-shadow:0 0 40px rgba(0,0,0,0.5);
}
#controls{
display:flex;
flex-wrap:wrap;
gap:12px 24px;
padding:16px 24px;
background:rgba(255,255,255,0.06);
backdrop-filter:blur(16px);
-webkit-backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,0.08);
border-radius:14px;
margin:16px;
align-items:flex-start;
max-width:960px;
width:100%;
justify-content:center;
}
.control-group{
display:flex;
flex-direction:column;
align-items:center;
gap:6px;
}
.control-group label{
color:#c8d0e0;
font-size:13px;
font-weight:500;
letter-spacing:0.5px;
text-transform:uppercase;
}
.control-group input[type=range]{
-webkit-appearance:none;
appearance:none;
width:160px;
height:6px;
border-radius:3px;
background:rgba(255,255,255,0.15);
outline:none;
cursor:pointer;
}
.control-group input[type=range]-webkit-input-range-thumb{
-webkit-appearance:none;
width:18px;height:18px;
border-radius:50%;
background:#7ec8e3;
border:2px solid #c8d0e0;
cursor:pointer;
box-shadow:0 0 8px rgba(126,200,227,0.4);
}
.control-group input[type=range]-moz-range-thumb{
width:18px;height:18px;
border-radius:50%;
background:#7ec8e3;
border:2px solid #c8d0e0;
cursor:pointer;
}
.control-group .value{
color:#7ec8e3;
font-size:14px;
font-weight:600;
font-variant-numeric:tabular-nums;
}
.btn{
background:linear-gradient(135deg,#4a7c59,#2d5a3f);
color:#fff;
border:none;
padding:10px 24px;
border-radius:10px;
font-size:14px;
font-weight:600;
cursor:pointer;
transition:all 0.2s;
letter-spacing:0.5px;
text-transform:uppercase;
}
.btn:hover{
transform:translateY(-1px);
box-shadow:0 4px 16px rgba(74,124,89,0.4);
}
.btn:active{transform:translateY(0)}
.btn-secondary{
background:rgba(255,255,255,0.08);
color:#c8d0e0;
border:1px solid rgba(255,255,255,0.12);
}
.btn-secondary:hover{background:rgba(255,255,255,0.12)}
#info{
color:rgba(200,208,224,0.5);
font-size:12px;
text-align:center;
padding:0 8px 8px;
}
</style>
</head>
<body>

<canvas id="canvas"></canvas>

<div id="controls">
  <div class="control-group">
    <label>Depth <span class="value" id="val-depth">6</span></label>
    <input type="range" id="depth" min="2" max="10" value="6">
  </div>
  <div class="control-group">
    <label>Angle <span class="value" id="val-angle">25</span>°</label>
    <input type="range" id="angle" min="10" max="50" value="25">
  </div>
  <div class="control-group">
    <label>Length Ratio <span class="value" id="val-length">0.72</span></label>
    <input type="range" id="length" min="0.4" max="0.9" step="0.01" value="0.72">
  </div>
  <div class="control-group">
    <label>Jitter <span class="value" id="val-jitter">0.1</span></label>
    <input type="range" id="jitter" min="0" max="0.5" step="0.01" value="0.1">
  </div>
  <div class="control-group">
    <label>Growth Speed <span class="value" id="val-speed">1.0</span>x</label>
    <input type="range" id="speed" min="0.1" max="3.0" step="0.1" value="1.0">
  </div>
  <div class="control-group">
    <label>Leaves <span class="value" id="val-leaves">12</span></label>
    <input type="range" id="leaves" min="0" max="30" value="12">
  </div>
  <div class="control-group">
    <button class="btn" id="regenerate">Regenerate</button>
  </div>
  <div class="control-group">
    <button class="btn btn-secondary" id="resetAnim">Reset Animation</button>
  </div>
</div>

<div id="info">L-System: Axiom=&quot;F&quot; → F → F[+]F[-]F &nbsp;|&nbsp; Depth: <span id="info-depth">6</span> &nbsp;|&nbsp; Branches: <span id="info-branches">0</span></div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

function resize() {
  const maxW = Math.min(window.innerWidth - 32, 900);
  const maxH = window.innerHeight - 260;
  canvas.width = maxW;
  canvas.height = maxH;
}
resize();
window.addEventListener('resize', () => { resize(); });

// L-System parser and tree generation
function generateLSystem(axiom, rules, depth) {
  let s = axiom;
  for (let i = 0; i < depth; i++) {
    let next = '';
    for (const ch of s) {
      next += (rules[ch] || ch);
    }
    s = next;
  }
  return s;
}

function parseTree(cmds, seed) {
  const segments = [];
  const leaves = [];
  const rng = mulberry32(seed);

  let x = canvas.width / 2;
  let y = canvas.height - 40;
  let angle = -Math.PI / 2; // pointing up
  let length = Math.min(canvas.width * 0.22, 180);
  const stack = [{ x, y, angle, length }];
  const order = []; // draw order

  function addSegment(x1, y1, x2, y2, depth) {
    segments.push({ x1, y1, x2, y2, depth });
    order.push({ x2, y2, depth });
  }

  function interpret() {
    let i = 0;
    const n = cmds.length;
    const localStack = [{ x: canvas.width/2, y: canvas.height - 40, angle: -Math.PI/2 }];

    while (i < n) {
      const c = cmds[i];
      if (c === 'F') {
        const seg = localStack[localStack.length - 1];
        // apply jitter
        const jitterX = (rng() - 0.5) * 2 * (rng() * 0.1);
        const jitterY = (rng() - 0.5) * 2 * (rng() * 0.1);
        const dx = Math.cos(seg.angle) * seg.length;
        const dy = Math.sin(seg.angle) * seg.length;
        const x1 = seg.x + jitterX * 0.3;
        const y1 = seg.y + jitterY * 0.3;
        const x2 = x1 + dx;
        const y2 = y1 + dy;
        addSegment(x1, y1, x2, y2, seg.depth ?? 0);
        const newSeg = { x: x2, y: y2, angle: seg.angle, depth: (seg.depth ?? 0) + 1 };
        localStack.push(newSeg);
      } else if (c === '+') {
        localStack[localStack.length - 1].angle += Math.PI / 180 * (25 + (rng() - 0.5) * 2 * (rng() * 0.1));
      } else if (c === '-') {
        localStack[localStack.length - 1].angle -= Math.PI / 180 * (25 + (rng() - 0.5) * 2 * (rng() * 0.1));
      } else if (c === '[') {
        localStack.push({...localStack[localStack.length - 1]});
      } else if (c === ']') {
        localStack.pop();
      }
      i++;
    }
  }

  // Build depth-aware structure
  const cmdStack = [{ x: canvas.width/2, y: canvas.height - 40, angle: -Math.PI/2, length: length, depth: 0 }];
  let idx = 0;
  let cmdLen = cmds.length;

  while (idx < cmdLen) {
    const c = cmds[idx];
    const top = cmdStack[cmdStack.length - 1];
    if (c === 'F') {
      const jitter = (rng() - 0.5) * 2 * 0.1;
      const x1 = top.x + top.length * Math.cos(top.angle) * (1 + jitter * 0.01);
      const y1 = top.y + top.length * Math.sin(top.angle) * (1 + jitter * 0.01);
      const x2 = x1 + top.length * Math.cos(top.angle);
      const y2 = y1 + top.length * Math.sin(top.angle);
      addSegment(top.x, top.y, x2, y2, top.depth);
      const newLen = top.length * 0.72;
      cmdStack.push({ x: x2, y: y2, angle: top.angle, length: newLen, depth: top.depth + 1 });
    } else if (c === '+') {
      top.angle += Math.PI / 180 * (25 + (rng() - 0.5) * 2 * (rng() * 0.1));
    } else if (c === '-') {
      top.angle -= Math.PI / 180 * (25 + (rng() - 0.5) * 2 * (rng() * 0.1));
    } else if (c === '[') {
      cmdStack.push({...top});
    } else if (c === ']') {
      cmdStack.pop();
    }
    idx++;
  }

  return { segments, order, maxDepth: segments.length > 0 ? Math.max(...segments.map(s => s.depth)) : 0 };
}

function mulberry32(a) {
  return function() { a = (a | 0) + 0x6D2B79F3; return ((a ^ (a >>> 15)) * 1 | 0) >>> 0; }
}

// State
let treeData = null;
let animProgress = 0; // 0 to 1
let animating = false;
let currentSeed = 0;
let leavesData = [];
let particles = [];

function regenerate() {
  const depth = parseInt(document.getElementById('depth').value);
  const cmds = generateLSystem('F', { F: 'F[+]F[-]F' }, depth);
  currentSeed = Math.floor(Math.random() * 2147483647);
  treeData = parseTree(cmds, currentSeed);
  animProgress = 0;
  animating = true;
  generateLeaves();
  updateInfo();
}

function generateLeaves() {
  leavesData = [];
  if (!treeData) return;
  const maxDepth = treeData.maxDepth;
  const tipPositions = treeData.order.filter(o => o.depth >= maxDepth - 1);
  const count = parseInt(document.getElementById('leaves').value);
  const rng = mulberry32(currentSeed + 999);

  for (const tip of tipPositions) {
    if (leavesData.length >= count) break;
    if (rng() > 0.6) continue;
    leavesData.push({
      x: tip.x,
      y: tip.y,
      size: 3 + rng() * 6,
      hue: 100 + rng() * 40,
      phase: rng() * Math.PI * 2,
      depth: tip.depth
    });
  }

  // Add some floating particles
  particles = [];
  for (let i = 0; i < 30; i++) {
    particles.push({
      x: treeData.order[Math.floor(rng() * treeData.order.length)].x,
      y: treeData.order[Math.floor(rng() * treeData.order.length)].y - rng() * 50,
      vx: (rng() - 0.5) * 0.3,
      vy: -0.2 - rng() * 0.3,
      size: 1 + rng() * 2,
      alpha: rng() * 0.5 + 0.1,
      hue: 120 + rng() * 30,
      phase: rng() * Math.PI * 2
    });
  }
}

function updateInfo() {
  document.getElementById('info-depth').textContent = treeData ? treeData.maxDepth : '-';
  document.getElementById('info-branches').textContent = treeData ? treeData.segments.length.toLocaleString() : '-';
}

// Color functions
function depthColor(depth, maxDepth) {
  const t = depth / Math.max(maxDepth, 1);
  // Trunk: warm brown → mid: forest green → twigs: light green
  if (t < 0.25) {
    // Brown
    return `hsl(${15 + t*20}, ${40 + t*10}%, ${45 + t*10}%)`;
  } else if (t < 0.7) {
    // Green
    const gt = (t - 0.25) / 0.45;
    return `hsl(${100 + gt*20}, ${60 + gt*20}%, ${35 + gt*25}%)`;
  } else {
    // Light green / yellow-green
    const lt = (t - 0.7) / 0.3;
    return `hsl(${80 + lt*20}, ${70 + lt*10}%, ${55 + lt*20}%)`;
  }
}

function leafColor(depth, maxDepth) {
  const t = depth / Math.max(maxDepth, 1);
  if (t < 0.5) return `hsl(${110 + Math.random()*20}, ${70 + Math.random()*20}%, ${40 + t*15}%)`;
  return `hsl(${100 + Math.random()*30}, ${65 + Math.random()*15}%, ${50 + Math.random()*15}%)`;
}

// Drawing
function drawBackground() {
  const w = canvas.width, h = canvas.height;
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#0a0e17');
  grad.addColorStop(0.4, '#1a1f3a');
  grad.addColorStop(0.7, '#151a2e');
  grad.addColorStop(1, '#0d1117');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Stars
  const starSeed = mulberry32(42);
  for (let i = 0; i < 80; i++) {
    const x = starSeed() % w;
    const y = starSeed() % (h * 0.6);
    const s = starSeed() % 2 + 0.5;
    const twinkle = 0.3 + 0.7 * Math.sin(Date.now() * 0.001 + starSeed());
    ctx.fillStyle = `rgba(200, 210, 240, ${twinkle * 0.5})`;
    ctx.beginPath();
    ctx.arc(x, y, s, 0, Math.PI * 2);
    ctx.fill();
  }

  // Ground
  const groundGrad = ctx.createLinearGradient(0, h - 30, 0, h);
  groundGrad.addColorStop(0, '#1a2a1a');
  groundGrad.addColorStop(1, '#0d150d');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, h - 30, w, 30);

  // Ground texture
  ctx.strokeStyle = 'rgba(40, 70, 40, 0.3)';
  ctx.lineWidth = 0.5;
  for (let i = 0; i < 40; i++) {
    const x = mulberry32(i) % w;
    const y = h - 30 + mulberry32(i + 100) % 10;
    ctx.beginPath();
    ctx.arc(x, y, 1 + mulberry32(i + 200) % 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawTree() {
  if (!treeData) return;

  const w = canvas.width;
  const maxDepth = treeData.maxDepth;
  const segs = treeData.segments;

  // Sort segments by depth for proper drawing order
  const sorted = [...segs].sort((a, b) => a.depth - b.depth);

  // Animate: draw segments up to current progress
  const total = sorted.length;
  const drawCount = Math.floor(total * animProgress);

  for (let i = 0; i < drawCount; i++) {
    const seg = sorted[i];
    const t = i / Math.max(total - 1, 1);
    const depthT = seg.depth / Math.max(maxDepth, 1);

    // Progress fade-in for newly revealed segments
    const fadeIn = Math.min(1, (animProgress - ((i - 1) / total)) * 3);
    if (fadeIn <= 0) continue;

    const color = depthColor(seg.depth, maxDepth);

    // Line width based on depth
    const lineWidth = Math.max(0.5, 6 - seg.depth * 0.7) * fadeIn;

    ctx.save();
    ctx.globalAlpha = fadeIn * 0.95;
    ctx.strokeStyle = color;
    ctx.lineWidth = lineWidth;
    ctx.lineCap = 'round';

    // Slight glow on thicker branches
    if (seg.depth < 3) {
      ctx.shadowColor = color;
      ctx.shadowBlur = 3 + seg.depth;
    }

    ctx.beginPath();
    ctx.moveTo(seg.x1, seg.y1);
    ctx.lineTo(seg.x2, seg.y2);
    ctx.stroke();

    ctx.restore();
  }

  // Draw leaves
  const leafCount = leavesData.length;
  const drawLeaves = Math.floor(leafCount * animProgress);

  for (let i = 0; i < drawLeaves; i++) {
    const leaf = leavesData[i];
    const t = i / Math.max(leafCount - 1, 1);
    const fadeIn = Math.min(1, (animProgress - ((i - 1) / leafCount)) * 2);
    if (fadeIn <= 0) continue;

    const color = leafColor(leaf.depth, maxDepth);
    const phase = leaf.phase + Date.now() * 0.002;
    const wobble = Math.sin(phase) * 2;
    const bob = Math.cos(phase * 0.7) * 1.5;

    ctx.save();
    ctx.globalAlpha = fadeIn * 0.85;
    ctx.fillStyle = color;
    ctx.translate(leaf.x + wobble, leaf.y + bob);

    // Draw small leaf shape
    ctx.beginPath();
    ctx.ellipse(0, 0, leaf.size, leaf.size * 0.6, 0, 0, Math.PI * 2);
    ctx.fill();

    // Small highlight
    ctx.fillStyle = `rgba(255,255,255,${0.15 + Math.sin(phase)*0.1})`;
    ctx.beginPath();
    ctx.ellipse(-leaf.size * 0.2, -leaf.size * 0.2, leaf.size * 0.4, leaf.size * 0.2, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }

  // Draw particles
  for (const p of particles) {
    const phase = p.phase + Date.now() * 0.003;
    const fadeIn = Math.min(1, (animProgress - ((particles.indexOf(p) + 1) / particles.length)) * 2);
    if (fadeIn <= 0) continue;

    p.x += p.vx;
    p.y += p.vy;
    p.x += Math.sin(phase) * 0.5;
    p.y += Math.cos(phase * 1.3) * 0.3;

    // Wrap around
    if (p.y < -10) { p.y = canvas.height + 10; p.x = Math.random() * canvas.width; }
    if (p.x < -10) p.x = canvas.width + 10;
    if (p.x > canvas.width + 10) p.x = -10;

    ctx.save();
    ctx.globalAlpha = fadeIn * p.alpha;
    ctx.fillStyle = `hsl(${p.hue}, 70%, 60%)`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * (0.5 + Math.sin(phase) * 0.3), 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

// Main animation loop
let lastTime = 0;
let animStartTime = 0;

function animate(time) {
  const dt = time - lastTime;
  lastTime = time;

  if (!animating) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    drawBackground();
    drawTree();
    requestAnimationFrame(animate);
    return;
  }

  if (!animStartTime) animStartTime = time;

  const speed = parseFloat(document.getElementById('speed').value);
  const elapsed = (time - animStartTime) / 1000;
  const duration = 4 / speed; // seconds
  animProgress = Math.min(1, elapsed / duration);

  if (animProgress >= 1) {
    animating = false;
  }

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();
  drawTree();

  requestAnimationFrame(animate);
}

// Controls
document.getElementById('depth').addEventListener('input', (e) => {
  document.getElementById('val-depth').textContent = e.target.value;
  document.getElementById('info-depth').textContent = e.target.value;
  regenerate();
});

document.getElementById('angle').addEventListener('input', (e) => {
  document.getElementById('val-angle').textContent = e.target.value;
  regenerate();
});

document.getElementById('length').addEventListener('input', (e) => {
  document.getElementById('val-length').textContent = e.target.value;
  regenerate();
});

document.getElementById('jitter').addEventListener('input', (e) => {
  document.getElementById('val-jitter').textContent = e.target.value;
  regenerate();
});

document.getElementById('speed').addEventListener('input', (e) => {
  document.getElementById('val-speed').textContent = e.target.value;
  // Restart animation
  if (animating) {
    animStartTime = 0;
  }
});

document.getElementById('leaves').addEventListener('input', (e) => {
  document.getElementById('val-leaves').textContent = e.target.value;
  if (treeData) generateLeaves();
});

document.getElementById('regenerate').addEventListener('click', () => {
  regenerate();
  animStartTime = 0;
});

document.getElementById('resetAnim').addEventListener('click', () => {
  animProgress = 0;
  animating = true;
  animStartTime = 0;
});

// Keyboard shortcut
document.addEventListener('keydown', (e) => {
  if (e.key === 'r' || e.key === 'R') {
    regenerate();
    animStartTime = 0;
  }
  if (e.key === ' ') {
    e.preventDefault();
    animProgress = 0;
    animating = true;
    animStartTime = 0;
  }
});

// Initialize
window.addEventListener('load', () => {
  regenerate();
  requestAnimationFrame(animate);
});
</script>
</body>
</html>
