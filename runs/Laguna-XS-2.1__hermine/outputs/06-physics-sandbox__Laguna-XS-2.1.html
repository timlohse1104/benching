<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Physics Sandbox</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: #1a1a2e;
    color: #eee;
    overflow: hidden;
}
#ui {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 100;
    background: rgba(30, 30, 50, 0.9);
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.3);
}
#ui h2 { 
    font-size: 14px;
    margin-bottom: 10px;
    color: #a8dadc;
}
.control-group {
    margin-bottom: 12px;
}
.control-group label {
    display: block;
    font-size: 12px;
    color: #45a049;
    margin-bottom: 3px;
}
.control-group input {
    width: 100%;
    padding: 6px;
    background: #16213e;
    border: 1px solid #0f3460;
    border-radius: 4px;
    color: #eee;
    font-size: 12px;
}
.control-group input[type=range] {
    background: transparent;
}
.button-group {
    display: flex;
    gap: 8px;
    margin-top: 10px;
}
button {
    flex: 1;
    padding: 8px;
    background: #e94560;
    border: none;
    border-radius: 5px;
    color: white;
    font-size: 12px;
    cursor: pointer;
    transition: background 0.2s;
}
button:hover { background: #ff6b6b; }
button:active { transform: scale(0.95); }
#toggle-collisions { background: #45a049; }
#toggle-collisions:hover { background: #5cbf5e; }
#stats {
    font-size: 12px;
    color: #adbac8;
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px solid #0f3460;
}
#ball-count {
    font-weight: bold;
    color: #e94560;
}
canvas {
    display: block;
    background: #0f0f1a;
}
</style>
</head>
<body>
<div id="ui">
    <h2>Physics Controls</h2>
    <div class="control-group">
        <label>Gravity: <span id="gravity-value">0.5</span></label>
        <input type="range" id="gravity" min="0" max="2" step="0.01" value="0.5">
    </div>
    <div class="control-group">
        <label>Restitution: <span id="restitution-value">0.7</span></label>
        <input type="range" id="restitution" min="0" max="1" step="0.01" value="0.7">
    </div>
    <div class="control-group">
        <label>Friction: <span id="friction-value">0.01</span></label>
        <input type="range" id="friction" min="0" max="0.1" step="0.001" value="0.01">
    </div>
    <div class="button-group">
        <button id="reset">Reset</button>
        <button id="toggle-collisions">Toggle Collisions</button>
    </div>
    <div id="stats">
        <div>Balls: <span id="ball-count">0</span></div>
    </div>
</div>
<canvas id="canvas"></canvas>
<script>
class Ball {
    constructor(x, y, radius, color) {
        this.x = x;
        this.y = y;
        this.radius = radius;
        this.color = color;
        this.vx = 0;
        this.vy = 0;
        this.ax = 0;
        this.ay = 0;
    }
    
    draw(ctx) {
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1;
        ctx.stroke();
    }
}

class PhysicsSandbox {
    constructor() {
        this.canvas = document.getElementById('canvas');
        this.ctx = this.canvas.getContext('2d');
        this.balls = [];
        this.gravity = 0.5;
        this.restitution = 0.7;
        this.friction = 0.01;
        this.collisionsEnabled = true;
        this.colors = ['#e94560', '#45a049', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#14b8a6', '#f97316'];
        this.colorIndex = 0;
        
        this.resizeCanvas();
        this.setupEventListeners();
        this.setupControls();
        this.animate();
    }
    
    resizeCanvas() {
        this.canvas.width = window.innerWidth;
        this.canvas.height = window.innerHeight;
    }
    
    setupEventListeners() {
        window.addEventListener('resize', () => this.resizeCanvas());
        
        let isDragging = false;
        let dragStart = { x: 0, y: 0 };
        let draggedBall = null;
        
        this.canvas.addEventListener('mousedown', (e) => {
            const rect = this.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            for (let i = this.balls.length - 1; i >= 0; i--) {
                const ball = this.balls[i];
                const dx = x - ball.x;
                const dy = y - ball.y;
                const dist = Math.sqrt(dx * dx + dy * dy);
                
                if (dist <= ball.radius) {
                    isDragging = true;
                    draggedBall = ball;
                    dragStart = { x, y };
                    return;
                }
            }
            
            const radius = Math.random() * 20 + 10;
            const color = this.colors[this.colorIndex % this.colors.length];
            this.colorIndex++;
            
            const newBall = new Ball(x, y, radius, color);
            newBall.vx = 0;
            newBall.vy = 0;
            this.balls.push(newBall);
        });
        
        this.canvas.addEventListener('mousemove', (e) => {
            if (!isDragging || !draggedBall) return;
            
            const rect = this.canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            draggedBall.x = x;
            draggedBall.y = y;
        });
        
        this.canvas.addEventListener('mouseup', (e) => {
            if (isDragging && draggedBall) {
                const rect = this.canvas.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                
                const dx = dragStart.x - x;
                const dy = dragStart.y - y;
                
                draggedBall.vx = dx * 0.3;
                draggedBall.vy = dy * 0.3;
            }
            
            isDragging = false;
            draggedBall = null;
        });
        
        this.canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            draggedBall = null;
        });
    }
    
    setupControls() {
        const gravityInput = document.getElementById('gravity');
        const restitutionInput = document.getElementById('restitution');
        const frictionInput = document.getElementById('friction');
        
        gravityInput.addEventListener('input', (e) => {
            this.gravity = parseFloat(e.target.value);
            document.getElementById('gravity-value').textContent = this.gravity.toFixed(2);
        });
        
        restitutionInput.addEventListener('input', (e) => {
            this.restitution = parseFloat(e.target.value);
            document.getElementById('restitution-value').textContent = this.restitution.toFixed(2);
        });
        
        frictionInput.addEventListener('input', (e) => {
            this.friction = parseFloat(e.target.value);
            document.getElementById('friction-value').textContent = this.friction.toFixed(3);
        });
        
        document.getElementById('reset').addEventListener('click', () => {
            this.balls = [];
            this.colorIndex = 0;
        });
        
        document.getElementById('toggle-collisions').addEventListener('click', () => {
            this.collisionsEnabled = !this.collisionsEnabled;
            const btn = document.getElementById('toggle-collisions');
            btn.textContent = this.collisionsEnabled ? 'Disable Collisions' : 'Enable Collisions';
        });
    }
    
    update() {
        for (const ball of this.balls) {
            ball.vy += this.gravity;
            
            ball.vx *= (1 - this.friction);
            ball.vy *= (1 - this.friction);
            
            ball.x += ball.vx;
            ball.y += ball.vy;
            
            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx = -ball.vx * this.restitution;
            } else if (ball.x + ball.radius > this.canvas.width) {
                ball.x = this.canvas.width - ball.radius;
                ball.vx = -ball.vx * this.restitution;
            }
            
            if (ball.y - ball.radius < 0) {
                ball.y = ball.radius;
                ball.vy = -ball.vy * this.restitution;
            } else if (ball.y + ball.radius > this.canvas.height) {
                ball.y = this.canvas.height - ball.radius;
                ball.vy = -ball.vy * this.restitution;
            }
        }
        
        if (this.collisionsEnabled) {
            for (let i = 0; i < this.balls.length; i++) {
                for (let j = i + 1; j < this.balls.length; j++) {
                    this.handleCollision(this.balls[i], this.balls[j]);
                }
            }
        }
    }
    
    handleCollision(ball1, ball2) {
        const dx = ball2.x - ball1.x;
        const dy = ball2.y - ball1.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const minDist = ball1.radius + ball2.radius;
        
        if (dist < minDist && dist > 0) {
            const overlap = minDist - dist;
            
            const nx = dx / dist;
            const ny = dy / dist;
            
            ball1.x -= nx * overlap / 2;
            ball1.y -= ny * overlap / 2;
            ball2.x += nx * overlap / 2;
            ball2.y += ny * overlap / 2;
            
            const dvx = ball1.vx - ball2.vx;
            const dvy = ball1.vy - ball2.vy;
            const dvn = dvx * nx + dvy * ny;
            
            if (dvn > 0) return;
            
            const impulse = (2 * dvn) / (1 + 1);
            
            ball1.vx -= impulse * nx * 0.5;
            ball1.vy -= impulse * ny * 0.5;
            ball2.vx += impulse * nx * 0.5;
            ball2.vy += impulse * ny * 0.5;
            
            ball1.vx *= this.restitution;
            ball1.vy *= this.restitution;
            ball2.vx *= this.restitution;
            ball2.vy *= this.restitution;
        }
    }
    
    draw() {
        this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
        
        for (const ball of this.balls) {
            ball.draw(this.ctx);
        }
    }
    
    updateStats() {
        document.getElementById('ball-count').textContent = this.balls.length;
    }
    
    animate() {
        this.update();
        this.draw();
        this.updateStats();
        requestAnimationFrame(() => this.animate());
    }
}

window.onload = () => {
    new PhysicsSandbox();
};
</script>
</body>
</html>
