<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Violin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; 
            background: linear-gradient(135deg, #1a2980, #2c5364);
            min-height: 100vh;
        }
        #canvas { 
            display: block; 
            width: 100vw; 
            height: 100vh;
        }
        #hint {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: rgba(0,0,0,0.7);
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 14px;
            max-width: 300px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255,255,255,0.2);
        }
        #hint h4 {
            margin-bottom: 6px;
            color: #ffcc00;
        }
        #hint ul {
            list-style: none;
            line-height: 1.8;
        }
        #hint li:before {
            content: "• ";
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div id="hint">
        <h4>Play the Violin</h4>
        <ul>
            <li>Click or hover on strings to play notes</li>
            <li>Drag to rotate the violin</li>
            <li>Scroll to zoom in/out</li>
            <li>Keys: W-G, A-D, S-A, D-E</li>
        </ul>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('canvas');
        const gl = canvas.getContext('webgl');
        
        // Resize handler
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            gl.viewport(0, 0, canvas.width, canvas.height);
        }
        window.addEventListener('resize', resize);
        resize();

        // Vertex shader source
        const vsSource = `
            attribute vec4 aVertexPosition;
            attribute vec3 aVertexColor;
            
            uniform mat4 uModelViewMatrix;
            uniform mat4 uProjectionMatrix;
            
            varying lowp vec3 vColor;
            
            void main(void) {
                gl_Position = uProjectionMatrix * uModelViewMatrix * aVertexPosition;
                vColor = aVertexColor;
            }
        `;

        // Fragment shader source
        const fsSource = `
            varying lowp vec3 vColor;
            
            void main(void) {
                gl_FragColor = vec4(vColor, 1.0);
            }
        `;

        // Shader compilation
        function compileShader(type, source) {
            const shader = gl.createShader(type);
            gl.shaderSource(shader, source);
            gl.compileShader(shader);
            if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
                console.error('Shader compile error:', gl.getShaderInfoLog(shader));
                return null;
            }
            return shader;
        }

        // Create shader program
        const vertexShader = compileShader(gl.VERTEX_SHADER, vsSource);
        const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fsSource);
        const shaderProgram = gl.createProgram();
        gl.attachShader(shaderProgram, vertexShader);
        gl.attachShader(shaderProgram, fragmentShader);
        gl.linkProgram(shaderProgram);
        gl.useProgram(shaderProgram);

        // Buffers
        const vertexBuffer = gl.createBuffer();
        const colorBuffer = gl.createBuffer();
        const indexBuffer = gl.createBuffer();

        // Get attribute locations
        const vertexPosition = gl.getAttribLocation(shaderProgram, 'aVertexPosition');
        const vertexColor = gl.getAttribLocation(shaderProgram, 'aVertexColor');

        // Get uniform locations
        const modelViewMatrix = gl.getUniformLocation(shaderProgram, 'uModelViewMatrix');
        const projectionMatrix = gl.getUniformLocation(shaderProgram, 'uProjectionMatrix');

        // Violin parameters
        const violin = {
            position: [0, 0, 0],
            scale: 1.0,
            rotation: [0, 0, 0],
            strings: [],
            body: null
        };

        // Create violin geometry
        function createViolin() {
            const vertices = [];
            const colors = [];
            const indices = [];
            
            // Body - main wooden part
            // Upper bout
            addVertex(-0.8, -0.3, -0.4, 0.4, 0.2, 0.1); // Brown wood
            addVertex(-0.6, -0.2, -0.3, 0.45, 0.25, 0.12);
            addVertex(-0.4, -0.1, -0.2, 0.5, 0.3, 0.15);
            addVertex(-0.2, 0, -0.1, 0.55, 0.35, 0.18);
            addVertex(0, 0.1, 0, 0.6, 0.4, 0.2);
            
            // Lower bout
            addVertex(-0.2, 0.2, 0.1, 0.55, 0.35, 0.18);
            addVertex(0, 0.3, 0.2, 0.5, 0.3, 0.15);
            addVertex(0.2, 0.4, 0.3, 0.45, 0.25, 0.12);
            addVertex(0.4, 0.3, 0.4, 0.4, 0.2, 0.1);
            addVertex(0.6, 0.2, 0.5, 0.35, 0.15, 0.08);
            
            // Neck
            addVertex(0.6, 0.2, 0.5, 0.6, 0.35, 0.2);
            addVertex(0.65, 0.4, 0.6, 0.65, 0.4, 0.25);
            addVertex(0.7, 0.6, 0.7, 0.7, 0.45, 0.3);
            addVertex(0.75, 0.8, 0.8, 0.75, 0.5, 0.35);
            
            // Scroll
            addVertex(0.75, 0.8, 0.8, 0.8, 0.6, 0.4);
            addVertex(0.78, 0.9, 0.9, 0.85, 0.65, 0.45);
            addVertex(0.8, 1, 1, 0.9, 0.7, 0.5);
            
            // Fingerboard
            addVertex(0.7, 0.6, 0.7, 0.9, 0.9, 0.9);
            addVertex(0.7, 0.6, 0.75, 0.9, 0.9, 0.9);
            addVertex(0.7, 0.6, 0.85, 0.9, 0.9, 0.9);
            addVertex(0.7, 0.6, 0.95, 0.9, 0.9, 0.9);
            
            // Bridge
            addVertex(0.2, 0.35, 0.15, 0.8, 0.7, 0.6);
            addVertex(0.2, 0.35, 0.25, 0.85, 0.75, 0.65);
            addVertex(0.2, 0.45, 0.25, 0.85, 0.75, 0.65);
            
            // Strings positions
            const stringY = [0.25, 0.3, 0.35, 0.4];
            for (let i = 0; i < 4; i++) {
                violin.strings.push({
                    y: stringY[i],
                    x: -0.5 + i * 0.33,
                    z: 0,
                    vibrating: false,
                    vibrationPhase: 0
                });
            }
            
            // Define indices for triangles
            // Body triangles
            for (let i = 0; i < 4; i++) {
                indices.push(i, i+1, i+5);
                indices.push(i, i+5, i+4);
            }
            for (let i = 4; i < 9; i++) {
                indices.push(i, i+1, i+6);
                indices.push(i, i+6, i+5);
            }
            
            // Neck triangles
            for (let i = 10; i < 13; i++) {
                indices.push(i, i+1, i+5);
                indices.push(i, i+5, i+4);
            }
            
            // Scroll triangles
            for (let i = 15; i < 17; i++) {
                indices.push(i, i+1, i+2);
            }
            
            // Fingerboard rectangles
            for (let i = 18; i < 21; i += 3) {
                indices.push(i, i+1, i+2);
            }
            
            // Bridge
            indices.push(24, 25, 26);
            indices.push(24, 26, 27);
            
            return { vertices, colors, indices };
        }

        function addVertex(x, y, z, r, g, b) {
            const v = createViolin();
            v.vertices.push(x, y, z);
            v.colors.push(r, g, b);
        }

        // Initialize violin geometry
        const violinGeo = createViolin();
        const vertices = [];
        const colors = [];
        const indices = [];

        // Build actual geometry
        function buildGeometry() {
            // Body - upper bout
            const bodyVerts = [
                // Upper bout
                [-0.8, -0.3, -0.4],
                [-0.6, -0.2, -0.3],
                [-0.4, -0.1, -0.2],
                [-0.2, 0, -0.1],
                [0, 0.1, 0],
                // Lower bout
                [-0.2, 0.2, 0.1],
                [0, 0.3, 0.2],
                [0.2, 0.4, 0.3],
                [0.4, 0.3, 0.4],
                [0.6, 0.2, 0.5],
                // Neck
                [0.6, 0.2, 0.5],
                [0.65, 0.4, 0.6],
                [0.7, 0.6, 0.7],
                [0.75, 0.8, 0.8],
                // Scroll
                [0.75, 0.8, 0.8],
                [0.78, 0.9, 0.9],
                [0.8, 1, 1],
                // Fingerboard
                [0.7, 0.6, 0.7],
                [0.7, 0.6, 0.75],
                [0.7, 0.6, 0.85],
                [0.7, 0.6, 0.95],
                // Bridge
                [0.2, 0.35, 0.15],
                [0.2, 0.35, 0.25],
                [0.2, 0.45, 0.25]
            ];

            const bodyColors = [
                // Upper bout - brown wood
                [0.4, 0.2, 0.1],
                [0.45, 0.25, 0.12],
                [0.5, 0.3, 0.15],
                [0.55, 0.35, 0.18],
                [0.6, 0.4, 0.2],
                // Lower bout
                [0.55, 0.35, 0.18],
                [0.5, 0.3, 0.15],
                [0.45, 0.25, 0.12],
                [0.4, 0.2, 0.1],
                [0.35, 0.15, 0.08],
                // Neck - darker wood
                [0.6, 0.35, 0.2],
                [0.65, 0.4, 0.25],
                [0.7, 0.45, 0.3],
                [0.75, 0.5, 0.35],
                // Scroll - lighter wood
                [0.8, 0.6, 0.4],
                [0.85, 0.65, 0.45],
                [0.9, 0.7, 0.5],
                // Fingerboard - ivory
                [0.9, 0.9, 0.9],
                [0.9, 0.9, 0.9],
                [0.9, 0.9, 0.9],
                [0.9, 0.9, 0.9],
                // Bridge
                [0.8, 0.7, 0.6],
                [0.85, 0.75, 0.65],
                [0.85, 0.75, 0.65]
            ];

            // Build vertices and colors arrays
            for (let i = 0; i < bodyVerts.length; i++) {
                vertices.push(...bodyVerts[i]);
                colors.push(...bodyColors[i]);
            }

            // Build indices for body triangles
            // Upper bout
            indices.push(0, 1, 4);
            indices.push(1, 2, 4);
            indices.push(2, 3, 4);
            indices.push(0, 4, 1);
            indices.push(1, 4, 2);
            indices.push(2, 4, 3);
            
            // Lower bout
            indices.push(4, 5, 9);
            indices.push(5, 6, 9);
            indices.push(6, 7, 9);
            indices.push(7, 8, 9);
            indices.push(4, 9, 5);
            indices.push(5, 9, 6);
            indices.push(6, 9, 7);
            indices.push(7, 9, 8);
            
            // Neck
            indices.push(9, 10, 13);
            indices.push(10, 11, 13);
            indices.push(11, 12, 13);
            indices.push(9, 13, 10);
            indices.push(10, 13, 11);
            indices.push(11, 13, 12);
            
            // Scroll
            indices.push(12, 14, 15);
            indices.push(14, 16, 15);
            indices.push(12, 15, 14);
            indices.push(14, 15, 16);
            
            // Fingerboard
            indices.push(17, 18, 20);
            indices.push(18, 19, 20);
            indices.push(17, 20, 18);
            indices.push(18, 20, 19);
            
            // Bridge
            indices.push(20, 21, 22);
            indices.push(20, 22, 23);
        }

        buildGeometry();

        // Initialize buffers
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(vertices), gl.STATIC_DRAW);

        gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(colors), gl.STATIC_DRAW);

        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
        gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint16Array(indices), gl.STATIC_DRAW);

        // Set up vertex attributes
        gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
        gl.vertexAttribPointer(vertexPosition, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(vertexPosition);

        gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
        gl.vertexAttribPointer(vertexColor, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(vertexColor);

        // Matrices
        const mat4 = {
            create: () => new Float32Array(16),
            identity: (out) => {
                out[0] = 1; out[1] = 0; out[2] = 0; out[3] = 0;
                out[4] = 0; out[5] = 1; out[6] = 0; out[7] = 0;
                out[8] = 0; out[9] = 0; out[10] = 1; out[11] = 0;
                out[12] = 0; out[13] = 0; out[14] = 0; out[15] = 1;
                return out;
            },
            perspective: (out, fovy, aspect, near, far) => {
                const f = 1.0 / Math.tan(fovy / 2);
                out[0] = f / aspect; out[1] = 0; out[2] = 0; out[3] = 0;
                out[4] = 0; out[5] = f; out[6] = 0; out[7] = 0;
                out[8] = 0; out[9] = 0; out[10] = (far + near) / (near - far);
                out[11] = -1;
                out[12] = 0; out[13] = 0; out[14] = (2 * far * near) / (near - far);
                out[15] = 0;
                return out;
            },
            lookAt: (out, eye, center, up) => {
                const x0 = eye[0], x1 = eye[1], x2 = eye[2];
                const y0 = center[0], y1 = center[1], y2 = center[2];
                const z0 = up[0], z1 = up[1], z2 = up[2];
                
                let dx = x0 - y0, dy = x1 - y1, dz = x2 - y2;
                const len = Math.sqrt(dx*dx + dy*dy + dz*dz);
                dx /= len; dy /= len; dz /= len;
                
                let ax = z1 * dz - z2 * dz;
                let ay = z2 * dx - z0 * dz;
                let az = z0 * dy - z1 * dx;
                const alen = Math.sqrt(ax*ax + ay*ay + az*az);
                ax /= alen; ay /= alen; az /= alen;
                
                let bx = dy * az - dz * ay;
                let by = dz * ax - dx * az;
                let bz = dx * ay - dy * ax;
                
                out[0] = ax; out[1] = ay; out[2] = az; out[3] = 0;
                out[4] = bx; out[5] = by; out[6] = bz; out[7] = 0;
                out[8] = dx; out[9] = dy; out[10] = dz; out[11] = 0;
                out[12] = -(ax * x0 + ay * x1 + az * x2);
                out[13] = -(bx * x0 + by * x1 + bz * x2);
                out[14] = -(dx * x0 + dy * x1 + dz * x2);
                out[15] = 1;
                return out;
            },
            multiply: (out, a, b) => {
                const a00 = a[0], a01 = a[1], a02 = a[2], a03 = a[3];
                const a10 = a[4], a11 = a[5], a12 = a[6], a13 = a[7];
                const a20 = a[8], a21 = a[9], a22 = a[10], a23 = a[11];
                const a30 = a[12], a31 = a[13], a32 = a[14], a33 = a[15];
                
                const b00 = b[0], b01 = b[1], b02 = b[2], b03 = b[3];
                const b10 = b[4], b11 = b[5], b12 = b[6], b13 = b[7];
                const b20 = b[8], b21 = b[9], b22 = b[10], b23 = b[11];
                const b30 = b[12], b31 = b[13], b32 = b[14], b33 = b[15];
                
                out[0] = a00 * b00 + a01 * b10 + a02 * b20 + a03 * b30;
                out[1] = a00 * b01 + a01 * b11 + a02 * b21 + a03 * b31;
                out[2] = a00 * b02 + a01 * b12 + a02 * b22 + a03 * b32;
                out[3] = a00 * b03 + a01 * b13 + a02 * b23 + a03 * b33;
                out[4] = a10 * b00 + a11 * b10 + a12 * b20 + a13 * b30;
                out[5] = a10 * b01 + a11 * b11 + a12 * b21 + a13 * b31;
                out[6] = a10 * b02 + a11 * b12 + a12 * b22 + a13 * b32;
                out[7] = a10 * b03 + a11 * b13 + a12 * b23 + a13 * b33;
                out[8] = a20 * b00 + a21 * b10 + a22 * b20 + a23 * b30;
                out[9] = a20 * b01 + a21 * b11 + a22 * b21 + a23 * b31;
                out[10] = a20 * b02 + a21 * b12 + a22 * b22 + a23 * b32;
                out[11] = a20 * b03 + a21 * b13 + a22 * b23 + a23 * b33;
                out[12] = a30 * b00 + a31 * b10 + a32 * b20 + a33 * b30;
                out[13] = a30 * b01 + a31 * b11 + a32 * b21 + a33 * b31;
                out[14] = a30 * b02 + a31 * b12 + a32 * b22 + a33 * b32;
                out[15] = a30 * b03 + a31 * b13 + a32 * b23 + a33 * b33;
                return out;
            },
            rotation: (out, angle, x, y, z) => {
                const s = Math.sin(angle);
                const c = Math.cos(angle);
                const t = 1 - c;
                
                const cx = c * x + s * z;
                const cy = s * y;
                const cz = t * x * z + c;
                
                const dx = t * x * y - s * z;
                const dy = c * y + t * y;
                const dz = t * y * z + s * x;
                
                const ex = t * x * x + c;
                const ey = t * x * y + s * z;
                const ez = t * x * z - s * y;
                
                out[0] = cx; out[1] = dx; out[2] = ex; out[3] = 0;
                out[4] = cy; out[5] = dy; out[6] = ey; out[7] = 0;
                out[8] = cz; out[9] = dz; out[10] = ez; out[11] = 0;
                out[12] = 0; out[13] = 0; out[14] = 0; out[15] = 1;
                return out;
            },
            translate: (out, a, v) => {
                const x = v[0], y = v[1], z = v[2];
                out[0] = a[0]; out[1] = a[1]; out[2] = a[2]; out[3] = a[3];
                out[4] = a[4]; out[5] = a[5]; out[6] = a[6]; out[7] = a[7];
                out[8] = a[8]; out[9] = a[9]; out[10] = a[10]; out[11] = a[11];
                out[12] = a[12] + x; out[13] = a[13] + y; out[14] = a[14] + z;
                return out;
            },
            fromRotation: (out, angleX, angleY, angleZ) => {
                const cx = Math.cos(angleX), sx = Math.sin(angleX);
                const cy = Math.cos(angleY), sy = Math.sin(angleY);
                const cz = Math.cos(angleZ), sz = Math.sin(angleZ);
                
                const xy = cx * cy;
                const xz = cx * cz;
                const yz = cy * sz;
                const yx = cx * sy;
                const zx = sx * cz;
                const zy = sy * sz;
                
                out[0] = cy * cz; out[1] = -cy * sz; out[2] = sy; out[3] = 0;
                out[4] = xz * sy + xy * sz; out[5] = xy * sz - xz * sy; out[6] = -cx * cz; out[7] = 0;
                out[8] = -xz * sy + xy * sz; out[9] = -xy * sz - xz * sy; out[10] = cx * cz; out[11] = 0;
                out[12] = 0; out[13] = 0; out[14] = 0; out[15] = 1;
                return out;
            }
        };

        // Camera and model matrices
        let cameraAngleX = 0.3;
        let cameraAngleY = Math.PI;
        let distance = 3;
        let target = [0, 0, 0];

        // Mouse interaction
        let isDragging = false;
        let lastX = 0, lastY = 0;

        canvas.addEventListener('mousedown', (e) => {
            isDragging = true;
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const deltaX = e.clientX - lastX;
            const deltaY = e.clientY - lastY;
            cameraAngleY += deltaX * 0.01;
            cameraAngleX += deltaY * 0.01;
            cameraAngleX = Math.max(-Math.PI/2 + 0.1, Math.min(Math.PI/2 - 0.1, cameraAngleX));
            lastX = e.clientX;
            lastY = e.clientY;
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
        });

        canvas.addEventListener('wheel', (e) => {
            distance += e.deltaY * 0.01;
            distance = Math.max(1.5, Math.min(8, distance));
        });

        // Web Audio API
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        const stringNotes = [
            { freq: 196.00, name: 'G3' },  // G3
            { freq: 293.66, name: 'D4' },  // D4
            { freq: 440.00, name: 'A4' },  // A4
            { freq: 880.00, name: 'E5' }   // E5
        ];

        function playNote(freq, duration = 0.3) {
            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();
            
            oscillator.type = 'sine';
            oscillator.frequency.setValueAtTime(freq, audioContext.currentTime);
            
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + duration);
            
            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            oscillator.start();
            oscillator.stop(audioContext.currentTime + duration);
        }

        // String interaction
        let hoveredString = -1;
        let playedString = -1;
        let playTime = 0;

        function checkStringHover(x, y) {
            const rect = canvas.getBoundingClientRect();
            const mouseX = ((x - rect.left) / rect.width) * 2 - 1;
            const mouseY = ((rect.height - y + rect.top) / rect.height) * 2 - 1;
            
            for (let i = 0; i < violin.strings.length; i++) {
                const s = violin.strings[i];
                // Simple proximity check
                const sx = s.x * 0.5;
                const sz = s.z * 0.5;
                
                if (Math.abs(mouseX - sx) < 0.1 && Math.abs(mouseY - s.y * 0.5) < 0.1) {
                    return i;
                }
            }
            return -1;
        }

        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            hoveredString = checkStringHover(x, y);
        });

        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            playedString = checkStringHover(x, y);
            if (playedString >= 0) {
                playedString = hoveredString;
                playNote(stringNotes[playedString].freq);
            }
        });

        // Keyboard interaction
        document.addEventListener('keydown', (e) => {
            switch(e.key.toLowerCase()) {
                case 'w': playNote(stringNotes[0].freq); break;
                case 'a': playNote(stringNotes[1].freq); break;
                case 's': playNote(stringNotes[2].freq); break;
                case 'd': playNote(stringNotes[3].freq); break;
            }
        });

        // Animation loop
        let lastTime = 0;
        function animate(time) {
            const delta = (time - lastTime) / 1000;
            lastTime = time;
            
            // Update vibration
            for (let i = 0; i < violin.strings.length; i++) {
                const s = violin.strings[i];
                if (s.vibrating) {
                    s.vibrationPhase += 20 * delta;
                    if (s.vibrationPhase > Math.PI * 2) {
                        s.vibrationPhase = 0;
                        s.vibrating = false;
                    }
                }
            }
            
            // Clear and set up
            gl.clearColor(0.1, 0.1, 0.2, 1);
            gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
            gl.enable(gl.DEPTH_TEST);
            
            // Projection matrix
            const projection = mat4.perspective(
                mat4.create(),
                45 * Math.PI / 180,
                canvas.width / canvas.height,
                0.1,
                100
            );
            
            // View matrix
            const eye = [
                Math.sin(cameraAngleX) * Math.sin(cameraAngleY) * distance,
                Math.cos(cameraAngleX) * distance,
                Math.sin(cameraAngleX) * Math.cos(cameraAngleY) * distance
            ];
            
            const view = mat4.lookAt(
                mat4.create(),
                eye,
                target,
                [0, 1, 0]
            );
            
            // Model matrix with rotation
            const model = mat4.fromRotation(
                mat4.create(),
                0,
                cameraAngleY + Math.PI,
                -cameraAngleX
            );
            
            // Combine matrices
            const mv = mat4.multiply(
                mat4.create(),
                view,
                model
            );
            
            // Set uniforms
            gl.uniformMatrix4fv(modelViewMatrix, false, mv);
            gl.uniformMatrix4fv(projectionMatrix, false, projection);
            
            // Draw violin body
            gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
            gl.vertexAttribPointer(vertexPosition, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(vertexPosition);
            
            gl.bindBuffer(gl.ARRAY_BUFFER, colorBuffer);
            gl.vertexAttribPointer(vertexColor, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(vertexColor);
            
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, indexBuffer);
            gl.drawElements(gl.TRIANGLES, indices.length, gl.UNSIGNED_SHORT, 0);
            
            // Draw strings
            for (let i = 0; i < violin.strings.length; i++) {
                const s = violin.strings[i];
                drawString(s, i);
            }
            
            requestAnimationFrame(animate);
        }

        function drawString(s, index) {
            const amplitude = s.vibrating ? 0.05 * Math.sin(s.vibrationPhase * 5) : 0;
            const z = s.z + amplitude;
            
            // Create string geometry
            const stringVertices = new Float32Array([
                s.x - 0.02, s.y - 0.1, z,
                s.x + 0.02, s.y - 0.1, z,
                s.x - 0.02, s.y + 0.1, z,
                s.x + 0.02, s.y + 0.1, z
            ]);
            
            const stringIndices = new Uint16Array([0, 1, 2, 1, 3, 2]);
            
            const stringBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, stringBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, stringVertices, gl.STATIC_DRAW);
            
            gl.vertexAttribPointer(vertexPosition, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(vertexPosition);
            
            // String color - bright steel
            const stringColor = new Float32Array([
                0.9, 0.9, 0.92,
                0.9, 0.9, 0.92,
                0.9, 0.9, 0.92,
                0.9, 0.9, 0.92
            ]);
            
            const stringColorBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ARRAY_BUFFER, stringColorBuffer);
            gl.bufferData(gl.ARRAY_BUFFER, stringColor, gl.STATIC_DRAW);
            
            gl.vertexAttribPointer(vertexColor, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(vertexColor);
            
            const stringIndexBuffer = gl.createBuffer();
            gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, stringIndexBuffer);
            gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, stringIndices, gl.STATIC_DRAW);
            
            // Highlight effect
            const highlight = index === hoveredString || index === playedString ? 1.2 : 1.0;
            gl.uniform1f(gl.getUniformLocation(shaderProgram, 'uAlpha'), highlight);
            
            gl.drawElements(gl.TRIANGLES, 6, gl.UNSIGNED_SHORT, 0);
        }

        // Start animation
        requestAnimationFrame(animate);

        // Add uAlpha uniform to shader
        const vsSource2 = `
            attribute vec4 aVertexPosition;
            attribute vec3 aVertexColor;
            
            uniform mat4 uModelViewMatrix;
            uniform mat4 uProjectionMatrix;
            uniform float uAlpha;
            
            varying lowp vec3 vColor;
            varying lowp float vAlpha;
            
            void main(void) {
                gl_Position = uProjectionMatrix * uModelViewMatrix * aVertexPosition;
                vColor = aVertexColor;
                vAlpha = uAlpha;
            }
        `;

        const fsSource2 = `
            varying lowp vec3 vColor;
            varying lowp float vAlpha;
            
            void main(void) {
                gl_FragColor = vec4(vColor, vAlpha);
            }
        `;

        // Recompile shaders with alpha support
        const vertexShader2 = compileShader(gl.VERTEX_SHADER, vsSource2);
        const fragmentShader2 = compileShader(gl.FRAGMENT_SHADER, fsSource2);
        const shaderProgram2 = gl.createProgram();
        gl.attachShader(shaderProgram2, vertexShader2);
        gl.attachShader(shaderProgram2, fragmentShader2);
        gl.linkProgram(shaderProgram2);
        
        // Use new shader program
        gl.useProgram(shaderProgram2);
        
        // Update attribute locations for new program
        const vertexPosition2 = gl.getAttribLocation(shaderProgram2, 'aVertexPosition');
        const vertexColor2 = gl.getAttribLocation(shaderProgram2, 'aVertexColor');
        const uAlpha = gl.getUniformLocation(shaderProgram2, 'uAlpha');
        
        // Update draw function to use shaderProgram2
        const originalAnimate = animate;
        animate = function(time) {
            originalAnimate(time);
            
            gl.useProgram(shaderProgram2);
            gl.uniform1f(uAlpha, 1.0);
        };
    </script>
