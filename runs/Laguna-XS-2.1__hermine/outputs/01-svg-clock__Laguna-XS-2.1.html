<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analog Clock</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #eee;
        }
        .clock-container {
            position: relative;
        }
        svg#clock {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            background: #16213e;
            border: 2px solid #0f3460;
        }
        .digital-time {
            margin-top: 20px;
            font-size: 1.5rem;
            color: #e94560;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="clock-container">
        <svg id="clock" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <radialGradient id="clockGradient" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
                    <stop offset="0%" stop-color="#0f3460"/>
                    <stop offset="100%" stop-color="#1a1a2e"/>
                </radialGradient>
            </defs>
            <circle cx="160" cy="160" r="150" fill="url(#clockGradient)" stroke="#0f3460" stroke-width="2"/>
            <circle cx="160" cy="160" r="8" fill="#e94560"/>
            <!-- Hour tick marks -->
            <g id="hour-ticks" stroke="#eee" stroke-width="2">
                <!-- Will be generated by JS -->
            </g>
            <!-- Minute tick marks -->
            <g id="minute-ticks" stroke="#aaa" stroke-width="1">
                <!-- Will be generated by JS -->
            </g>
            <!-- Hands -->
            <line id="hour-hand" x1="160" y1="160" x2="160" y2="160" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
            <line id="minute-hand" x1="160" y1="160" x2="160" y2="160" stroke="#4ecca3" stroke-width="4" stroke-linecap="round"/>
            <line id="second-hand" x1="160" y1="160" x2="160" y2="160" stroke="#e94560" stroke-width="2" stroke-linecap="round"/>
        </svg>
        <div class="digital-time" id="digital-time">00:00:00</div>
    </div>

    <script>
        (function() {
            const clock = document.getElementById('clock');
            const hourTicks = document.getElementById('hour-ticks');
            const minuteTicks = document.getElementById('minute-ticks');
            const hourHand = document.getElementById('hour-hand');
            const minuteHand = document.getElementById('minute-hand');
            const secondHand = document.getElementById('second-hand');
            const digitalTime = document.getElementById('digital-time');
            
            const centerX = 160;
            const centerY = 160;
            const hourRadius = 130;
            const minuteRadius = 145;
            
            // Generate tick marks
            for (let i = 0; i < 12; i++) {
                const angle = (i * 30 - 90) * Math.PI / 180;
                const x1 = centerX + Math.cos(angle) * 135;
                const y1 = centerY + Math.sin(angle) * 135;
                const x2 = centerX + Math.cos(angle) * hourRadius;
                const y2 = centerY + Math.sin(angle) * hourRadius;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', '#eee');
                line.setAttribute('stroke-width', '2');
                hourTicks.appendChild(line);
            }
            
            for (let i = 0; i < 60; i++) {
                if (i % 5 === 0) continue; // Skip hour positions
                const angle = (i * 6 - 90) * Math.PI / 180;
                const x1 = centerX + Math.cos(angle) * 140;
                const y1 = centerY + Math.sin(angle) * 140;
                const x2 = centerX + Math.cos(angle) * minuteRadius;
                const y2 = centerY + Math.sin(angle) * minuteRadius;
                const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
                line.setAttribute('x1', x1);
                line.setAttribute('y1', y1);
                line.setAttribute('x2', x2);
                line.setAttribute('y2', y2);
                line.setAttribute('stroke', '#aaa');
                line.setAttribute('stroke-width', '1');
                minuteTicks.appendChild(line);
            }
            
            function updateClock() {
                const now = new Date();
                const hours = now.getHours();
                const minutes = now.getMinutes();
                const seconds = now.getSeconds();
                
                // Update digital time
                const digitalStr = hours.toString().padStart(2, '0') + ':' + 
                                  minutes.toString().padStart(2, '0') + ':' + 
                                  seconds.toString().padStart(2, '0');
                digitalTime.textContent = digitalStr;
                
                // Calculate angles
                const hourAngle = (hours % 12) * 30 + minutes * 0.5;
                const minuteAngle = minutes * 6 + seconds * 0.1;
                const secondAngle = seconds * 6;
                
                // Convert to radians (90 degrees = 0 radians, going clockwise)
                const hourRad = (hourAngle - 90) * Math.PI / 180;
                const minuteRad = (minuteAngle - 90) * Math.PI / 180;
                const secondRad = (secondAngle - 90) * Math.PI / 180;
                
                // Calculate hand positions
                const hourX = centerX + Math.cos(hourRad) * 60;
                const hourY = centerY + Math.sin(hourRad) * 60;
                const minuteX = centerX + Math.cos(minuteRad) * 85;
                const minuteY = centerY + Math.sin(minuteRad) * 85;
                const secondX = centerX + Math.cos(secondRad) * 110;
                const secondY = centerY + Math.sin(secondRad) * 110;
                
                // Update hands
                hourHand.setAttribute('x2', hourX);
                hourHand.setAttribute('y2', hourY);
                minuteHand.setAttribute('x2', minuteX);
                minuteHand.setAttribute('y2', minuteY);
                secondHand.setAttribute('x2', secondX);
                secondHand.setAttribute('y2', secondY);
            }
            
            // Initial update
            updateClock();
            
            // Update every second
            setInterval(updateClock, 1000);
        })();
    </script>
</body>
</html>
