<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>llm-check dashboard</title>
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<header class="topbar">
  <div class="title">llm-check</div>
  <nav class="tabs">
    <button data-tab="overview" class="tab active">Overview</button>
    <button data-tab="compare" class="tab">Compare</button>
    <button data-tab="errors" class="tab">Errors</button>
  </nav>
  <div class="meta" id="run-meta"></div>
</header>

<main>
  <section id="tab-overview" class="tab-panel active">
    <div class="toolbar">
      <input type="search" id="overview-filter" placeholder="Filter by prompt, model, status, error..." />
      <div class="legend">
        <span class="badge badge-ok">ok</span>
        <span class="badge badge-warnings">warnings</span>
        <span class="badge badge-broken">broken</span>
        <span class="badge badge-failed">failed</span>
      </div>
    </div>
    <div id="overview-matrix"></div>
  </section>

  <section id="tab-compare" class="tab-panel">
    <div class="toolbar compare-toolbar">
      <label>Prompt
        <select id="compare-prompt"></select>
      </label>
      <label>Model A
        <select id="compare-a"></select>
      </label>
      <label>Model B
        <select id="compare-b"></select>
      </label>
      <button id="compare-swap" type="button">Swap</button>
      <button id="compare-scroll-lock" type="button" aria-pressed="false"
        title="Scroll both panes together. While locked, each output is rendered on a tall canvas and scrolled from the outside.">Scroll lock: off</button>
    </div>
    <div class="compare-grid">
      <div class="compare-pane" data-side="a">
        <div class="compare-head"></div>
        <div class="frame-scroll">
          <iframe sandbox="allow-scripts" title="Model A output"></iframe>
        </div>
        <details class="compare-details"><summary>Validator details</summary><div class="details-body"></div></details>
      </div>
      <div class="compare-pane" data-side="b">
        <div class="compare-head"></div>
        <div class="frame-scroll">
          <iframe sandbox="allow-scripts" title="Model B output"></iframe>
        </div>
        <details class="compare-details"><summary>Validator details</summary><div class="details-body"></div></details>
      </div>
    </div>
  </section>

  <section id="tab-errors" class="tab-panel">
    <div class="toolbar">
      <input type="search" id="errors-filter" placeholder="Filter errors..." />
    </div>
    <div id="errors-list"></div>
  </section>
</main>

<div class="modal" id="modal" hidden>
  <div class="modal-inner">
    <header>
      <span id="modal-title"></span>
      <button id="modal-close" type="button">close</button>
    </header>
    <iframe id="modal-frame" sandbox="allow-scripts" title="Output preview"></iframe>
  </div>
</div>

<script>
  // The run data is embedded at build time by reporter.py
  window.RESULTS = {"timestamp": "2026-08-20T20-48-36Z", "dry_run": false, "defaults": {"temperature": 0.7, "max_tokens": 32000, "timeout_s": 600, "concurrency": 4}, "prompts": [{"id": "01-svg-clock", "body": "Build a self-contained HTML page showing a working analog clock rendered in SVG.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources.\n- One SVG analog clock, centered on the page, at least 320x320.\n- Hour, minute, and second hands. The second hand updates every 1 second.\n- Tick marks for every hour (longer) and every minute (shorter).\n- Display the current time digitally below the clock (HH:MM:SS, 24h).\n- Use a clean light-on-dark theme.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}, {"id": "02-fractal-tree", "body": "Build a self-contained HTML page that draws an animated fractal tree using an L-system on a Canvas.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources.\n- Render a recursive fractal tree on a <canvas>, generated from an L-system (axiom + rewrite rules) and drawn with turtle-style interpretation.\n- Animate the growth: branches extend and the tree unfolds over time via requestAnimationFrame, rather than appearing instantly.\n- A control panel with live sliders/inputs for at least: recursion depth, branch angle, length ratio between generations, and a randomness/jitter amount.\n- Color the branches by depth (e.g. trunk to twigs gradient) and optionally add leaves or blossoms at the tips.\n- A \"Regenerate\" button that redraws with the current settings and a fresh random seed.\n- Keep it performant and stable at higher depths (avoid freezing the page).\n- Use a pleasant background and color palette.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n\nCome up with an original, beautiful design and be creative."}, {"id": "03-tower-defense", "body": "Build a self-contained HTML page containing an iterative 2d tower defense game that has aspects of a rogue-like and replayability.\n\nRequirements:\n- style should be neon and low-poly.\n- one well designed level with a buildable grid\n- endless waves of enemies that are getting stronger wave by wave\n- at least 5 different enemies variants\n- at least 3 different upgradable turrets to build\n- turrets are endlessly upgradeable\n- a boss in each wave\n- skill tree that is upgradable between runs\n- a special feature (you decide what it is)\n\nCome up with an original idea and be creative."}, {"id": "04-particle-simulation", "body": "Build a self-contained HTML page with an interactive particle simulation rendered on a Canvas.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources.\n- A full-window <canvas> that continuously animates via requestAnimationFrame.\n- At least 300 particles that move with simple physics (velocity + gravity or drift) and wrap or bounce at the edges.\n- Mouse interaction: particles are attracted to or repelled from the cursor while the mouse moves over the canvas.\n- A small on-screen control panel to adjust at least two parameters live (e.g. particle count, gravity, attraction strength).\n- A live FPS counter shown in a corner.\n- Use a clean dark theme with subtly colored particles.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}, {"id": "05-game-of-life", "body": "Build a self-contained HTML page implementing Conway's Game of Life on a Canvas.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources.\n- A grid of at least 60x40 cells rendered on a <canvas>, with clearly visible cell borders.\n- Standard Conway rules (B3/S23), stepped on a fixed tick via requestAnimationFrame or setInterval.\n- Controls: Start/Pause, Step (advance one generation), Clear, and Randomize.\n- A speed slider that changes the simulation tick rate live.\n- Click or drag on the grid to toggle cells while paused.\n- At least two preset patterns selectable from a dropdown (e.g. Glider, Pulsar) that load onto the grid.\n- Show a live generation counter and the current population count.\n- Use a clean dark theme with clearly contrasting alive cells.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}, {"id": "06-physics-sandbox", "body": "Build a self-contained HTML page with a 2D physics sandbox of bouncing balls on a Canvas.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources.\n- A full-window <canvas> animated via requestAnimationFrame.\n- Balls of varying radius that fall under gravity, bounce off the walls and floor with energy loss (restitution), and collide with each other (circle-circle collision response).\n- Click on the canvas to spawn a new ball; click-drag to fling it with an initial velocity based on the drag vector.\n- A control panel to adjust at least three parameters live: gravity, restitution (bounciness), and friction.\n- Buttons to reset the scene and to toggle collisions between balls on/off.\n- Balls have distinct colors; show a live count of active balls.\n- Keep the simulation stable with dozens of balls (no runaway energy or tunneling through walls).\n- Use a clean dark theme.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}, {"id": "07-deskbox-clone", "body": "Build a self-contained HTML page that recreates the marketing homepage of \"desk.box\" (deskbox-office.de) as faithfully as possible from the description below.\n\nContext: desk.box is a German office software for agriculture (\"Die smarte B\u00fcrosoftware f\u00fcr die Landwirtschaft\"). Reproduce the German copy verbatim where quoted. Match the layout, section order, and visual hierarchy of a modern SaaS landing page.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources (no external images, fonts, or scripts). Replace every image, logo, screenshot, and video with an inline SVG placeholder or a CSS-styled box that carries a matching label.\n- Sticky top header with: a \"desk.box\" wordmark logo (left), a navigation bar with items \"Funktionen\", \"Preise\", \"Service\" (each with a dropdown caret), a \"Login\" link, and a prominent \"Jetzt testen\" call-to-action button.\n- Hero section: headline \"desk.box \u2013 Die smarte B\u00fcrosoftware f\u00fcr die Landwirtschaft\", three trust badges (\"GoBD zertifiziert\", \"Server in Deutschland\", \"E-Rechnung\"), a paragraph of body copy, and two buttons \"Kostenlos beraten lassen\" and \"Jetzt kostenlos testen\". Include a placeholder image of a person on one side and a product-screenshot placeholder with a \"Video abspielen\" play button overlay.\n- A row of at least eight feature bullets, each with a small inline-SVG icon, e.g. \"Direkte Schnittstelle zu deinem Steuerb\u00fcro\", \"E-Rechnung inklusive\", \"Vollst\u00e4ndiges Banking\", \"Intelligente Volltextsuche durch alle Dokumente\", \"Alle deine Betriebe auf einen Blick\", \"Einfacher Workflow\", \"Alle Dokumente in deiner Hosentasche\", \"Sichere und gesetzeskonforme Archivierung\".\n- A \"Das bietet dir desk.box\" section with five feature cards: Schreibtisch, Banking, Aktenschrank, Faktura, Adressbuch \u2014 each with an icon placeholder, a short German description, and a \"Mehr erfahren\" link.\n- A customer-testimonials section with at least four named quotes (e.g. \"Nico Ahlmann, Hof Ahlmann Gro\u00df Tessin\").\n- A blog/news teaser grid with at least three cards (image placeholder, headline, teaser text, \"Weiterlesen\" link).\n- A \"60 Tage kostenlos testen\" call-to-action band with a \"Jetzt registrieren\" button.\n- A footer with: the desk.box logo, two certification badge placeholders, contact details (phone \"+49(0)431 / 530 154 18\", email \"support(at)deskbox-office.de\", \"Supportzeiten: Mo bis Fr: 08:00 - 16:00 Uhr\"), social links (LinkedIn, Instagram, YouTube, Facebook, WhatsApp), footer navigation, and the copyright line \"\u00a9 2026 stadt.werk konzeption.text.gestaltung GmbH\".\n- The nav dropdowns must open on hover or click via inline JS. The layout must be responsive and collapse the nav into a hamburger menu on narrow viewports.\n- Use only system fonts. Choose a clean, professional color palette consistent with a business SaaS product.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}, {"id": "08-paint-app", "body": "Build a self-contained HTML page implementing a drawing/paint application on a Canvas.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources.\n- A main <canvas> drawing surface, at least 800x600, on a clearly bordered stage.\n- Freehand brush drawing with smooth lines that follow the mouse (and touch, if feasible).\n- A toolbar with: brush tool, eraser tool, an adjustable brush size (slider), a color picker, and a small preset color palette.\n- Undo and Redo buttons that step through the drawing history correctly.\n- A Clear button that empties the canvas (with the current background).\n- A \"Save as PNG\" button that exports the current canvas as a downloadable .png via a data URL.\n- Show the current brush size and selected color somewhere in the UI.\n- Use a clean, uncluttered light theme for the tool chrome.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}, {"id": "09-violin-3d", "body": "Build a self-contained HTML page featuring a playable violin rendered as an interactive 3D model.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources (no CDN, no external libraries, textures, or audio files). Use raw WebGL or CSS 3D transforms for the geometry, and the Web Audio API to synthesize sound.\n- A recognizable 3D violin: body with upper/lower bouts, neck, fingerboard, scroll, bridge, and four strings. It should be lit and shaded so the 3D form reads clearly.\n- The camera can be orbited with the mouse (drag to rotate, optionally scroll to zoom).\n- The violin is playable: clicking or hovering a string (optionally combined with keyboard keys for pitches) plays a synthesized note via Web Audio, tuned to the four violin strings (G3, D4, A4, E5).\n- Visual feedback when a string is played (e.g. the string vibrates or highlights).\n- A small on-screen hint explaining how to play.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n\nCome up with an original, visually appealing design and be creative."}, {"id": "10-markdown-editor", "body": "Build a self-contained HTML page implementing a Markdown editor with a live preview.\n\nRequirements:\n- Single .html file. Inline CSS and JS only. No external resources (no CDN, no external Markdown library). Implement the Markdown-to-HTML conversion yourself in vanilla JS.\n- A two-pane split layout: a raw Markdown <textarea> on the left, a rendered HTML preview on the right. The preview updates live as you type.\n- Support at least these Markdown features: headings (#..######), bold, italic, inline code, fenced code blocks, unordered and ordered lists, blockquotes, links, images, and horizontal rules.\n- Escape raw HTML in the input so the preview cannot execute injected scripts (basic XSS safety).\n- Prefill the editor with a sample Markdown document that demonstrates every supported feature.\n- A live word count and character count shown somewhere in the UI.\n- A \"Copy HTML\" button that copies the generated HTML source to the clipboard.\n- A responsive layout that stacks the two panes vertically on narrow viewports.\n- Use a clean, readable theme with monospaced font in the editor and proportional font in the preview.\n- Must be valid HTML5. Must not throw any JavaScript errors when loaded.\n- Output ONLY the HTML. No markdown fences, no commentary, no explanation."}], "models": [{"id": "Laguna-XS-2.1", "label": "Laguna-XS-2.1", "provider": "openai/llamacpp", "is_local": true, "kind": "hermine", "api_base": "http://172.30.48.1:8081/v1", "model_name": "Laguna-XS-2.1"}], "summary": {"total": 10, "total_cost_usd": 0.0, "status_counts": {"ok": 8, "broken": 2}}, "cells": [{"prompt_id": "01-svg-clock", "model_id": "Laguna-XS-2.1", "model_label": "Laguna-XS-2.1", "provider": "openai/llamacpp", "is_local": true, "is_dry_run": false, "kind": "hermine", "status": "ok", "html_file": "outputs/01-svg-clock__Laguna-XS-2.1.html", "raw_file": null, "thumbnail": "thumbnails/01-svg-clock__Laguna-XS-2.1.png", "latency_ms": 14827, "prompt_tokens": 227, "completion_tokens": 2375, "total_tokens": 2602, "cost_usd": null, "looks_like_html": true, "validation": {"status": "ok", "has_doctype": true, "has_html": true, "has_head": true, "has_body": true, "parse_issues": [], "runtime_issues": [], "thumbnail": "thumbnails/01-svg-clock__Laguna-XS-2.1.png"}, "error": null}, {"prompt_id": "02-fractal-tree", "model_id": "Laguna-XS-2.1", "model_label": "Laguna-XS-2.1", "provider": "openai/llamacpp", "is_local": true, "is_dry_run": false, "kind": "hermine", "status": "ok", "html_file": "outputs/02-fractal-tree__Laguna-XS-2.1.html", "raw_file": null, "thumbnail": "thumbnails/02-fractal-tree__Laguna-XS-2.1.png", "latency_ms": 33647, "prompt_tokens": 298, "completion_tokens": 5188, "total_tokens": 5486, "cost_usd": null, "looks_like_html": true, "validation": {"status": "ok", "has_doctype": true, "has_html": true, "has_head": true, "has_body": true, "parse_issues": [], "runtime_issues": [], "thumbnail": "thumbnails/02-fractal-tree__Laguna-XS-2.1.png"}, "error": null}, {"prompt_id": "03-tower-defense", "model_id": "Laguna-XS-2.1", "model_
