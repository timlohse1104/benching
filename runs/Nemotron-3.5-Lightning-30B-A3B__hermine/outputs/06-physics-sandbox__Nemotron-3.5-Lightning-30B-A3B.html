<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2D Physics Sandbox</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#181818;color:#e0e0e0}
canvas{display:block}
#controls{padding:12px 16px;background:#252526;min-height:80px;display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.panel{display:flex;flex-direction:column;gap:4px}
label{font-size:13px}
input[type=range]{width:120px}
button{padding:6px 12px;background:#3c3c3c;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px}
button:hover{background:#5a5a5a}
#ballCount{margin-left:auto;font-size:13px}
</style>
</head>
<body>
<canvas></canvas>
<div id="controls">
<div class="panel"><label>Gravity <span id="gravityVal">9.8</span></label><input type="range" id="gravity" min="0" max="20" step="0.1" value="9.8"></div>
<div class="panel"><label>Restitution <span id="restitutionVal">0.8</span></label><input type="range" id="restitution" min="0" max="1" step="0.05" value="0.8"></div>
<div class="panel"><label>Friction <span id="frictionVal">0.02</span></label><input type="range" id="friction" min="0" max="0.1" step="0.005" value="0.02"></div>
<button id="reset">Reset</button>
<button id="toggleCollisions">Collisions: On</button>
<span id="ballCount">0 balls</span>
</div>
<script>
const canvas=document.querySelector('canvas');
const ctx=canvas.getContext('2d');
let width=window.innerWidth;
let height=window.innerHeight;
canvas.width=width;
canvas.height=height;

const balls=[];
let gravity=9.8;
let restitution=0.8;
let friction=0.02;
let enableCollisions=true;
let isDragging=false;
let startX=0, startY=0;

function getDistinctColor(i){
const hue=(i*71)%360;
return`hsl(${hue},65%,55%)`;
}

class Ball{
constructor(x,y,radius,vx,vy){
this.x=x;
this.y=y;
this.radius=radius!==undefined?radius:15+Math.random()*15;
this.vx=vx!==undefined?vx:0;
this.vy=vy!==undefined?vy:0;
this.color=getDistinctColor(balls.length);
this.mass=this.radius*this.radius;
}
}

function spawnBall(x,y,vx,vy){
balls.push(new Ball(x,y,undefined,vx,vy));
}

function resolveWallCollision(b){
if(b.x-b.radius<0){b.x=b.radius;b.vx=-b.vx*restitution;}
if(b.x+b.radius>width){b.x=width-b.radius;b.vx=-b.vx*restitution;}
if(b.y-b.radius<0){b.y=b.radius;b.vy=-b.vy*restitution;}
if(b.y+b.radius>height){b.y=height-b.radius;b.vy=-b.vy*restitution;if(Math.abs(b.vy)<0.3)b.vy=0;}
}

function resolveBallCollisions(){
if(!enableCollisions)return;
const n=balls.length;
for(let i=0;i<n;i++){
for(let j=i+1;j<n;j++){
const b1=balls[i],b2=balls[j];
const dx=b2.x-b1.x;
const dy=b2.y-b1.y;
const dist=Math.hypot(dx,dy);
const minDist=b1.radius+b2.radius;
if(dist<minDist&&dist>0){
const nx=dx/dist;
const ny=dy/dist;
const overlap=minDist-dist;
b1.x-=nx*overlap*(b2.mass/(b1.mass+b2.mass+1e-5));
b2.x+=nx*overlap*(b1.mass/(b1.mass+b2.mass+1e-5));
b1.y-=ny*overlap*(b2.mass/(b1.mass+b2.mass+1e-5));
b2.y+=ny*overlap*(b1.mass/(b1.mass+b2.mass+1e-5));
const rvx=b1.vx-b2.vx;
const rvy=b1.vy-b2.vy;
const velAlongNorm=rvx*nx+rvy*ny;
if(velAlongNorm>0)continue;
const impulse=-(1+restitution)*velAlongNorm;
const jx=impulse*nx;
const jy=impulse*ny;
b1.vx-=jx/b1.mass;
b1.vy-=jy/b1.mass;
b2.vx+=jx/b2.mass;
b2.vy+=jy/b2.mass;
}
}
}
}

function update(){
const dt=1/60;
for(const b of balls){
b.vy+=gravity*dt;
b.vx*=1-friction*dt;
b.vy*=1-friction*dt;
b.x+=b.vx*dt;
b.y+=b.vy*dt;
resolveWallCollision(b);
}
for(let i=0;i<3;i++)resolveBallCollisions();
ctx.clearRect(0,0,width,height);
for(const b of balls){
ctx.beginPath();
ctx.arc(b.x,b.y,b.radius,0,Math.PI*2);
ctx.fillStyle=b.color;
ctx.fill();
}
document.getElementById('ballCount').innerText=balls.length+' balls';
}

function animate(){
update();
requestAnimationFrame(animate);
}

canvas.addEventListener('mousedown',e=>{
isDragging=true;
const rect=canvas.getBoundingClientRect();
startX=e.clientX-rect.left;
startY=e.clientY-rect.top;
});
canvas.addEventListener('mousemove',e=>{
if(isDragging){
const rect=canvas.getBoundingClientRect();
startX=e.clientX-rect.left;
startY=e.clientY-rect.top;
}
});
canvas.addEventListener('mouseup',e=>{
if(!isDragging)return;
const dx=startX-startX; // placeholder, will recalc
// Actually we need end pos; let's redo drag tracking properly
isDragging=false;
});

</script>
</body>
</html>
