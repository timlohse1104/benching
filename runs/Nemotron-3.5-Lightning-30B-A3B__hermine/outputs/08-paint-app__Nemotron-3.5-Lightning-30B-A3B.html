<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simple Paint</title>
<style>
body{margin:2rem;padding:0;font-family:system-ui,sans-serif;background:#f5f5f5}
.container{max-width:960px;margin:0 auto}
.toolbar{display:flex;gap:0.5rem;align-items:center;flex-wrap:wrap;margin-bottom:1rem}
.toolbar input,.toolbar button{padding:0.4rem 0.6rem;font-size:0.85rem}
.color-preview{width:2rem;height:2rem;border:2px solid #fff;box-shadow:0 0 0 1px #ddd;margin-right:0.4rem}
#drawCanvas{width:800px;height:600px;border:2px solid #ddd;background:#fff;display:block;cursor:crosshair}
#status{margin-left:1rem;font-size:0.85rem;color:#555;white-space:nowrap}
.preset-palette{display:flex;gap:0.2rem}
.preset-color{width:1.5rem;height:1.5rem;border:2px solid #fff;cursor:pointer;box-shadow:0 0 0 1px #ddd}
.preset-color.selected{border:2px solid #007AFF}
</style>
</head>
<body>
<div class="container">
<div class="toolbar">
<button id="undoBtn">Undo</button>
<button id="redoBtn">Redo</button>
<button id="clearBtn">Clear</button>
<button id="saveBtn">Save as PNG</button>
<label style="display:flex;align-items:center;gap:0.4rem;"><span>Size:</span><input type="range" id="sizeSlider" min="1" max="50" value="5"></label>
<label style="display:flex;align-items:center;gap:0.4rem;"><span>Color:</span><input type="color" id="colorPicker" value="#000000"></label>
<div style="display:flex;gap:0.2rem;">
<div class="preset-color selected" data-color="#000"></div>
<div class="preset-color" data-color="#ff0000"></div>
<div class="preset-color" data-color="#00ff00"></div>
<div class="preset-color" data-color="#0000ff"></div>
<div class="preset-color" data-color="#ffff00"></div>
<div class="preset-color" data-color="#ff00ff"></div>
<div class="preset-color" data-color="#00ffff"></div>
</div>
</div>
<div style="display:flex;gap:1rem;align-items:center;">
<canvas id="drawCanvas" width="800" height="600"></canvas>
<div id="status">Size: 5 | Color: #000000</div>
</div>
</div>

<script>
const canvas=document.getElementById('drawCanvas');
const ctx=canvas.getContext('2d');
const status=document.getElementById('status');
const sizeSlider=document.getElementById('sizeSlider');
const colorPicker=document.getElementById('colorPicker');
const undoBtn=document.getElementById('undoBtn');
const redoBtn=document.getElementById('redoBtn');
const clearBtn=document.getElementById('clearBtn');
const saveBtn=document.getElementById('saveBtn');

let brushSize=5;
let color='#000000';
let isDrawing=false;
let history=[];
let redoStack=[];
const maxHistory=30;

ctx.lineCap='round';
ctx.lineJoin='round';

function updateStatus(){status.textContent=`Size: ${brushSize} | Color: ${color}`}
updateStatus();

function pushHistory(){
if(history.length>=maxHistory)history.shift();
history.push(canvas.toDataURL());
redoStack.length=0;
}

function undo(){
if(history.length===0)return;
redoStack.push(canvas.toDataURL());
const last=history.pop();
const img=new Image();
img.src=last;
img.onload=()=>{
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(img,0,0);
}
}

function redo(){
if(redoStack.length===0)return;
const last=redoStack.pop();
history.push(canvas.toDataURL());
const img=new Image();
img.src=last;
img.onload=()=>{
ctx.clearRect(0,0,canvas.width,canvas.height);
ctx.drawImage(img,0,0);
}
}

function clearCanvas(){
ctx.clearRect(0,0,canvas.width,canvas.height);
history.length=0;
redoStack.length=0;
updateStatus();
}

function savePNG(){
const link=document.createElement('a');
link.download='drawing.png';
link.href=canvas.toDataURL('image/png');
document.body.appendChild(link);
link.click();
document.body.removeChild(link);
}

undoBtn.addEventListener('click',undo);
redoBtn.addEventListener('click',redo);
clearBtn.addEventListener('click',clearCanvas);
saveBtn.addEventListener('click',savePNG);

sizeSlider.addEventListener('input',(e)=>{
brushSize=parseInt(e.target.value);
ctx.lineWidth=brushSize;
updateStatus();
});

colorPicker.addEventListener('input',(e)=>{
color=e.target.value;
updateStatus();
});

document.querySelectorAll('.preset-color').forEach(el=>{
el.addEventListener('click',()=>{
color=el.dataset.color;
colorPicker.value=color;
document.querySelectorAll('.preset-color').forEach(e=>e.classList.remove('selected'));
el.classList.add('selected');
updateStatus();
});
});

canvas.addEventListener('pointerdown',(e)=>{
isDrawing=true;
ctx.beginPath();
ctx.moveTo(e.offsetX,e.offsetY);
});

canvas.addEventListener('pointermove',(e)=>{
if(!isDrawing)return;
ctx.lineTo(e.offsetX,e.offsetY);
ctx.stroke();
});

canvas.addEventListener('pointerup',()=>{
if(isDrawing){
pushHistory();
isDrawing=false;
}
});

canvas.addEventListener('pointerleave',()=>{
if(isDrawing){
pushHistory();
isDrawing=false;
}
});

canvas.style.touchAction='none';
</script>
</body>
</html>
