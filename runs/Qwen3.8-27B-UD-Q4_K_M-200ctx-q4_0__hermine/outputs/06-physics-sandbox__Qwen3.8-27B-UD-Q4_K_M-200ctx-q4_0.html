<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a0f16">
<title>Bounce Lab — 2D Physics Sandbox</title>
<style>
  :root{
    --bg:#0a0f16;
    --line:#1f2b3a;
    --ink:#e8eef6;
    --dim:#8fa1b5;
    --amber:#ffb454;
    --teal:#4ecdc4;
    --red:#ff6b6b;
    --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;
    --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--sans);
    overflow:hidden;
    user-select:none;
    -webkit-user-select:none;
  }
  #scene{
    position:fixed;inset:0;display:block;
    cursor:crosshair;
    touch-action:none;
  }

  /* ---------- control panel ---------- */
  .panel{
    position:fixed;top:16px;left:16px;width:276px;z-index:5;
    background:linear-gradient(180deg,rgba(18,27,38,.96),rgba(13,20,29,.96));
    border:1px solid var(--line);
    border-radius:12px;
    box-shadow:0 18px 50px -18px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.07);
    overflow:hidden;
    animation:rise .55s cubic-bezier(.2,.9,.3,1.15) both;
  }
  .panel::before{
    content:"";display:block;height:3px;
    background:linear-gradient(90deg,var(--amber),var(--teal) 60%,transparent);
  }
  @keyframes rise{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}

  .p-head{
    display:flex;align-items:center;gap:10px;
    padding:12px 14px 10px;
    border-bottom:1px solid var(--line);
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--teal);box-shadow:0 0 10px var(--teal);
    animation:pulse 2s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
  h1{
    font:700 13px/1 var(--mono);
    letter-spacing:.2em;text-transform:uppercase;
  }
  h1 b{color:var(--amber);font-weight:700}
  .icon{
    margin-left:auto;width:22px;height:22px;border-radius:6px;
    border:1px solid var(--line);background:#16202d;color:var(--dim);
    font:600 13px/1 var(--mono);cursor:pointer;
    transition:color .15s,border-color .15s,transform .12s;
  }
  .icon:hover{color:var(--ink);border-color:#33465e;transform:translateY(-1px)}
  .panel.collapsed .p-body{display:none}

  .stats{
    display:grid;grid-template-columns:1fr 1fr;gap:1px;
    background:var(--line);border-bottom:1px solid var(--line);
  }
  .stat{background:#0e151f;padding:10px 14px 11px}
  .s-label{
    display:block;font:600 9px var(--mono);
    letter-spacing:.18em;text-transform:uppercase;
    color:#5f7288;margin-bottom:5px;
  }
  .s-val{font:700 21px/1 var(--mono);color:var(--ink)}
  #count{color:var(--amber)}
  .s-max{font-size:11px;color:#54677d;margin-left:3px}

  .ctl{padding:11px 14px 3px}
  .ctl .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:7px}
  .ctl label{
    font:600 10px var(--mono);letter-spacing:.15em;
    text-transform:uppercase;color:var(--dim);
  }
  .ctl output{font:700 12px var(--mono);color:var(--ink)}

  input[type=range]{
    -webkit-appearance:none;appearance:none;
    width:100%;height:18px;background:transparent;cursor:pointer;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px;border-radius:2px;background:var(--trk,#223042);
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;width:14px;height:14px;margin-top:-5px;border-radius:50%;
    background:#0d141d;border:2px solid var(--thumb,var(--amber));
    box-shadow:0 0 0 0 rgba(255,180,84,0);
    transition:box-shadow .15s,transform .15s;
  }
  input[type=range]:hover::-webkit-slider-thumb{
    transform:scale(1.15);
    box-shadow:0 0 0 5px rgba(255,180,84,.14);
  }
  input[type=range]:focus-visible{outline:none}
  input[type=range]:focus-visible::-webkit-slider-thumb{box-shadow:0 0 0 5px rgba(255,180,84,.25)}
  input[type=range]::-moz-range-track{
    height:4px;border-radius:2px;background:var(--trk,#223042);
  }
  input[type=range]::-moz-range-thumb{
    width:11px;height:11px;border-radius:50%;
    background:#0d141d;border:2px solid var(--thumb,var(--amber));
  }

  .btns{
    display:grid;grid-template-columns:1fr 1fr;gap:8px;
    padding:12px 14px 14px;
  }
  button.btn{
    font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;
    padding:10px 8px;border-radius:8px;
    border:1px solid var(--line);background:#16202d;color:var(--ink);
    cursor:pointer;
    transition:transform .12s,border-color .15s,background .15s,box-shadow .15s,color .15s;
  }
  button.btn:hover{transform:translateY(-1px);border-color:#33465e;background:#1a2635}
  button.btn:active{transform:translateY(0)}
  button.btn:focus-visible{outline:2px solid rgba(255,180,84,.5);outline-offset:2px}
  #resetBtn{grid-column:1/-1;border-color:#4a3a20;color:var(--amber);background:#1a1610}
  #resetBtn:hover{background:#241c12;border-color:#6b5228;box-shadow:0 6px 18px -8px rgba(255,180,84,.4)}
  #colBtn.on{border-color:#1f4d48;color:var(--teal);background:#0f1a1a}
  #colBtn.on:hover{background:#122222;border-color:#2c6b64}

  .hint{
    position:fixed;right:16px;bottom:14px;z-index:5;pointer-events:none;
    font:500 12px/1.5 var(--sans);color:#5d7189;
    animation:rise .6s .2s both;
  }
  .hint .k{
    font:600 11px var(--mono);color:#a9bdd4;
    border:1px solid #2a3a4e;border-radius:5px;
    padding:2px 6px;margin-right:5px;background:#121b26;
  }

  @media (max-width:520px){
    .panel{width:calc(100vw - 32px)}
    .hint{display:none}
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<aside class="panel" id="panel" aria-label="Simulation controls">
  <header class="p-head">
    <span class="dot" aria-hidden="true"></span>
    <h1>Bounce<b>Lab</b></h1>
    <button class="icon" id="collapseBtn" aria-label="Collapse panel">&ndash;</button>
  </header>
  <div class="p-body" id="pBody">
    <div class="stats">
      <div class="stat">
        <span class="s-label">Balls</span>
        <span class="s-val"><span id="count">0</span><span class="s-max">/150</span></span>
      </div>
      <div class="stat">
        <span class="s-label">FPS</span>
        <span class="s-val" id="fps">60</span>
      </div>
    </div>

    <div class="ctl">
      <div class="row"><label for="g">Gravity</label><output id="gOut">1400</output></div>
      <input type="range" id="g" min="0" max="3000" step="10" value="1400">
    </div>
    <div class="ctl">
      <div class="row"><label for="rest">Bounciness</label><output id="restOut">0.78</output></div>
      <input type="range" id="rest" min="0" max="0.95" step="0.01" value="0.78">
    </div>
    <div class="ctl" style="margin-bottom:8px">
      <div class="row"><label for="fric">Friction</label><output id="fricOut">0.12</output></div>
      <input type="range" id="fric" min="0" max="1" step="0.01" value="0.12">
    </div>

    <div class="btns">
      <button class="btn" id="resetBtn">&#8634; Reset scene</button>
      <button class="btn" id="clearBtn">Clear</button>
      <button class="btn on" id="colBtn" aria-pressed="true">Collide &middot; On</button>
    </div>
  </div>
</aside>

<div class="hint"><span class="k">click</span>drop a ball &nbsp;&middot;&nbsp; <span class="k">drag</span>fling it</div>

<script>
(function(){
"use strict";

var TAU = Math.PI * 2;
var canvas = document.getElementById('scene');
var ctx = canvas.getContext('2d');
var bg = document.createElement('canvas');
var bctx = bg.getContext('2d');

function $(id){ return document.getElementById(id); }
var countEl = $('count'), fpsEl = $('fps');
var gEl = $('g'), restEl = $('rest'), fricEl = $('fric');
var gOut = $('gOut'), restOut = $('restOut'), fricOut = $('fricOut');
var resetBtn = $('resetBtn'), clearBtn = $('clearBtn'), colBtn = $('colBtn');
var panel = $('panel'), collapseBtn = $('collapseBtn');

var MAX_BALLS = 150;
var MAX_SPEED = 3200;
var SUBSTEPS  = 5;
var FLING_K   = 5.5;
var MONO = 'ui-monospace,Menlo,Consolas,monospace';

var params = { g: 1400, rest: 0.78, fric: 0.12, collide: true };

var PALETTE = ['#ffb454','#ff6b6b','#4ecdc4','#a78bfa','#f472b6','#a3e635',
               '#38bdf8','#fb923c','#f43f5e','#34d399','#e879f9','#facc15'];

var W = 0, H = 0, DPR = 1;
var balls = [];
var ripples = [];
var drag = null;

function rand(a,b){ return a + Math.random() * (b - a); }
function pick(a){ return a[(Math.random() * a.length) | 0]; }
function clampIn(v,lo,hi){ return Math.min(Math.max(v,lo),hi); }

function mixc(hex, rgb, t){
  var n = parseInt(hex.slice(1), 16);
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  return 'rgb(' +
    Math.round(r + (rgb[0] - r) * t) + ',' +
    Math.round(g + (rgb[1] - g) * t) + ',' +
    Math.round(b + (rgb[2] - b) * t) + ')';
}

function makeBall(x, y, vx, vy, r, color){
  return {
    x: x, y: y, vx: vx, vy: vy, r: r,
    m: r * r,
    color: color,
    cl: mixc(color, [255,255,255], 0.55),
    cd: mixc(color, [10,14,20], 0.45),
    born: performance.now()
  };
}

function spawn(x, y, vx, vy, r, color){
  if(!r) r = rand(11, 26);
  x = (W > 2 * r) ? clampIn(x, r, W - r) : W / 2;
  y = (H > 2 * r) ? clampIn(y, r, H - r) : H / 2;
  var b = makeBall(x, y, vx || 0, vy || 0, r, color || pick(PALETTE));
  balls.push(b);
  if(balls.length > MAX_BALLS) balls.shift();
  countEl.textContent = balls.length;
  return b;
}

function resetScene(){
  balls.length = 0;
  ripples.length = 0;
  for(var i = 0; i < 12; i++){
    var r = rand(11, 26);
    spawn(rand(r, W - r), rand(r, Math.max(r + 4, H * 0.5)),
          rand(-180, 180), rand(-60, 60), r);
  }
  countEl.textContent = balls.length;
}

function pushRipple(x, y, speed, color){
  if(ripples.length > 50) return;
  ripples.push({ x: x, y: y, r: 3, v: 140 + speed * 0.3,
                 a: Math.min(0.55, 0.18 + speed / 2200), color: color });
}

function updateRipples(dt){
  for(var i = ripples.length - 1; i >= 0; i--){
    var rp = ripples[i];
    rp.r += rp.v * dt;
    rp.v *= Math.max(0, 1 - 2.6 * dt);
    rp.a -= dt * 1.15;
    if(rp.a <= 0) ripples.splice(i, 1);
  }
}

/* ---------------- physics ---------------- */

function step(dt){
  var g = params.g, e = params.rest;
  var airF  = Math.exp(-params.fric * 0.9 * dt);
  var gFric = Math.exp(-(1.5 + params.fric * 14) * dt);
  var i, j, b;

  for(i = 0; i < balls.length; i++){
    b = balls[i];
    b.vy += g * dt;
    b.vx *= airF; b.vy *= airF;

    var s2 = b.vx * b.vx + b.vy * b.vy;
    if(s2 > MAX_SPEED * MAX_SPEED){
      var s = MAX_SPEED / Math.sqrt(s2);
      b.vx *= s; b.vy *= s;
    }

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    if(b.x < b.r){
      b.x = b.r;
      if(b.vx < 0){ var h = -b.vx; b.vx = h * e; if(h > 280) pushRipple(2, b.y, h, b.color); }
    } else if(b.x > W - b.r){
      b.x = W - b.r;
      if(b.vx > 0){ var h2 = b.vx; b.vx = -h2 * e; if(h2 > 280) pushRipple(W - 2, b.y, h2, b.color); }
    }
    if(b.y < b.r){
      b.y = b.r;
      if(b.vy < 0){ var h3 = -b.vy; b.vy = h3 * e; if(h3 > 280) pushRipple(b.x, 2, h3, b.color); }
    } else if(b.y > H - b.r){
      b.y = H - b.r;
      if(b.vy > 0){
        var h4 = b.vy; b.vy = -h4 * e;
        if(Math.abs(b.vy) < 26) b.vy = 0;
        if(h4 > 280) pushRipple(b.x, H - 2, h4, b.color);
      }
      b.vx *= gFric;
      if(Math.abs(b.vx) < 3) b.vx = 0;
    }
  }

  if(!params.collide) return;

  for(i = 0; i < balls.length; i++){
    var a = balls[i];
    for(j = i + 1; j < balls.length; j++){
      b = balls[j];
      var dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r;
      if(dx > rr || dx < -rr || dy > rr || dy < -rr) continue;
      var d2 = dx * dx + dy * dy;
      if(d2 >= rr * rr) continue;

      var d = Math.sqrt(d2), nx, ny;
      if(d < 1e-6){ nx = 1; ny = 0; d = 0.01; }
      else { nx = dx / d; ny = dy / d; }

      var invA = 1 / a.m, invB = 1 / b.m, invS = invA + invB;

      var corr = Math.max(rr - d - 0.4, 0) / invS * 0.85;
      a.x -= nx * corr * invA; a.y -= ny * corr * invA;
      b.x += nx * corr * invB; b.y += ny * corr * invB;

      var vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if(vn < 0){
        var jimp = -(1 + e) * vn / invS;
        a.vx -= jimp * nx * invA; a.vy -= jimp * ny * invA;
        b.vx += jimp * nx * invB; b.vy += jimp * ny * invB;
        if(-vn > 520) pushRipple(a.x + nx * a.r, a.y + ny * a.r, -vn, b.color);
      }
    }
  }
}

/* ---------------- rendering ---------------- */

function paintBG(){
  bg.width = canvas.width; bg.height = canvas.height;
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  var base = bctx.createLinearGradient(0, 0, 0, H);
  base.addColorStop(0, '#0e1522');
  base.addColorStop(0.55, '#0a1019');
  base.addColorStop(1, '#0c121c');
  bctx.fillStyle = base;
  bctx.fillRect(0, 0, W, H);

  bctx.fillStyle = 'rgba(126,164,214,0.09)';
  var x, y;
  for(x = 24; x < W; x += 48)
    for(y = 24; y < H; y += 48)
      bctx.fillRect(x - 1, y - 1, 2, 2);

  bctx.strokeStyle = 'rgba(126,164,214,0.05)';
  bctx.lineWidth = 1;
  bctx.beginPath();
  for(x = 240; x < W; x += 240){ bctx.moveTo(x + 0.5, 0); bctx.lineTo(x + 0.5, H); }
  for(y = 240; y < H; y += 240){ bctx.moveTo(0, y + 0.5); bctx.lineTo(W, y + 0.5); }
  bctx.stroke();

  var fg = bctx.createLinearGradient(0, H - 90, 0, H);
  fg.addColorStop(0, 'rgba(78,205,196,0)');
  fg.addColorStop(1, 'rgba(78,205,196,0.10)');
  bctx.fillStyle = fg;
  bctx.fillRect(0, H - 90, W, 90);

  bctx.fillStyle = 'rgba(150,190,230,0.16)';
  bctx.fillRect(0, H - 1, W, 1);

  var vg = bctx.createRadialGradient(W / 2, H * 0.42, Math.min(W, H) * 0.3,
                                     W / 2, H * 0.5, Math.max(W, H) * 0.8);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.4)');
  bctx.fillStyle = vg;
  bctx.fillRect(0, 0, W, H);
}

function drawAim(){
  if(!drag) return;
  var dx = drag.cx - drag.sx, dy = drag.cy - drag.sy;
  var dist = Math.hypot(dx, dy);

  ctx.save();

  ctx.setLineDash([6, 6]);
  ctx.lineWidth = 1.5;
  ctx.strokeStyle = drag.color;
  ctx.globalAlpha = 0.9;
  ctx.beginPath(); ctx.arc(drag.sx, drag.sy, drag.r, 0, TAU); ctx.stroke();
  ctx.setLineDash([]);
  ctx.globalAlpha = 0.15;
  ctx.fillStyle = drag.color;
  ctx.beginPath(); ctx.arc(drag.sx, drag.sy, drag.r, 0, TAU); ctx.fill();

  if(dist > 7){
    var vx = dx * FLING_K, vy = dy * FLING_K;
    var sp = Math.hypot(vx, vy);
    if(sp > MAX_SPEED){ vx *= MAX_SPEED / sp; vy *= MAX_SPEED / sp; }

    var px = drag.sx, py = drag.sy, tx = vx, ty = vy;
    var hdt = 1 / 60, airF = Math.exp(-params.fric * 0.9 * hdt);
    ctx.fillStyle = drag.color;
    for(var i = 1; i <= 56; i++){
      ty += params.g * hdt;
      tx *= airF; ty *= airF;
      px += tx * hdt; py += ty * hdt;
      if(py > H - drag.r || px < drag.r || px > W - drag.r) break;
      if(i % 3 === 0){
        ctx.globalAlpha = Math.max(0.04, 0.5 * (1 - i / 56));
        ctx.beginPath(); ctx.arc(px, py, 2.2, 0, TAU); ctx.fill();
      }
    }

    ctx.globalAlpha = 0.95;
    ctx.strokeStyle = drag.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(drag.sx, drag.sy);
    ctx.lineTo(drag.cx, drag.cy);
    ctx.stroke();

    var ang = Math.atan2(dy, dx);
    ctx.beginPath();
    ctx.moveTo(drag.cx, drag.cy);
    ctx.lineTo(drag.cx - 11 * Math.cos(ang - 0.42), drag.cy - 11 * Math.sin(ang - 0.42));
    ctx.moveTo(drag.cx, drag.cy);
    ctx.lineTo(drag.cx - 11 * Math.cos(ang + 0.42), drag.cy - 11 * Math.sin(ang + 0.42));
    ctx.stroke();

    var spd = Math.round(Math.hypot(vx, vy));
    ctx.font = '11px ' + MONO;
    ctx.fillStyle = 'rgba(215,230,245,0.9)';
    ctx.fillText(spd + ' u/s',
      clampIn(drag.cx + 14, 4, W - 70),
      clampIn(drag.cy - 12, 14, H - 8));
  }
  ctx.restore();
}

function draw(){
  ctx.drawImage(bg, 0, 0, W, H);

  var i, rp, b, t, s, R, g, now = performance.now();

  for(i = 0; i < ripples.length; i++){
    rp = ripples[i];
    ctx.globalAlpha = rp.a;
    ctx.strokeStyle = rp.color;
    ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(rp.x, rp.y, rp.r, 0, TAU); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  for(i = 0; i < balls.length; i++){
    b = balls[i];
    t = (now - b.born) / 170;
    if(t >= 1) s = 1;
    else {
      var c1 = 1.70158, c3 = c1 + 1, tt = t - 1;
      s = 1 + c3 * tt * tt * tt + c1 * tt * tt;
    }
    R = b.r * Math.max(s, 0.05);

    g = ctx.createRadialGradient(b.x - R * 0.35, b.y - R * 0.42, R * 0.12, b.x, b.y, R);
    g.addColorStop(0, b.cl);
    g.addColorStop(0.55, b.color);
    g.addColorStop(1, b.cd);
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(b.x, b.y, R, 0, TAU); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.28)';
    ctx.beginPath();
    ctx.arc(b.x - R * 0.34, b.y - R * 0.42, R * 0.16, 0, TAU);
    ctx.fill();
  }

  drawAim();
}

/* ---------------- main loop ---------------- */

var last = performance.now(), fpsEMA = 60, fpsTick = 0;

function frame(now){
  var raw = (now - last) / 1000;
  last = now;
  var dt = Math.min(Math.max(raw, 0), 1 / 30);

  if(dt > 0){
    var h = dt / SUBSTEPS;
    for(var s = 0; s < SUBSTEPS; s++) step(h);
    updateRipples(dt);

    if(raw > 0) fpsEMA += (1 / raw - fpsEMA) * 0.08;
    if(now - fpsTick > 300){
      fpsTick = now;
      fpsEl.textContent = String(Math.min(999, Math.round(fpsEMA)));
    }
  }
  draw();
  requestAnimationFrame(frame);
}

/* ---------------- input ---------------- */

function pt(e){
  var r = canvas.getBoundingClientRect();
  return { x: e.clientX - r.left, y: e.clientY - r.top };
}

canvas.addEventListener('pointerdown', function(e){
  if(e.pointerType === 'mouse' && e.button !== 0) return;
  var p = pt(e);
  drag = { sx: p.x, sy: p.y, cx: p.x, cy: p.y, r: rand(11, 24), color: pick(PALETTE) };
  try { canvas.setPointerCapture(e.pointerId); } catch(err) {}
});

canvas.addEventListener('pointermove', function(e){
  if(!drag) return;
  var p = pt(e);
  drag.cx = p.x; drag.cy = p.y;
});

function endDrag(){
  if(!drag) return;
  var dx = drag.cx - drag.sx, dy = drag.cy - drag.sy;
  var dist = Math.hypot(dx, dy);
  var vx, vy;
  if(dist < 7){
    vx = rand(-70, 70); vy = rand(-30, 0);
  } else {
    vx = dx * FLING_K; vy = dy * FLING_K;
    var sp = Math.hypot(vx, vy);
    if(sp > MAX_SPEED){ vx *= MAX_SPEED / sp; vy *= MAX_SPEED / sp; }
  }
  spawn(drag.sx, drag.sy, vx, vy, drag.r, drag.color);
  drag = null;
}

canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', function(){ drag = null; });

/* ---------------- controls ---------------- */

function bindSlider(el, out, fmt, apply, accent){
  var thumb = accent;
  el.style.setProperty('--thumb', thumb);
  function paint(){
    var p = ((el.value - el.min) / (el.max - el.min)) * 100;
    el.style.setProperty('--trk', 'linear-gradient(90deg,' + accent + ' ' + p + '%,#223042 ' + p + '%)');
  }
  el.addEventListener('input', function(){
    var v = parseFloat(el.value);
    apply(v);
    out.textContent = fmt(v);
    paint();
  });
  paint();
}

bindSlider(gEl, gOut,
  function(v){ return String(Math.round(v)); },
  function(v){ params.g = v; }, '#ffb454');
bindSlider(restEl, restOut,
  function(v){ return v.toFixed(2); },
  function(v){ params.rest = v; }, '#4ecdc4');
bindSlider(fricEl, fricOut,
  function(v){ return v.toFixed(2); },
  function(v){ params.fric = v; }, '#ff6b6b');

resetBtn.addEventListener('click', resetScene);

clearBtn.addEventListener('click', function(){
  balls.length = 0;
  ripples.length = 0;
  countEl.textContent = '0';
});

function setCollide(on){
  params.collide = on;
  colBtn.classList.toggle('on', on);
  colBtn.textContent = on ? 'Collide \u00B7 On' : 'Collide \u00B7 Off';
  colBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
}
colBtn.addEventListener('click', function(){ setCollide(!params.collide); });

collapseBtn.addEventListener('click', function(){
  var c = panel.classList.toggle('collapsed');
  collapseBtn.textContent = c ? '+' : '\u2013';
});

/* ---------------- resize + init ---------------- */

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.max(1, Math.round(W * DPR));
  canvas.height = Math.max(1, Math.round(H * DPR));
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paintBG();
  for(var i = 0; i < balls.length; i++){
    var b = balls[i];
    b.x = (W > 2 * b.r) ? clampIn(b.x, b.r, W - b.r) : W / 2;
    b.y = (H > 2 * b.r) ? clampIn(b.y, b.r, H - b.r) : H / 2;
  }
}
window.addEventListener('resize', resize);

resize();
resetScene();
requestAnimationFrame(frame);
})();
</script>
