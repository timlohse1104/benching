<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analog Clock</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #12151c;
    color: #e8eef5;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .clock-wrap {
    text-align: center;
  }
  svg {
    display: block;
    margin: 0 auto;
    filter: drop-shadow(0 6px 18px rgba(0, 0, 0, 0.45));
  }
  .digital {
    margin-top: 18px;
    font-size: 28px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 2px;
    color: #9fd3ff;
  }
</style>
</head>
<body>
  <div class="clock-wrap">
    <svg id="clock" width="340" height="340" viewBox="0 0 340 340" role="img" aria-label="Analog clock showing current time">
      <rect x="0" y="0" width="340" height="340" rx="16" fill="#1b1f29"/>
      <circle cx="170" cy="170" r="150" fill="#222833" stroke="#3a4250" stroke-width="2"/>
      <g id="ticks"></g>
      <g id="hands">
        <line id="hour" x1="170" y1="170" x2="170" y2="92"/>
        <line id="minute" x1="170" y1="170" x2="170" y2="55"/>
        <line id="second" x1="170" y1="192" x2="170" y2="45"/>
      </g>
      <circle cx="170" cy="170" r="6" fill="#9fd3ff"/>
    </svg>
    <div class="digital" id="digital">00:00:00</div>
  </div>

<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var ticksGroup = document.getElementById('ticks');
  var cx = 170, cy = 170, r = 150;

  // Build tick marks: hour (longer) and minute (shorter)
  for (var i = 0; i < 60; i++) {
    var isHour = (i % 5 === 0);
    var angle = (i * 6) * Math.PI / 180;
    var outer = r - 6;
    var inner = isHour ? r - 21 : r - 13;
    var x1 = cx + inner * Math.sin(angle);
    var y1 = cy - inner * Math.cos(angle);
    var x2 = cx + outer * Math.sin(angle);
    var y2 = cy - outer * Math.cos(angle);

    var line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('stroke', isHour ? '#e8eef5' : '#8a93a2');
    line.setAttribute('stroke-width', isHour ? 3 : 1.5);
    line.setAttribute('stroke-linecap', 'round');
    ticksGroup.appendChild(line);
  }

  var hourHand = document.getElementById('hour');
  var minuteHand = document.getElementById('minute');
  var secondHand = document.getElementById('second');
  var digital = document.getElementById('digital');

  function pad(n) {
    return n < 10 ? '0' + n : '' + n;
  }

  function update() {
    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();

    var secondDeg = s * 6;
    var minuteDeg = m * 6 + s * 0.1;
    var hourDeg = (h % 12) * 30 + m * 0.5;

    hourHand.setAttribute('transform', 'rotate(' + hourDeg + ' ' + cx + ' ' + cy + ')');
    minuteHand.setAttribute('transform', 'rotate(' + minuteDeg + ' ' + cx + ' ' + cy + ')');
    secondHand.setAttribute('transform', 'rotate(' + secondDeg + ' ' + cx + ' ' + cy + ')');

    hourHand.setAttribute('stroke', '#e8eef5');
    minuteHand.setAttribute('stroke', '#c8d3e0');
    secondHand.setAttribute('stroke', '#ff5a6e');
    hourHand.setAttribute('stroke-width', '6');
    hourHand.setAttribute('stroke-linecap', 'round');
    minuteHand.setAttribute('stroke-width', '4');
    minuteHand.setAttribute('stroke-linecap', 'round');
    secondHand.setAttribute('stroke-width', '2');

    digital.textContent = pad(h) + ':' + pad(m) + ':' + pad(s);
  }

  update();
  setInterval(update, 1000);
})();
</script>
</body>
</html>
