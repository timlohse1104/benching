<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Analog Clock</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  background: #1a1a2e;
  font-family: 'Courier New', monospace;
  color: #e0e0e0;
}
.clock-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
}
svg {
  filter: drop-shadow(0 0 20px rgba(100, 149, 237, 0.15));
}
.digital-time {
  font-size: 28px;
  font-weight: bold;
  letter-spacing: 3px;
  color: #a8c8ff;
  text-shadow: 0 0 10px rgba(168, 200, 255, 0.4);
}
</style>
</head>
<body>
<div class="clock-container">
  <svg id="clock" width="360" height="360" viewBox="0 0 360 360">
    <!-- Clock face background -->
    <circle cx="180" cy="180" r="170" fill="#16213e" stroke="#a8c8ff" stroke-width="2"/>
    <circle cx="180" cy="180" r="162" fill="none" stroke="#0f3460" stroke-width="1"/>

    <!-- Tick marks will be generated by JS -->
    <g id="ticks"></g>

    <!-- Hour numbers -->
    <g id="numbers" font-size="16" fill="#a8c8ff" text-anchor="middle" dominant-baseline="central" font-family="sans-serif"></g>

    <!-- Hour hand -->
    <g id="hour-hand">
      <polygon points="177,180 183,180 181,90 179,90" fill="#e0e0e0"/>
    </g>

    <!-- Minute hand -->
    <g id="minute-hand">
      <polygon points="178,180 182,180 180,60 178,60" fill="#a8c8ff"/>
    </g>

    <!-- Second hand -->
    <g id="second-hand">
      <rect x="178.5" y="60" width="3" height="130" fill="#e94560"/>
      <rect x="178.5" y="180" width="3" height="25" fill="#e94560"/>
    </g>

    <!-- Center dot -->
    <circle cx="180" cy="180" r="6" fill="#e94560" stroke="#a8c8ff" stroke-width="2"/>
    <circle cx="180" cy="180" r="2.5" fill="#ffffff"/>
  </svg>

  <div class="digital-time" id="digital-time">00:00:00</div>
</div>

<script>
(function() {
  var svg = document.getElementById('ticks');
  var nums = document.getElementById('numbers');
  var hourHand = document.getElementById('hour-hand');
  var minuteHand = document.getElementById('minute-hand');
  var secondHand = document.getElementById('second-hand');
  var digitalTime = document.getElementById('digital-time');

  var cx = 180, cy = 180, r = 155;

  // Generate tick marks
  for (var i = 0; i < 60; i++) {
    var angle = (i * 6 - 90) * Math.PI / 180;
    var isHour = i % 5 === 0;
    var outerR = 160;
    var innerR = isHour ? 142 : 149;
    var x1 = cx + outerR * Math.cos(angle);
    var y1 = cy + outerR * Math.sin(angle);
    var x2 = cx + innerR * Math.cos(angle);
    var y2 = cy + innerR * Math.sin(angle);

    var line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1.toFixed(2));
    line.setAttribute('y1', y1.toFixed(2));
    line.setAttribute('x2', x2.toFixed(2));
    line.setAttribute('y2', y2.toFixed(2));
    line.setAttribute('stroke', isHour ? '#e0e0e0' : '#537099');
    line.setAttribute('stroke-width', isHour ? '2.5' : '1');
    line.setAttribute('stroke-linecap', 'round');
    svg.appendChild(line);
  }

  // Generate hour numbers
  var numberPositions = [
    { val: 12, angle: -90 },
    { val: 1, angle: -60 },
    { val: 2, angle: -30 },
    { val: 3, angle: 0 },
    { val: 4, angle: 30 },
    { val: 5, angle: 60 },
    { val: 6, angle: 90 },
    { val: 7, angle: 120 },
    { val: 8, angle: 150 },
    { val: 9, angle: 180 },
    { val: 10, angle: 210 },
    { val: 11, angle: 240 }
  ];

  var numR = 130;
  for (var j = 0; j < numberPositions.length; j++) {
    var np = numberPositions[j];
    var na = np.angle * Math.PI / 180;
    var nx = cx + numR * Math.cos(na);
    var ny = cy + numR * Math.sin(na);

    var text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', nx.toFixed(2));
    text.setAttribute('y', ny.toFixed(2));
    text.textContent = np.val;
    nums.appendChild(text);
  }

  // Update clock
  function update() {
    var now = new Date();
    var h = now.getHours() % 12;
    var m = now.getMinutes();
    var s = now.getSeconds();
    var ms = now.getMilliseconds();

    var hourDeg = h * 30 + m * 0.5 + s / 120;
    var minDeg = m * 6 + s * 0.1;
    var secDeg = s * 6 + ms / 1000 * 6;

    hourHand.setAttribute('transform', 'rotate(' + hourDeg + ', 180, 180)');
    minuteHand.setAttribute('transform', 'rotate(' + minDeg + ', 180, 180)');
    secondHand.setAttribute('transform', 'rotate(' + secDeg + ', 180, 180)');

    var hh = String(now.getHours()).padStart(2, '0');
    var mm = String(m).padStart(2, '0');
    var ss = String(s).padStart(2, '0');
    digitalTime.textContent = hh + ':' + mm + ':' + ss;
  }

  update();
  setInterval(update, 200);
})();
</script>
</body>
</html>
