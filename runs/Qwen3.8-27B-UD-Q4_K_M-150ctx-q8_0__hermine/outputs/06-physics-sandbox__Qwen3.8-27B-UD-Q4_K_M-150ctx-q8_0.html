<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bounce Lab — 2D Physics Sandbox</title>
<style>
  :root{
    --bg:#0c111c;
    --panel:rgba(19,26,41,.92);
    --line:rgba(255,255,255,.07);
    --text:#e8edf6;
    --muted:#8b96ad;
    --accent:#ffb454;
    --accent-2:#ff7a45;
    --mono:ui-monospace,"SF Mono","Cascadia Code","JetBrains Mono",Menlo,Consolas,monospace;
    --sans:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; overflow:hidden; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased; user-select:none;
  }
  #scene{
    position:fixed; inset:0; display:block; z-index:0;
    cursor:crosshair; touch-action:none;
  }

  /* ---------- control panel ---------- */
  .panel{
    position:fixed; top:16px; left:16px; z-index:10; width:292px;
    max-height:calc(100dvh - 32px);
    display:flex; flex-direction:column;
    background:var(--panel);
    -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px);
    border:1px solid var(--line); border-radius:16px;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
    animation:panelIn .5s cubic-bezier(.2,.7,.3,1) both;
  }
  @keyframes panelIn{ from{ opacity:0; transform:translateX(-16px);} to{ opacity:1; transform:none;} }

  .panel-head{
    display:flex; align-items:center; gap:11px;
    padding:13px 12px 12px 14px;
    border-bottom:1px solid var(--line);
    flex:none;
  }
  .logo{
    position:relative; flex:none; width:34px; height:34px; border-radius:10px; overflow:hidden;
    background:linear-gradient(135deg,#1d2740,#131a2c);
    border:1px solid #2b3552;
  }
  .logo-dot{
    position:absolute; left:50%; bottom:5px; width:9px; height:9px; margin-left:-4.5px;
    border-radius:50%; background:var(--accent);
    animation:logoBounce 1.3s infinite;
  }
  @keyframes logoBounce{
    0%   { transform:translateY(-15px) scale(1,1); animation-timing-function:ease-in; }
    50%  { transform:translateY(0)     scale(1.3,.65); animation-timing-function:ease-out; }
    100% { transform:translateY(-15px) scale(1,1); }
  }
  .brand h1{
    margin:0; font-family:var(--mono); font-size:14px; font-weight:700;
    letter-spacing:.16em; line-height:1;
  }
  .brand h1 span{ color:var(--accent); }
  .brand p{
    margin:4px 0 0; font-size:10.5px; letter-spacing:.03em; color:var(--muted);
  }
  .icon-btn{
    margin-left:auto; flex:none; width:26px; height:26px; border:none; border-radius:8px;
    background:transparent; color:var(--muted); cursor:pointer;
    display:grid; place-items:center; transition:background .15s, color .15s;
  }
  .icon-btn:hover{ background:rgba(255,255,255,.07); color:var(--text); }
  .icon-btn svg{ transition:transform .28s ease; }
  .panel.collapsed .icon-btn svg{ transform:rotate(-180deg); }

  .panel-body{
    display:flex; flex-direction:column; gap:13px;
    padding:14px; overflow-y:auto; overflow-x:hidden;
    max-height:520px; opacity:1;
    transition:max-height .32s ease, opacity .22s ease, padding .32s ease;
  }
  .panel.collapsed .panel-body{ max-height:0; opacity:0; padding-top:0; padding-bottom:0; }
  .panel-body::-webkit-scrollbar{ width:6px; }
  .panel-body::-webkit-scrollbar-thumb{ background:#2b3552; border-radius:3px; }

  /* stats */
  .stats{ display:grid; grid-template-columns:1.25fr 1fr; gap:8px; }
  .stat{
    background:rgba(255,255,255,.035); border:1px solid rgba(255,255,255,.06);
    border-radius:10px; padding:8px 10px 7px; min-width:0;
  }
  .stat-energy{ grid-column:1 / -1; display:flex; align-items:center; gap:10px; }
  .stat-energy .stat-label{ margin-bottom:0; flex:none; }
  .stat-label{
    display:block; font-size:9.5px; font-weight:700; letter-spacing:.16em;
    text-transform:uppercase; color:var(--muted); margin-bottom:3px;
  }
  .stat-value{
    font-family:var(--mono); font-size:22px; font-weight:700; line-height:1;
    display:inline-block; transform-origin:left center;
  }
  #ballCount{ color:var(--accent); }
  .stat-value.pop{ animation:pop .3s ease; }
  @keyframes pop{ 0%{transform:scale(1);} 40%{transform:scale(1.28);} 100%{transform:scale(1);} }
  .energy-bar{ flex:1; height:6px; background:#1c2438; border-radius:3px; overflow:hidden; }
  .energy-fill{
    height:100%; width:0%; border-radius:3px;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
  }

  /* sliders */
  .control{ display:flex; flex-direction:column; gap:4px; }
  .control-row{ display:flex; justify-content:space-between; align-items:baseline; }
  .control-row label{ font-size:12px; font-weight:600; color:#cdd6e8; }
  .control-row output{
    font-family:var(--mono); font-size:11px; color:var(--accent);
    background:rgba(255,180,84,.08); border:1px solid rgba(255,180,84,.16);
    padding:2px 7px; border-radius:6px;
  }
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:20px;
    background:transparent; cursor:pointer; margin:2px 0 0;
  }
  input[type=range]::-webkit-slider-runnable-track{
    height:4px; border-radius:2px;
    background:linear-gradient(90deg, var(--accent) var(--fill,50%), #2a3550 var(--fill,50%));
  }
  input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none; width:14px; height:14px; margin-top:-5px; border-radius:50%;
    background:var(--accent); border:2px solid #0d1320;
    box-shadow:0 0 0 0 rgba(255,180,84,0);
    transition:box-shadow .18s ease, transform .18s ease;
  }
  input[type=range]:hover::-webkit-slider-thumb{ transform:scale(1.18); box-shadow:0 0 0 5px rgba(255,180,84,.15); }
  input[type=range]:active::-webkit-slider-thumb{ transform:scale(1.05); box-shadow:0 0 0 7px rgba(255,180,84,.22); }
  input[type=range]::-moz-range-track{ height:4px; border-radius:2px; background:#2a3550; }
  input[type=range]::-moz-range-progress{ height:4px; border-radius:2px; background:var(--accent); }
  input[type=range]::-moz-range-thumb{
    width:12px; height:12px; border-radius:50%; background:var(--accent); border:2px solid #0d1320;
  }
  input[type=range]:focus-visible{ outline:2px solid var(--accent); outline-offset:4px; border-radius:4px; }

  /* switch */
  .switch-row{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:2px 0; }
  .switch-label{ font-size:12px; font-weight:600; color:#cdd6e8; display:block; }
  .switch-sub{ font-family:var(--mono); font-size:9px; letter-spacing:.16em; color:var(--accent); display:block; margin-top:2px; }
  .switch-sub.off{ color:var(--muted); }
  .switch{
    position:relative; flex:none; width:42px; height:24px; padding:0;
    border-radius:999px; background:#232e49; border:1px solid #33405f; cursor:pointer;
    transition:background .2s, border-color .2s;
  }
  .switch .knob{
    position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%;
    background:#8fa0c2; transition:transform .22s cubic-bezier(.34,1.4,.5,1), background .2s;
  }
  .switch[aria-checked="true"]{ background:rgba(255,180,84,.25); border-color:var(--accent); }
  .switch[aria-checked="true"] .knob{ transform:translateX(18px); background:var(--accent); }
  .switch:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  /* buttons */
  .btn-row{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:2px; }
  .btn{
    padding:10px 8px; border-radius:10px; font-family:var(--sans);
    font-size:12px; font-weight:700; letter-spacing:.04em; cursor:pointer;
    transition:transform .12s ease, box-shadow .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:active{ transform:scale(.97); }
  .btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .btn-primary{ background:var(--accent); color:#1a1205; border:1px solid var(--accent); }
  .btn-primary:hover{ transform:translateY(-1px); box-shadow:0 6px 16px rgba(255,180,84,.3); filter:brightness(1.06); }
  .btn-ghost{ background:transparent; color:#dfe6f3; border:1px solid #33405f; }
  .btn-ghost:hover{ transform:translateY(-1px); border-color:#4a5b8a; background:rgba(255,255,255,.05); }

  /* hint */
  .hint{
    position:fixed; left:50%; bottom:20px; transform:translateX(-50%); z-index:5;
    font-family:var(--mono); font-size:10.5px; letter-spacing:.22em; text-transform:uppercase;
    color:rgba(232,237,246,.42); pointer-events:none; white-space:nowrap;
    transition:opacity .7s ease;
  }
  .hint.hidden{ opacity:0; }

  @media (max-width:600px){
    .panel{ left:10px; right:10px; top:10px; width:auto; }
  }
  @media (prefers-reduced-motion:reduce){
    .panel{ animation:none; }
    .logo-dot{ animation:none; transform:translateY(-6px); }
  }
</style>
</head>
<body>
<canvas id="scene" aria-label="Physics sandbox: click to drop a ball, drag to fling"></canvas>

<aside class="panel" id="panel" aria-label="Simulation controls">
  <div class="panel-head">
    <div class="logo" aria-hidden="true"><span class="logo-dot"></span></div>
    <div class="brand">
      <h1>BOUNCE<span>LAB</span></h1>
      <p>click to drop &middot; drag to fling</p>
    </div>
    <button class="icon-btn" id="collapseBtn" aria-expanded="true" title="Collapse panel" aria-label="Collapse panel">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"></polyline></svg>
    </button>
  </div>

  <div class="panel-body" id="panelBody">
    <div class="stats">
      <div class="stat">
        <span class="stat-label">Balls</span>
        <span class="stat-value" id="ballCount">0</span>
      </div>
      <div class="stat">
        <span class="stat-label">FPS</span>
        <span class="stat-value" id="fps">60</span>
      </div>
      <div class="stat stat-energy">
        <span class="stat-label">Energy</span>
        <div class="energy-bar"><div class="energy-fill" id="energyFill"></div></div>
      </div>
    </div>

    <div class="control">
      <div class="control-row">
        <label for="gravity">Gravity</label>
        <output id="gravityOut" for="gravity">1800</output>
      </div>
      <input type="range" id="gravity" min="0" max="3000" step="10" value="1800">
    </div>

    <div class="control">
      <div class="control-row">
        <label for="restitution">Restitution</label>
        <output id="restitutionOut" for="restitution">0.82</output>
      </div>
      <input type="range" id="restitution" min="0" max="0.98" step="0.01" value="0.82">
    </div>

    <div class="control">
      <div class="control-row">
        <label for="friction">Friction</label>
        <output id="frictionOut" for="friction">0.12</output>
      </div>
      <input type="range" id="friction" min="0" max="1" step="0.01" value="0.12">
    </div>

    <div class="switch-row">
      <div>
        <span class="switch-label">Ball collisions</span>
        <span class="switch-sub" id="collState">ON</span>
      </div>
      <button class="switch" id="collToggle" role="switch" aria-checked="true" aria-label="Toggle ball collisions">
        <span class="knob"></span>
      </button>
    </div>

    <div class="btn-row">
      <button class="btn btn-primary" id="resetBtn">Reset scene</button>
      <button class="btn btn-ghost" id="addBtn">+10 balls</button>
    </div>
  </div>
</aside>

<div class="hint" id="hint">click to drop &middot; drag to fling</div>

<script>
(function(){
"use strict";

var canvas = document.getElementById('scene');
var ctx = canvas.getContext('2d');
var bg = document.createElement('canvas');
var bctx = bg.getContext('2d');

var W = 0, H = 0, DPR = 1;

var P = { gravity: 1800, restitution: 0.82, friction: 0.12, collisions: true };

var PALETTE = ['#ff5c5c','#ff8f5c','#ffb454','#ffe66d','#7ee081','#35d0ba','#4cc9f0','#5a8bff','#b18cff','#ff7ac8'];

function shade(hex, amt){
  var n = parseInt(hex.slice(1), 16);
  var r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  var t = amt < 0 ? 0 : 255, a = Math.abs(amt);
  r = Math.round(r + (t - r) * a);
  g = Math.round(g + (t - g) * a);
  b = Math.round(b + (t - b) * a);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}
var COLORS = PALETTE.map(function(c){
  return { base: c, light: shade(c, 0.45), dark: shade(c, -0.45) };
});

/* ---------- state ---------- */
var balls = [];
var ripples = [];
var MAX_BALLS = 250;
var STEP = 1 / 180;
var MAX_SPEED = 3200;
var FLING_K = 6;
var FLING_MAX = 3400;

function makeBall(x, y, vx, vy, r){
  var c = COLORS[(Math.random() * COLORS.length) | 0];
  return { x: x, y: y, vx: vx, vy: vy, r: r, m: r * r, inv: 1 / (r * r), color: c, spin: 0, a: Math.random() * Math.PI * 2 };
}

function addRipple(x, y, r0, color, expand){
  if (ripples.length > 50) return;
  ripples.push({ x: x, y: y, r0: r0, color: color, expand: expand, life: 1 });
}

var countEl = document.getElementById('ballCount');
var fpsEl = document.getElementById('fps');
var energyEl = document.getElementById('energyFill');
var hintEl = document.getElementById('hint');
var shownCount = -1;

function updateCount(){
  if (balls.length === shownCount) return;
  shownCount = balls.length;
  countEl.textContent = balls.length;
  countEl.classList.remove('pop');
  void countEl.offsetWidth;
  countEl.classList.add('pop');
}

function spawnBall(x, y, vx, vy){
  var r = 10 + Math.random() * 17;
  x = Math.min(Math.max(x, r), Math.max(r, W - r));
  y = Math.min(Math.max(y, r), Math.max(r, H - r));
  var b = makeBall(x, y, vx, vy, r);
  balls.push(b);
  if (balls.length > MAX_BALLS) balls.shift();
  addRipple(x, y, r, b.color.base, 34);
  updateCount();
  return b;
}

function seed(n){
  balls = [];
  ripples = [];
  for (var i = 0; i < n; i++){
    var r = 10 + Math.random() * 17;
    spawnBall(r + Math.random() * Math.max(1, W - 2 * r), r + Math.random() * Math.max(1, H * 0.55),
              (Math.random() - 0.5) * 260, (Math.random() - 0.5) * 140);
  }
}

/* ---------- background (pre-rendered) ---------- */
function paintBackground(){
  var g = bctx;
  g.clearRect(0, 0, W, H);
  var base = g.createLinearGradient(0, 0, 0, H);
  base.addColorStop(0, '#101828');
  base.addColorStop(1, '#0a0f1a');
  g.fillStyle = base;
  g.fillRect(0, 0, W, H);

  g.strokeStyle = 'rgba(120,150,210,0.05)';
  g.lineWidth = 1;
  var step = 44;
  g.beginPath();
  for (var x = step; x < W; x += step){ g.moveTo(x + 0.5, 0); g.lineTo(x + 0.5, H); }
  for (var y = step; y < H; y += step){ g.moveTo(0, y + 0.5); g.lineTo(W, y + 0.5); }
  g.stroke();

  g.strokeStyle = 'rgba(255,180,84,0.12)';
  g.beginPath(); g.moveTo(0, H - 1); g.lineTo(W, H - 1); g.stroke();

  var v = g.createRadialGradient(W / 2, H * 0.42, Math.min(W, H) * 0.25, W / 2, H * 0.5, Math.max(W, H) * 0.75);
  v.addColorStop(0, 'rgba(0,0,0,0)');
  v.addColorStop(1, 'rgba(0,0,0,0.45)');
  g.fillStyle = v;
  g.fillRect(0, 0, W, H);
}

function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  bg.width = Math.round(W * DPR);
  bg.height = Math.round(H * DPR);
  bctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  paintBackground();
  for (var i = 0; i < balls.length; i++){
    var b = balls[i];
    b.x = Math.min(Math.max(b.x, b.r), Math.max(b.r, W - b.r));
    b.y = Math.min(Math.max(b.y, b.r), Math.max(b.r, H - b.r));
  }
}

/* ---------- physics ---------- */
function physics(dt){
  var g = P.gravity, e = P.restitution, fr = P.friction;
  var drag = Math.max(0, 1 - fr * dt);
  var i, b;

  for (i = 0; i < balls.length; i++){
    b = balls[i];
    b.vy += g * dt;
    b.vx *= drag;
    b.vy *= drag;

    var sp2 = b.vx * b.vx + b.vy * b.vy;
    if (sp2 > MAX_SPEED * MAX_SPEED){
      var s = MAX_SPEED / Math.sqrt(sp2);
      b.vx *= s; b.vy *= s;
    }

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    /* walls */
    if (b.x < b.r){
      b.x = b.r;
      if (b.vx < 0){ b.vx = -b.vx * e; b.vy *= (1 - fr * 0.3); b.spin = b.vy / b.r * 0.5; }
    } else if (b.x > W - b.r){
      b.x = W - b.r;
      if (b.vx > 0){ b.vx = -b.vx * e; b.vy *= (1 - fr * 0.3); b.spin = -b.vy / b.r * 0.5; }
    }
    if (b.y < b.r){
      b.y = b.r;
      if (b.vy < 0){ b.vy = -b.vy * e; b.vx *= (1 - fr * 0.3); }
    } else if (b.y > H - b.r){
      b.y = H - b.r;
      if (b.vy > 0){
        var impact = b.vy;
        b.vy = -b.vy * e;
        b.vx *= (1 - fr * 0.5);
        b.spin = b.vx / b.r;
        if (Math.abs(b.vy) < Math.max(30, g * dt * 2.2)) b.vy = 0;
        if (impact > 340) addRipple(b.x, H - 2, b.r * 0.6, 'rgba(255,255,255,0.5)', 18 + impact * 0.015);
      }
      if (Math.abs(b.vx) < 4) b.vx = 0;
    }

    b.a += b.spin * dt;
    b.spin *= Math.max(0, 1 - fr * dt * 0.8);
  }

  /* circle-circle collisions */
  if (P.collisions){
    for (i = 0; i < balls.length; i++){
      var a = balls[i];
      for (var j = i + 1; j < balls.length; j++){
        var c = balls[j];
        var dx = c.x - a.x, dy = c.y - a.y;
        var min = a.r + c.r;
        var d2 = dx * dx + dy * dy;
        if (d2 >= min * min) continue;

        var d = Math.sqrt(d2), nx, ny;
        if (d < 1e-6){
          var ang = Math.random() * 6.2832;
          nx = Math.cos(ang); ny = Math.sin(ang); d = 0.001;
        } else {
          nx = dx / d; ny = dy / d;
        }

        var imSum = a.inv + c.inv;

        /* positional correction (Baumgarte-style, with slop) */
        var pen = min - d;
        var corr = Math.max(pen - 0.4, 0) / imSum * 0.85;
        a.x -= nx * corr * a.inv; a.y -= ny * corr * a.inv;
        c.x += nx * corr * c.inv; c.y += ny * corr * c.inv;

        /* impulse */
        var rvx = c.vx - a.vx, rvy = c.vy - a.vy;
        var rvn = rvx * nx + rvy * ny;
        if (rvn < 0){
          var jimp = -(1 + e) * rvn / imSum;
          a.vx -= jimp * a.inv * nx; a.vy -= jimp * a.inv * ny;
          c.vx += jimp * c.inv * nx; c.vy += jimp * c.inv * ny;

          var speed = -rvn;
          if (speed > 280){
            addRipple(a.x + nx * a.r, a.y + ny * a.r, (a.r + c.r) * 0.3, 'rgba(255,255,255,0.5)', 24 + speed * 0.02);
          }
        }
      }
    }
  }
}

/* ---------- render ---------- */
function render(frameDt){
  ctx.drawImage(bg, 0, 0, W, H);
  var i, b;

  /* floor shadows */
  for (i = 0; i < balls.length; i++){
    b = balls[i];
    var gap = H - (b.y + b.r);
    if (gap < 90){
      var t = 1 - gap / 90;
      var sw = b.r * (0.75 + 0.5 * t);
      ctx.globalAlpha = 0.28 * t;
      ctx.fillStyle = '#000';
      ctx.beginPath();
      ctx.ellipse(b.x, H - 3, sw, sw * 0.28, 0, 0, 6.2832);
      ctx.fill();
    }
  }
  ctx.globalAlpha = 1;

  /* balls */
  for (i = 0; i < balls.length; i++){
    b = balls[i];
    var col = b.color;
    var grd = ctx.createRadialGradient(b.x - b.r * 0.35, b.y - b.r * 0.4, b.r * 0.1, b.x, b.y, b.r);
    grd.addColorStop(0, col.light);
    grd.addColorStop(0.55, col.base);
    grd.addColorStop(1, col.dark);
    ctx.fillStyle = grd;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, 6.2832);
    ctx.fill();

    /* spin decal */
    var ox = Math.cos(b.a) * b.r * 0.5, oy = Math.sin(b.a) * b.r * 0.5;
    ctx.globalAlpha = 0.45;
    ctx.fillStyle = col.dark;
    ctx.beginPath();
    ctx.arc(b.x + ox, b.y + oy, b.r * 0.18, 0, 6.2832);
    ctx.fill();
    ctx.globalAlpha = 1;

    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r - 0.5, 0, 6.2832);
    ctx.stroke();
  }

  /* impact ripples */
  for (i = ripples.length - 1; i >= 0; i--){
    var rp = ripples[i];
    rp.life -= frameDt * 2.4;
    if (rp.life <= 0){ ripples.splice(i, 1); continue; }
    var rr = rp.r0 + (rp.r0 + rp.expand) * (1 - rp.life);
    ctx.globalAlpha = rp.life * 0.4;
    ctx.strokeStyle = rp.color;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(rp.x, rp.y, rr, 0, 6.2832);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  /* aim preview */
  if (drag && drag.moved){
    var dx = drag.cx - drag.sx, dy = drag.cy - drag.sy;
    var sp = Math.hypot(dx, dy);
    var vx = dx * FLING_K, vy = dy * FLING_K;
    if (sp * FLING_K > FLING_MAX){
      var sc = FLING_MAX / (sp * FLING_K);
      vx *= sc; vy *= sc;
    }

    /* trajectory */
    var px = drag.sx, py = drag.sy, tvx = vx, tvy = vy;
    var tdt = 1 / 60;
    for (i = 0; i < 50; i++){
      tvy += P.gravity * tdt;
      var dr = Math.max(0, 1 - P.friction * tdt);
      tvx *= dr; tvy *= dr;
      px += tvx * tdt; py += tvy * tdt;
      if (px < 16){ px = 16; tvx *= -P.restitution; }
      else if (px > W - 16){ px = W - 16; tvx *= -P.restitution; }
      if (py < 16){ py = 16; tvy *= -P.restitution; }
      else if (py > H - 16){ py = H - 16; tvy *= -P.restitution; }
      if (i % 2 === 0){
        var tt = i / 50;
        ctx.globalAlpha = (1 - tt) * 0.55;
        ctx.fillStyle = '#ffb454';
        ctx.beginPath();
        ctx.arc(px, py, 3.2 * (1 - tt * 0.5), 0, 6.2832);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    /* ghost ball */
    ctx.setLineDash([5, 5]);
    ctx.strokeStyle = 'rgba(255,180,84,0.9)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(drag.sx, drag.sy, 16, 0, 6.2832);
    ctx.stroke();

    /* drag vector */
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.moveTo(drag.sx, drag.sy);
    ctx.lineTo(drag.cx, drag.cy);
    ctx.stroke();
    ctx.setLineDash([]);

    var ang = Math.atan2(dy, dx);
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.beginPath();
    ctx.moveTo(drag.cx, drag.cy);
    ctx.lineTo(drag.cx - 10 * Math.cos(ang - 0.4), drag.cy - 10 * Math.sin(ang - 0.4));
    ctx.lineTo(drag.cx - 10 * Math.cos(ang + 0.4), drag.cy - 10 * Math.sin(ang + 0.4));
    ctx.closePath();
    ctx.fill();

    ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
    ctx.fillStyle = 'rgba(255,180,84,0.95)';
    ctx.fillText(Math.round(Math.min(sp * FLING_K, FLING_MAX)) + ' px/s', drag.cx + 12, drag.cy - 10);
  }
}

/* ---------- main loop (fixed timestep) ---------- */
var last = performance.now();
var acc = 0;
var fpsEMA = 60, fpsTimer = 0;

function frame(now){
  var dt = (now - last) / 1000;
  last = now;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) dt = 0.0001;

  acc += dt;
  var steps = 0;
  while (acc >= STEP && steps < 8){
    physics(STEP);
    acc -= STEP;
    steps++;
  }
  if (steps === 8) acc = 0;

  render(dt);

  fpsEMA += (1 / dt - fpsEMA) * 0.08;
  fpsTimer += dt;
  if (fpsTimer > 0.4){
    fpsTimer = 0;
    fpsEl.textContent = Math.round(fpsEMA);
    var E = 0;
    for (var i = 0; i < balls.length; i++){
      var b = balls[i];
      E += 0.5 * b.m * (b.vx * b.vx + b.vy * b.vy);
    }
    var norm = balls.length > 0 ? Math.min(E / (balls.length * 4e7), 1) : 0;
    energyEl.style.width = (norm * 100).toFixed(1) + '%';
  }
  requestAnimationFrame(frame);
}

/* ---------- pointer interaction ---------- */
var drag = null;

function pointerPos(e){
  var rect = canvas.getBoundingClientRect();
  return { x: e.clientX - rect.left, y: e.clientY - rect.top };
}

canvas.addEventListener('pointerdown', function(e){
  if (e.pointerType === 'mouse' && e.button !== 0) return;
  var p = pointerPos(e);
  drag = { sx: p.x, sy: p.y, cx: p.x, cy: p.y, moved: false };
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* noop */ }
  e.preventDefault();
});

canvas.addEventListener('pointermove', function(e){
  if (!drag) return;
  var p = pointerPos(e);
  drag.cx = p.x; drag.cy = p.y;
  if (Math.hypot(drag.cx - drag.sx, drag.cy - drag.sy) > 7) drag.moved = true;
});

canvas.addEventListener('pointerup', function(e){
  if (!drag) return;
  var d = drag;
  drag = null;
  hintEl.classList.add('hidden');
  if (!d.moved){
    spawnBall(d.sx, d.sy, (Math.random() - 0.5) * 120, 0);
  } else {
    var dx = d.cx - d.sx, dy = d.cy - d.sy;
    var sp = Math.hypot(dx, dy);
    var vx = dx * FLING_K, vy = dy * FLING_K;
    if (sp * FLING_K > FLING_MAX){
      var s = FLING_MAX / (sp * FLING_K);
      vx *= s; vy *= s;
    }
    spawnBall(d.sx, d.sy, vx, vy);
  }
});

canvas.addEventListener('pointercancel', function(){ drag = null; });

/* ---------- controls ---------- */
function bindSlider(id, key, fmt){
  var el = document.getElementById(id);
  var out = document.getElementById(id + 'Out');
  function paint(){
    var min = parseFloat(el.min), max = parseFloat(el.max), v = parseFloat(el.value);
    el.style.setProperty('--fill', ((v - min) / (max - min) * 100) + '%');
    out.textContent = fmt(v);
    P[key] = v;
  }
  el.addEventListener('input', paint);
  paint();
}
bindSlider('gravity', 'gravity', function(v){ return String(Math.round(v)); });
bindSlider('restitution', 'restitution', function(v){ return v.toFixed(2); });
bindSlider('friction', 'friction', function(v){ return v.toFixed(2); });

var collBtn = document.getElementById('collToggle');
var collState = document.getElementById('collState');
collBtn.addEventListener('click', function(){
  P.collisions = !P.collisions;
  collBtn.setAttribute('aria-checked', String(P.collisions));
  collState.textContent = P.collisions ? 'ON' : 'OFF';
  collState.classList.toggle('off', !P.collisions);
});

document.getElementById('resetBtn').addEventListener('click', function(){
  seed(14);
});

document.getElementById('addBtn').addEventListener('click', function(){
  for (var i = 0; i < 10; i++){
    var r = 10 + Math.random() * 17;
    spawnBall(r + Math.random() * Math.max(1, W - 2 * r), r + Math.random() * 80,
              (Math.random() - 0.5) * 300, Math.random() * 100);
  }
  hintEl.classList.add('hidden');
});

var panel = document.getElementById('panel');
var cBtn = document.getElementById('collapseBtn');
cBtn.addEventListener('click', function(){
  var col = panel.classList.toggle('collapsed');
  cBtn.setAttribute('aria-expanded', String(!col));
});

/* ---------- init ---------- */
window.addEventListener('resize', resize);
resize();
seed(12);
requestAnimationFrame(frame);

})();
</script>
</body>
