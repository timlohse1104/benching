<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Particle Simulation</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0a0a0f;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial,sans-serif}
canvas{display:block}
#panel{position:absolute;top:10px;left:10px;background:rgba(0,0,0,0.6);backdrop-filter:blur(6px);color:#e8e8e8;padding:12px 14px;border-radius:10px;font-size:13px;line-height:1.6}
#panel label{display:block;margin:6px 0}
#panel input[type=range]{width:160px;vertical-align:middle}
#panel span{margin-left:6px;min-width:36px;display:inline-block;text-align:right;color:#aee}
#fps{position:absolute;top:10px;right:12px;color:#9aa;background:rgba(0,0,0,0.5);padding:4px 8px;border-radius:6px;font-size:12px}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
<label>Particles <input id="count" type="range" min="100" max="1000" step="50" value="500"><span id="countVal">500</span></label>
<label>Gravity <input id="grav" type="range" min="0" max="0.2" step="0.01" value="0.05"><span id="gravVal">0.05</span></label>
<label>Attraction <input id="attr" type="range" min="0" max="0.5" step="0.01" value="0.15"><span id="attrVal">0.15</span></label>
<label><input id="mode" type="checkbox"> Repel</label>
</div>
<div id="fps">0 FPS</div>
<script>
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const fpsEl=document.getElementById('fps');

function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
addEventListener('resize',resize);resize();

let particleCount=500;
let gravityVal=0.05;
let attractionVal=0.15;
let repelMode=false;

const mouse={x:-9999,y:-9999,active:false};
canvas.addEventListener('mousemove',e=>{
 const r=canvas.getBoundingClientRect();
 mouse.x=e.clientX-r.left;
 mouse.y=e.clientY-r.top;
 mouse.active=true;
});
canvas.addEventListener('mouseleave',()=>mouse.active=false);

function Particle(){
 this.x=Math.random()*canvas.width;
 this.y=Math.random()*canvas.height;
 this.vx=(Math.random()-0.5)*2;
 this.vy=(Math.random()-0.5)*2;
 this.size=Math.random()*2+1.2;
 this.hue=Math.random()*60+180;
}
const particles=[];
function setParticleCount(n){
 while(particles.length<n) particles.push(new Particle());
 while(particles.length>n) particles.pop();
}
setParticleCount(particleCount);

document.getElementById('count').addEventListener('input',e=>{
 particleCount=+e.target.value;
 setParticleCount(particleCount);
 document.getElementById('countVal').textContent=e.target.value;
});
document.getElementById('grav').addEventListener('input',e=>{
 gravityVal=parseFloat(e.target.value);
 document.getElementById('gravVal').textContent=e.target.value;
});
document.getElementById('attr').addEventListener('input',e=>{
 attractionVal=parseFloat(e.target.value);
 document.getElementById('attrVal').textContent=e.target.value;
});
document.getElementById('mode').addEventListener('change',e=>repelMode=e.target.checked);

let last=performance.now(),frames=0;
function animate(now){
 requestAnimationFrame(animate);
 ctx.fillStyle='rgba(10,10,15,0.18)';
 ctx.fillRect(0,0,canvas.width,canvas.height);
 for(const p of particles){
   p.vy+=gravityVal;
   if(mouse.active){
     const dx=mouse.x-p.x;
     const dy=mouse.y-p.y;
     const distSq=dx*dx+dy*dy;
     const dist=Math.sqrt(distSq);
     if(dist<200 && dist>1){
       const force=attractionVal*(1-dist/200);
       const ang=Math.atan2(dy,dx);
       const fx=Math.cos(ang)*force;
       const fy=Math.sin(ang)*force;
       p.vx+=(repelMode?-fx:fx);
       p.vy+=(repelMode?-fy:fy);
     }
   }
   p.x+=p.vx;
   p.y+=p.vy;
   if(p.x<0||p.x>canvas.width){p.vx*=-0.7;p.x=Math.max(0,Math.min(canvas.width,p.x));}
   if(p.y<0||p.y>canvas.height){p.vy*=-0.7;p.y=Math.max(0,Math.min(canvas.height,p.y));}
   ctx.beginPath();
   ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
   ctx.fillStyle=`hsla(${p.hue},70%,60%,0.85)`;
   ctx.fill();
 }
 frames++;
 if(now-last>=1000){fpsEl.textContent=frames+' FPS';frames=0;last=now;}
}
requestAnimationFrame(animate);
</script>
</body>
</html>
