# Example model registry. Copy this to `config/models.yaml` and edit:
#
#     cp config/models.example.yaml config/models.yaml
#
# The real `config/models.yaml` is gitignored so your local hosts / model list
# stay private. This example only ships a few representative entries.
#
# Disable any entry by setting `enabled: false`.
# Local entries (with `api_base`) do NOT need API keys.
# Cloud entries pick up keys from .env via standard env vars (OPENAI_API_KEY, etc.).
#
# kind
# ----
# Optional free-form label (any string, max 20 chars). Typically the device or
# host the model runs on, e.g. "workstation". It does NOT affect local/cloud
# classification (that stays auto-detected from provider/api_base) - it is only
# read back and shown as a badge in both the per-run dashboard (index.html) and
# the aggregate overview (runs/index.html). Omit it to show no badge.
#
# llama.cpp note
# ---------------
# A single `llama-server` process serves exactly ONE loaded model (the .gguf you
# passed via `-m`). The model's identifier on the wire is the name reported at
# `GET {api_base}/models` (the "id" field of each entry in `data`). Put that
# string in `model_name` here so the bench requests the right one.
#
# Tip: `curl http://localhost:8080/v1/models` shows the exact name to put in
# `model_name`. `llm-check list` also shows it after a preflight.

defaults:
  temperature: 0.7
  max_tokens: 32000
  timeout_s: 600       # local models can be slow; bump if needed
  concurrency: 4       # global cap on in-flight requests across the whole run

models:
  # -------- Local: llama.cpp server (OpenAI-compatible) --------
  - id: llamacpp-local
    provider: openai/llamacpp
    label: "llama.cpp (local)"
    kind: workstation             # free-form label; e.g. the host it runs on
    api_base: http://localhost:8080/v1
    api_key: not-needed           # litellm requires the field; server ignores it
    model_name: "your-model.gguf" # exact name from GET /v1/models
    concurrency: 1
    enabled: true

  # -------- Cloud (uncomment & set the matching key in .env) --------
  # - id: gpt-4o
  #   provider: openai/gpt-4o
  #   label: "GPT-4o"
  #   enabled: true
  #
  # - id: claude-opus
  #   provider: anthropic/claude-opus-4-20250514
  #   label: "Claude Opus 4"
  #   temperature: 0.3
  #   enabled: true
  #
  # - id: gemini-pro
  #   provider: gemini/gemini-2.5-pro
  #   label: "Gemini 2.5 Pro"
  #   enabled: true

  # -------- Dry-run fake (always available, no network) --------
  - id: dry-run
    provider: dryrun/canned
    label: "Dry-run (canned HTML)"
    kind: dryrun-box
    enabled: false      # auto-enabled when --dry-run is passed
